<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resultados | TRUST</title>
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#173F35;--green-2:#1F5446;--gold:#B8956A;--gold-2:#9C7A4E;--bg:#FAF8F2;--surface:#fff;--surface-2:#F1EDE3;--line:#E3DDD0;--line-2:#CFC6B4;--text:#1E241F;--muted:#6F726B;--faint:#97999B;--red:#A8342A;--ok:#2F7A4F;--shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--green);margin-bottom:20px}
.top h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:28px;color:var(--green);line-height:1.15}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600;margin-bottom:6px}
.btn{font:inherit;font-size:13px;font-weight:500;border-radius:999px;padding:9px 16px;border:1px solid var(--line-2);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green);color:var(--green)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg button{font:inherit;font-size:15px;font-weight:500;padding:12px 24px;border-radius:14px;border:1px solid var(--line-2);background:#fff;color:var(--text);cursor:pointer;min-width:170px;text-align:left;line-height:1.25}
.seg button small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.seg button:hover{border-color:var(--green)}
.seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.seg button[aria-pressed=true] small{color:rgba(255,255,255,.75)}
.rango{font-size:12px;color:var(--muted);margin:10px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:26px;color:var(--green);line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.g{background:var(--green)}.kpi.g b,.kpi.g span{color:#fff}.kpi.g span{opacity:.8}
h2{font-family:Lora,Georgia,serif;font-weight:500;font-size:21px;color:var(--green);margin:6px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:Poppins;font-size:12px;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:auto;margin-bottom:26px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
th.on{color:var(--green)}
td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-weight:500;color:var(--green);cursor:pointer}
td.n:hover{text-decoration:underline}
tr.dim td{color:var(--faint)}
tr.tot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--green)}
td.lead{font-weight:600;color:var(--green)}
td .crown{color:var(--gold-2);font-size:12px;margin-left:4px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-right:8px;min-width:2px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px}
.pill.ok{background:#E3F0E8;color:var(--ok)}.pill.lo{background:#F6E3E0;color:var(--red)}
.nota{font-size:12px;color:var(--muted);line-height:1.5}
.msg{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(23,63,53,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h3{font-family:Lora,serif;font-weight:500;font-size:22px;color:var(--green);margin-bottom:12px}
.mbox table td,.mbox table th{padding:8px 10px}
.mbox .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.lt th,.lt td{text-align:left}.lt .r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:500;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--text);padding:6px 16px 6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip i{font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}.chip.on i{color:rgba(255,255,255,.85)}
.chip.eq{border-style:dashed}
.ctip{font-size:11px;color:var(--faint);margin:6px 0 20px}
.fhead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.fhead h2{font-size:28px}
.mini{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:-8px;margin-right:2px;border:2px solid #fff}
.chip.on .mini{border-color:var(--gold)}
.av{width:84px;height:84px;border:3px solid var(--gold);border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Lora,serif;font-size:20px;flex:none}
@media print{.chips,.ctip{display:none}}
@media (max-width:640px){.mbox .cols{grid-template-columns:1fr}.seg button{min-width:0;flex:1}}
@media print{.noprint,.btn,.seg{display:none!important}body{background:#fff}.wrap{padding:0}.card{box-shadow:none;overflow:visible}.seg button[aria-pressed=true]{display:inline-block!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/auth.js"></script>
<script src="/auth.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Administración</div><h1>Resultados del equipo</h1><div class="sub">Marketing y ventas por asesor, listo para la junta semanal.</div></div>
    <div class="noprint" style="display:flex;gap:8px"><button class="btn" id="imp" type="button">Imprimir / PDF</button><a class="btn" href="index.html">← Administración</a></div>
  </div>
  <div class="seg noprint" id="seg" role="group" aria-label="Periodo"></div>
  <div class="rango" id="rango"></div>
  <div id="out"><div class="msg">Cargando resultados…</div></div>
</div>
<script>
const SB="https://xshhjvdmkuqesdlvczbb.supabase.co",KEY="sb_publishable_5erZfpELyuncW1nrReTaZw_BQj0bc-P";
let sb=null;try{sb=window.supabase.createClient(SB,KEY)}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const ESTANDAR_CITA=0.10,ESTANDAR_VISITA=0.05,ESTANDAR_APARTADO=0.02,ESTANDAR_CIERRE=0.01;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const $m=n=>"$"+Math.round(+n||0).toLocaleString("es-MX");
const fmtD=s=>{const[y,m,d]=s.split("-");return +d+" "+MESES[+m-1].slice(0,3).toLowerCase()+" "+y};
const esCita=l=>!!(l.cita||l.apartado||l.venta);
const esCredito=v=>v.tipo==="Crédito hipotecario";
const comTotal=v=>v.comision_monto!=null?+v.comision_monto:(+v.monto||0)*(+v.comision_pct||0)/100;

function periodos(){
  const h=new Date(),y=h.getFullYear(),m=h.getMonth();
  const qm=Math.floor(m/3)*3;
  const ant=new Date(y,m-1,1),antFin=new Date(y,m,0);
  return {
    q:{k:"q",t:"Q acumulado",s:"T"+(qm/3+1)+" · "+MESES[qm].slice(0,3)+"–"+MESES[qm+2].slice(0,3)+" "+y,a:iso(new Date(y,qm,1)),b:iso(h)},
    ant:{k:"ant",t:"Mes anterior",s:MESES[ant.getMonth()]+" "+ant.getFullYear(),a:iso(ant),b:iso(antFin)},
    act:{k:"act",t:"Mes actual",s:MESES[m]+" "+y+" (a hoy)",a:iso(new Date(y,m,1)),b:iso(h)}
  };
}
const P=periodos();
let CUR="ant";try{const s=localStorage.getItem("resPer");if(s&&P[s])CUR=s}catch(e){}
let LEADS=[],VENTAS=[],APART=[],EQ=[];

async function fetchAll(tabla,order){
  let all=[],from=0;
  for(;;){
    let q=sb.from(tabla).select("*").range(from,from+999);if(order)q=q.order(order,{ascending:false});
    const {data,error}=await q;if(error)throw error;
    all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000;
  }
  return all;
}
async function cargar(){
  try{
    const [l,v]=await Promise.all([fetchAll("leads","fecha"),fetchAll("ventas","fecha")]);
    LEADS=l;VENTAS=v;
    try{const {data}=await sb.from("asesores").select("*");EQ=data||[]}catch(e){EQ=[]}
    pintar();
  }catch(e){$("#out").innerHTML='<div class="msg">No se pudieron cargar los datos: '+esc(e.message||e)+'</div>'}
}
function botones(){
  $("#seg").innerHTML=["q","ant","act"].map(k=>`<button type="button" data-p="${k}" aria-pressed="${k===CUR}">${P[k].t}<small>${esc(P[k].s)}</small></button>`).join("");
}
function nombreAse(x){x=String(x||"").trim();return x}
function calc(p){
  const inR=f=>{f=String(f||"").slice(0,10);return f>=p.a&&f<=p.b};
  const M={};
  const get=n=>{n=nombreAse(n);const k=(!n||/^(ex|otro)$/i.test(n))?"__otros":n;return M[k]||(M[k]={n:k==="__otros"?"Otros / ex-asesores":k,otros:k==="__otros",leads:0,c:0,vi:0,ht:0,ap:0,v:0,cier:0,monto:0,ing:0,apN:0,apM:0,cierres:[],apars:[]})};
  EQ.filter(a=>a.activo!==false&&!a.admin).forEach(a=>get(a.nombre));
  LEADS.filter(l=>inR(l.fecha)).forEach(l=>{const r=get(l.asesor);r.leads++;if(esCita(l))r.c++;if(l.visita)r.vi++;if(l.hot)r.ht++;if(l.apartado)r.ap++;if(l.venta)r.v++;if(l.apartado||l.venta){r.apN++;r.apars.push(l)}});
  VENTAS.filter(v=>inR(v.fecha)&&!esCredito(v)).forEach(v=>{const r=get(v.asesor);r.cier++;r.monto+=+v.monto||0;r.ing+=comTotal(v);r.cierres.push(v)});
  return Object.values(M);
}
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
let SEL="";try{SEL=localStorage.getItem("resAse")||""}catch(e){}
function fotoInfo(url){const m=/#o=([vhs])&p=(\d+)/.exec(url||""),o=m?m[1]:"s",p=m?+m[2]:50;return {src:(url||"").split("#")[0],pos:o==="v"?"50% "+p+"%":o==="h"?p+"% 50%":"50% 50%"}}
function fotoDe(n){const a=EQ.find(x=>x.nombre===n);return a&&a.foto_url?fotoInfo(a.foto_url):null}
const avStyle=n=>{const f=fotoDe(n);return f?` style="background-image:url('${esc(f.src)}');background-position:${f.pos};background-size:cover" `:""}
const iniciales=n=>n.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function agregado(R){const E={n:"Equipo",eq:true,leads:0,c:0,vi:0,ht:0,ap:0,v:0,cier:0,monto:0,ing:0,apN:0,apM:0,cierres:[],apars:[]};R.forEach(r=>{["leads","c","vi","ht","ap","v","cier","monto","ing","apN","apM"].forEach(k=>E[k]+=r[k]);E.cierres=E.cierres.concat(r.cierres);E.apars=E.apars.concat(r.apars)});return E}
function pintar(){
  botones();const p=P[CUR];
  $("#rango").textContent="Del "+fmtD(p.a)+" al "+fmtD(p.b);
  const R=calc(p);window.__R=R;
  const lista=R.filter(r=>!r.otros||r.leads||r.cier||r.apN).sort((a,b)=>a.otros-b.otros||a.n.localeCompare(b.n));
  const E=agregado(R);
  if(SEL!=="__eq"&&!lista.find(r=>r.n===SEL))SEL=lista.length?lista[0].n:"__eq";
  const chips=lista.map(r=>`<button type="button" class="chip${r.n===SEL?" on":""}" data-a="${esc(r.n)}"><span class="mini"${avStyle(r.n)}>${fotoDe(r.n)?"":r.otros?"EX":esc(r.n[0])}</span>${esc(r.n)}<i>${r.leads+r.cier?r.leads+" · "+r.cier:"—"}</i></button>`).join("")+`<button type="button" class="chip eq${SEL==="__eq"?" on":""}" data-a="__eq">Equipo</button>`;
  const F=SEL==="__eq"?E:lista.find(r=>r.n===SEL);
  $("#out").innerHTML=`<div class="chips noprint" aria-label="Asesor">${chips}</div><div class="ctip noprint">Leads · cierres del periodo en cada nombre</div>`+(F?ficha(F,p):'<div class="msg">Sin datos.</div>');
}
function ficha(r,p){
  const kp=(b,s,g)=>`<div class="kpi${g?" g":""}"><b>${b}</b><span>${s}</span></div>`;
  const rate=(n,d,e,l,es)=>{const q=d?n/d:0,t=d?(q*100).toFixed(q*100%1?1:0)+"%":"—";return `<div class="kpi"><b>${n}${d?` <span class="pill ${q>=e?"ok":"lo"}" style="font-size:14px;padding:1px 9px;vertical-align:middle;font-family:Poppins">${t}</span>`:""}</b><span>${l} · estándar ${es}</span></div>`};
  const pc=r.leads?r.c/r.leads:0,ok=pc>=ESTANDAR_CITA;
  const st=(l,v)=>`<div class="stp"><b>${v}</b><span>${l}</span></div>`;
  let h=`<div class="fhead"><div class="av"${avStyle(r.n)}>${fotoDe(r.n)?"":r.eq?"★":r.otros?"EX":esc(iniciales(r.n))}</div><div><h2 style="margin:0">${esc(r.n)}</h2><div class="nota">${esc(p.t)} · ${esc(p.s)}</div></div></div>`;
  h+=`<h2>Marketing <small>leads registrados en el periodo</small></h2>
  <div class="kpis">${kp(r.leads,"Leads")}${rate(r.c,r.leads,ESTANDAR_CITA,"Citas","10 %")}${rate(r.vi,r.leads,ESTANDAR_VISITA,"Visitas","5 %")}${kp(r.ht,"Hot leads")}${rate(r.ap+r.v,r.leads,ESTANDAR_APARTADO,"Apartados","2 %")}${rate(r.v,r.leads,ESTANDAR_CIERRE,"Ventas","1 %")}</div>`;
  h+=`<h2>Ventas <small>operaciones realizadas en el periodo · sin crédito hipotecario</small></h2>
  <div class="kpis">${kp(r.cier,"Cierres")}${kp($m(r.monto),"Monto operado")}${kp($m(r.ing),"Ingreso a TRUST",1)}${kp(r.apN,"Apartados (de leads)")}</div>`;
  const cs=r.cierres.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  h+=cs.length?`<div class="card"><table class="lt"><thead><tr><th style="cursor:default">Fecha</th>${r.eq?'<th style="cursor:default">Asesor</th>':""}<th style="cursor:default">Cliente</th><th style="cursor:default">Proyecto · unidad</th><th style="cursor:default">Inmueble</th><th class="r" style="cursor:default">Monto</th><th class="r" style="cursor:default">Comisión</th><th class="r" style="cursor:default">Ingreso TRUST</th></tr></thead><tbody>${cs.map(v=>`<tr><td>${esc(fmtD(String(v.fecha).slice(0,10)))}</td>${r.eq?`<td>${esc(v.asesor||"—")}</td>`:""}<td style="font-weight:500;color:var(--green)">${esc(v.cliente||"—")}</td><td style="white-space:normal">${esc([v.proyecto,v.unidad].filter(Boolean).join(" · ")||"—")}</td><td>${esc(v.inmueble||v.tipo||"—")}</td><td class="r">${$m(v.monto)}</td><td class="r">${v.comision_pct!=null&&v.comision_pct!==""?(+v.comision_pct)+" %":"—"}</td><td class="r"><b>${$m(comTotal(v))}</b></td></tr>`).join("")}<tr class="tot"><td>Total</td>${r.eq?"<td></td>":""}<td></td><td></td><td></td><td class="r">${$m(r.monto)}</td><td></td><td class="r">${$m(r.ing)}</td></tr></tbody></table></div>`:'<div class="card"><div class="msg">Sin ventas cerradas en el periodo.</div></div>';
  if(r.apars.length){const L=r.apars.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));h+=`<h2>Apartados <small>leads en apartado o venta del periodo</small></h2><div class="card"><table class="lt"><thead><tr><th style="cursor:default">Fecha del lead</th>${r.eq?'<th style="cursor:default">Asesor</th>':""}<th style="cursor:default">Prospecto</th><th style="cursor:default">Proyecto</th><th style="cursor:default">Canal</th><th style="cursor:default">Estatus</th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(fmtD(String(l.fecha).slice(0,10)))}</td>${r.eq?`<td>${esc(l.asesor||"—")}</td>`:""}<td style="font-weight:500;color:var(--green)">${esc(l.nombre||"—")}</td><td>${esc(l.proyecto||"—")}</td><td>${esc(l.canal||"—")}</td><td>${l.venta?"Venta":"Apartado"}</td></tr>`).join("")}</tbody></table></div>`}
  return h+`<p class="nota">Marketing cuenta los leads registrados en el periodo con su estatus actual (cita incluye apartados y ventas). Las ventas (monto e ingreso) usan la fecha de cada cierre; los apartados salen de la base de leads; los créditos hipotecarios no cuentan, igual que en Top Realtor.</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(b){CUR=b.dataset.p;try{localStorage.setItem("resPer",CUR)}catch(x){}pintar();return}
  const c=e.target.closest("[data-a]");if(c){SEL=c.dataset.a;try{localStorage.setItem("resAse",SEL)}catch(x){}pintar();return}
  if(e.target.id==="imp")window.print();
});
botones();cargar();
</script>
</body>
</html>
