<style>
:root{
  --green:#173F35; --green-2:#1F5446; --gold:#B8956A; --gold-2:#9C7A4E;
  --bg:#FAF8F2; --surface:#FFFFFF; --surface-2:#EFEAE0; --line:#D9D2C3; --line-2:#BFB5A0;
  --text:#1E241F; --muted:#585C57; --faint:#8A8D88;
  --ok:#2E7D5B; --ok-bg:#E1F1E8; --warn:#B27A0F; --warn-bg:#FBF0D6; --bad:#A8342A; --bad-bg:#F8E1DE; --info:#2F5597; --info-bg:#E7ECF6;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;margin:0}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.home-link:hover{color:var(--green);border-color:var(--green)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand .logo{height:30px;display:block;margin-bottom:12px}.brand h1{font-size:30px;line-height:1.1}.brand p{margin:4px 0 0;color:var(--muted)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.sm{padding:5px 11px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px}
.qseg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}.qseg button{border:0;background:transparent;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}.qseg button+button{border-left:1px solid var(--line-2)}.qseg button.on{background:var(--green);color:#fff}
.hint{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px}
.tile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{display:block;font-family:Lora,serif;font-size:26px;color:var(--green);line-height:1.15}
.tile .s{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--green);border-color:var(--green)}.tile.dark .l,.tile.dark .s{color:#D9C9A8}.tile.dark .v{color:#fff}
.tile.gold .v{color:var(--gold-2)}.tile.bad .v{color:var(--bad)}.tile.ok .v{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.grid3 .card{min-width:0}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#EFEAE0;color:#4F534E;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even) td{background:#FBFAF6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.dim{color:var(--muted)}td.money{font-weight:600}
tbody tr.subt td{background:var(--surface-2);font-weight:600;border-bottom:2px solid var(--line-2)}
.segc{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.segc button{border:0;background:var(--bg);padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}.segc button+button{border-left:1px solid var(--line-2)}
.segc button.on.bad{background:#FBEDEA;color:var(--bad)}.segc button.on.ok{background:#E6F2EC;color:var(--ok)}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.st.na{background:var(--surface-2);color:var(--muted)}.st.dev{background:var(--info-bg);color:var(--info)}.st.re{background:#F6EEDC;color:var(--gold-2)}
.ico{border:0;background:transparent;color:var(--faint);font-size:15px;padding:2px 6px;border-radius:6px}.ico:hover{color:var(--green);background:var(--surface-2)}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line-2);border-radius:14px}.empty b{display:block;color:var(--text);margin-bottom:4px}
.bars .bar{display:grid;grid-template-columns:minmax(90px,1fr) minmax(60px,1.4fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bars .bar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars i{display:block;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.bars i b{display:block;height:100%;background:var(--green);border-radius:4px}
.bars .n{text-align:right;font-weight:600;white-space:nowrap;font-size:12.5px}.bars .n small{color:var(--muted);font-weight:400}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{display:block;width:100%;max-width:40px;background:var(--green);border-radius:5px 5px 0 0;min-height:2px}.cols .c i.r{background:var(--gold)}
.cols .c small{font-size:11px;font-weight:700;white-space:nowrap}.cols .c small.dim{color:var(--faint);font-weight:400}.cols .c b{font-size:11px;color:var(--muted);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(23,63,53,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}.drawer header h3{font-size:19px}
.drawer .body{padding:18px 22px;overflow:auto;flex:1}
.drawer footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-content:start}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--bg)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.sect{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.sect h4{margin:0 0 10px;font-family:Lora,serif;font-weight:500;font-size:15px;color:var(--green)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:16px}.pgrid4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:860px){.pgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard:hover{border-color:var(--green);box-shadow:var(--shadow)}.pcard.on{background:var(--green);border-color:var(--green);color:#fff}
.pcard .n{font-family:Lora,serif;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-height:14px}.pcard.on .d{color:#D9C9A8}
.pcard .t{display:block;font-family:Lora,serif;font-size:21px;color:var(--bad);margin-top:4px;line-height:1.1}.pcard.on .t{color:#fff}.pcard .t.ok{color:var(--ok)}.pcard.on .t.ok{color:#D9C9A8}
.pcard .b{font-size:11.5px;color:var(--muted);line-height:1.35}.pcard.on .b{color:#E8E2D4}
.pcard.all{background:var(--surface-2)}.pcard.all.on{background:var(--green)}
.st.pend{background:var(--bad-bg);color:var(--bad)}.st.parcial{background:var(--warn-bg);color:var(--warn)}.st.pagada{background:var(--ok-bg);color:var(--ok)}
@media (max-width:860px){.grid3{grid-template-columns:1fr}.c8,.c6,.c4,.c3{grid-column:span 12}}
</style>

async function loadAll(){
  if(!sb){toast("Sin conexión a Supabase",true);return}
  const [i,r,pg,cm]=await Promise.all([sb.from("marketing_inversion").select("*").order("mes",{ascending:false}),sb.from("ventas_reglas").select("reglas").eq("id",1).maybeSingle(),sb.from("marketing_pagos").select("*").order("fecha",{ascending:false}),sb.from("proyecto_comisiones").select("*").order("fecha",{ascending:false})]);
  const inHouse=p=>IN_HOUSE.includes(p);
  if(i.error){TABLA_OK=false}else{TABLA_OK=true;const all=i.data||[];CAT_OK=!all.length||("categoria" in all[0]);INV=all.filter(x=>inHouse(x.proyecto))}
  if(pg.error){PAGOS_OK=false;PAGOS=[]}else{PAGOS_OK=true;PAGOS=(pg.data||[]).filter(g=>inHouse(g.proyecto))}
  if(cm.error){COMS_OK=false;COMS=[]}else{COMS_OK=true;COMS=(cm.data||[]).filter(x=>inHouse(x.proyecto))}
  if(r.data&&r.data.reglas&&r.data.reglas.marketing)REGLAS={...REGLAS_DEF,...r.data.reglas.marketing};
  REGLAS_ALL=(r.data&&r.data.reglas)||{};HIST=Object.fromEntries(Object.entries(REGLAS_ALL.marketing_hist||{}).filter(([p])=>inHouse(p)));

}

    :`<div class="card"><h3>Por año</h3><div class="cols">${(()=>{const v=ys.map(y=>anual(filt.proy||"",y));const r=ys.map(y=>INV.filter(x=>String(x.mes).slice(0,4)===y&&byProy(x)&&esReemb(x)).reduce((a,x)=>a+(+x.monto||0),0));const mx=Math.max(...v,1);return ys.map((y,i)=>`<div class="c" title="${y}: ${fmt(v[i])} · reembolsable ${fmt(r[i])}"><small class="${v[i]?"":"dim"}">${v[i]?fmtK(v[i]):"–"}</small><div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:100px;justify-content:center"><i style="height:${v[i]/mx*100}%;max-width:48px"></i><i class="r" style="height:${r[i]/mx*100}%;max-width:48px"></i></div><b>${y}</b></div>`).join("")})()}</div><p class="hint" style="margin:8px 0 0">Años anteriores sin registros mensuales: total capturado en “Históricos anuales”.</p></div>`;

  ${(()=>{if(!pauta.length)return "";const pp={};pauta.forEach(x=>{const k=x.proyecto;pp[k]=pp[k]||{m:0,l:0,ml:0};pp[k].m+=+x.monto||0;pp[k].l+=+x.leads||0;if(+x.leads>0)pp[k].ml+=+x.monto||0});

    const row=(k,v)=>`<tr><td><b>${esc(k)}</b></td><td class="num money">${fmt(v.m)}</td><td class="num">${v.l?v.l.toLocaleString("es-MX"):"—"}</td><td class="num"><b>${cpl(v.ml,v.l)}</b></td></tr>`;
    let tiempo="";
    if(P.anio&&!P.mes){const mm=Array.from({length:12},()=>({m:0,l:0,ml:0}));pauta.forEach(x=>{const i=+String(x.mes).slice(5,7)-1;mm[i].m+=+x.monto||0;mm[i].l+=+x.leads||0;if(+x.leads>0)mm[i].ml+=+x.monto||0});tiempo=`<div class="twrap"><table><thead><tr><th>Mes ${P.anio}</th><th class="num">Pauta</th><th class="num">Leads</th><th class="num">CPL</th></tr></thead><tbody>${mm.map((v,i)=>v.m||v.l?row(MESES_L[i],v):"").join("")}</tbody></table></div>`}

<div class="top"><img class="logo" src="data:image/png;base64,${LOGO_B64}"><div class="right">Proyecto<b>${esc(proy)}${R.desarrollador?" · "+esc(R.desarrollador):""}</b>Corte al<b>${hoy}</b></div></div>

${coms.length?`<b class="sec first">Comisiones</b><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Unidad</th><th>Concepto</th><th class="n">Comisión</th></tr></thead><tbody>
${coms.map(x=>`<tr><td>${fecha(x.fecha)}</td><td>${esc(x.cliente||"")}</td><td>${esc(x.unidad||"")}</td><td>${esc(x.concepto||"")}${x.notas?`<br><small style="color:#6F726B">${esc(x.notas)}</small>`:""}</td><td class="n">${fmt(x.monto)}</td></tr>`).join("")}
<tr class="tot"><td colspan="4">Total comisiones</td><td class="n">${fmt(totalCom)}</td></tr></tbody></table>`:""}
${rows.length?`<b class="sec ${coms.length?"":"first"}">Gastos reembolsables</b><table><thead><tr><th>Mes</th><th>Categoría</th><th>Plataforma / proveedor</th><th>Concepto</th><th class="n">Monto</th></tr></thead><tbody>
${rows.map(x=>`<tr><td>${fechaM(x.mes)}</td><td>${esc(catDe(x))}</td><td>${esc(x.plataforma||"")}</td><td>${esc(x.campana||"")}${x.notas?`<br><small style="color:#6F726B">${esc(x.notas)}</small>`:""}</td><td class="n">${fmt(x.monto)}</td></tr>`).join("")}

${(()=>{const ys=anios();const v=ys.map(y=>anual(proy,y));if(!v.some(x=>x))return "";const mx=Math.max(...v,1);return `<div class="cmp"><b>Gasto anual del proyecto · ${esc(proy)}</b><div class="bars">${ys.map((y,i)=>`<div class="bc"><span class="bv">${v[i]?fmt(v[i]):"—"}</span><i style="height:${Math.max(v[i]/mx*70,2)}px;${i===ys.length-1?"":"background:#2F5F52"}"></i><span class="by">${y}</span></div>`).join("")}</div><small>Años anteriores: totales anuales del proyecto. ${ys[ys.length-1]}: acumulado de lo registrado al corte (incluye gastos no reembolsables).</small></div>`})()}

<div class="foot"><div><b style="color:#173F35;letter-spacing:.14em;text-transform:uppercase">Confidencial</b> · hola@trustreal.mx · 33 3376 5616 · trustreal.mx</div><img src="data:image/png;base64,${LOGO_B64}"></div>
</div><div id="pages"></div>
<script>
// Paginación: reparte el contenido en hojas carta completas (las tablas se parten por renglón repitiendo su encabezado)
function paginar(){
  const src=document.getElementById("src"),out=document.getElementById("pages");if(!src||!out||out.children.length)return;
  const titulo=${JSON.stringify("Estado de cuenta · "+proy)};
  const pages=[];let page=null,body=null;
  const nuevaPagina=()=>{page=document.createElement("div");page.className="page";body=document.createElement("div");body.className="pbody";page.appendChild(body);
    if(pages.length){const c=document.createElement("div");c.className="cont";c.innerHTML="<b>"+titulo+"</b> · continuación";body.appendChild(c)}
    out.appendChild(page);pages.push(page)};
  const limite=()=>{const cs=getComputedStyle(page);return page.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)};
  const cabe=()=>body.scrollHeight<=limite()+0.5;
  nuevaPagina();
  const atoms=[...src.children];
  for(let i=0;i<atoms.length;i++){
    const node=atoms[i];
    if(node.tagName==="TABLE"){
      const rowsAll=[...node.querySelectorAll("tbody > tr")];const thead=node.querySelector("thead");
      const shell=()=>{const t=node.cloneNode(false);t.removeAttribute("style");t.style.marginTop=node.style.marginTop||"";if(thead)t.appendChild(thead.cloneNode(true));t.appendChild(document.createElement("tbody"));body.appendChild(t);return t};
      let t=shell();
      // si no cabe ni el encabezado + primer renglón, pasar a nueva página (llevándose la etiqueta de sección previa)
      const prev=body.lastElementChild===t?t.previousElementSibling:null;
      for(let r=0;r<rowsAll.length;r++){
        const tr=rowsAll[r];t.tBodies[0].appendChild(tr);
        if(!cabe()){
          t.tBodies[0].removeChild(tr);
          if(t.tBodies[0].children.length===0){ // ni un renglón cupo: mover tabla (y etiqueta) a nueva página
            body.removeChild(t);const lbl=(prev&&prev.tagName==="B"&&prev.classList.contains("sec"))?prev:null;if(lbl)body.removeChild(lbl);
            nuevaPagina();if(lbl){lbl.classList.add("first");body.appendChild(lbl)}t=shell();t.tBodies[0].appendChild(tr);
          }else{nuevaPagina();t=shell();t.style.marginTop="0";t.tBodies[0].appendChild(tr)}
        }
      }
      if(!t.tBodies[0].children.length)t.remove();
    }else{
      body.appendChild(node);
      if(!cabe()&&body.children.length>1){body.removeChild(node);nuevaPagina();if(node.tagName==="B")node.classList.add("first");body.appendChild(node)}
    }
  }
  pages.forEach((p,i)=>{const n=document.createElement("div");n.className="pnum";n.innerHTML="<span>"+titulo+"</span><span>Página "+(i+1)+" de "+pages.length+"</span>";p.appendChild(n)});
  src.style.display="none";
}
window.addEventListener("load",()=>{const go=()=>{try{paginar()}catch(e){console.warn(e)}setTimeout(()=>window.print(),400)};(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(go,150))});
<\/script></body></html>`;
  const w=window.open("","_blank");if(!w){toast("Permite las ventanas emergentes para generar el PDF",true);return}w.document.open();w.document.write(html);w.document.close();
}
$("#btn-new").onclick=()=>openInv(null,{proyecto:filt.proy||""});
loadAll();
</script>
