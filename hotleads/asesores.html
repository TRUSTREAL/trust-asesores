<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F2">
<title>Mis Hot Leads | TRUST</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  --green:#173F35; --green-2:#1F5446; --gold:#B8956A; --gold-2:#9C7A4E;
  --bg:#FAF8F2; --surface:#FFFFFF; --surface-2:#F1EDE3; --line:#E3DDD0; --line-2:#CFC6B4;
  --text:#1E241F; --muted:#6F726B; --faint:#97999B;
  --st-disp:#2E7D5B; --st-disp-bg:#E1F1E8;
  --st-apart:#B27A0F; --st-apart-bg:#FBF0D6;
  --st-vend:#5C5F5A; --st-vend-bg:#ECEBE6;
  --st-bloq:#A8342A; --st-bloq-bg:#F8E1DE;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#9CC7B6; --green-2:#B9DACB; --gold:#CDAA7C; --gold-2:#E0C39A;
    --bg:#131917; --surface:#1B2320; --surface-2:#222C28; --line:#2E3934; --line-2:#3E4A44;
    --text:#ECEBE4; --muted:#A9ADA6; --faint:#7C817B;
    --st-disp:#8BD4B0; --st-disp-bg:#1E3A2E;
    --st-apart:#E9C069; --st-apart-bg:#3D3117;
    --st-vend:#B6B9B2; --st-vend-bg:#2A2F2B;
    --st-bloq:#F0958B; --st-bloq-bg:#42201C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --green:#9CC7B6; --green-2:#B9DACB; --gold:#CDAA7C; --gold-2:#E0C39A;
  --bg:#131917; --surface:#1B2320; --surface-2:#222C28; --line:#2E3934; --line-2:#3E4A44;
  --text:#ECEBE4; --muted:#A9ADA6; --faint:#7C817B;
  --st-disp:#8BD4B0; --st-disp-bg:#1E3A2E;
  --st-apart:#E9C069; --st-apart-bg:#3D3117;
  --st-vend:#B6B9B2; --st-vend-bg:#2A2F2B;
  --st-bloq:#F0958B; --st-bloq-bg:#42201C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

/* contraste */
:root{--muted:#585C57;--faint:#8A8D88;--line:#D9D2C3;--line-2:#BFB5A0;--surface-2:#EFEAE0}
td{color:var(--text)}
td.dim{color:#6B6E68}
th{background:#EFEAE0;color:#4F534E}
tbody tr:nth-child(even) td{background:#FBFAF6}
.meta span b{font-weight:600}
.tile{border-color:var(--line-2)}
.twrap{border-color:var(--line-2)}
.pill.in,.pcard .n{font-weight:600}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#B5B9B2;--faint:#8C918B;--line:#38443E;--line-2:#4A574F;--surface-2:#242E29} :root:not([data-theme="light"]) th{background:#242E29;color:#C9CDC6} :root:not([data-theme="light"]) td.dim{color:#A9ADA6} :root:not([data-theme="light"]) tbody tr:nth-child(even) td{background:#1E2724}}
:root[data-theme="dark"]{--muted:#B5B9B2;--faint:#8C918B;--line:#38443E;--line-2:#4A574F;--surface-2:#242E29}
:root[data-theme="dark"] th{background:#242E29;color:#C9CDC6} :root[data-theme="dark"] td.dim{color:#A9ADA6} :root[data-theme="dark"] tbody tr:nth-child(even) td{background:#1E2724}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600}

/* header */
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.home-link:hover{color:var(--green);border-color:var(--green)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .logo{width:130px;height:auto;margin-bottom:8px}
.brand h1{font-size:28px;color:var(--green)}
:root[data-theme="dark"] .brand .logo{filter:brightness(0) invert(.93)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{filter:brightness(0) invert(.93)}}
.brand .sub{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0F1613}}

/* layout */
.grid{margin-top:20px}
/* project picker */
.picker{position:relative;display:inline-block}
.pbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:10px 14px 10px 16px;text-align:left;min-width:260px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .pbtn{color:#0F1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbtn{color:#0F1613}}
.pbtn:hover{background:var(--green-2);border-color:var(--green-2)}
.pbtn .t{display:flex;flex-direction:column;flex:1;min-width:0}
.pbtn .t b{font-family:Lora,serif;font-weight:500;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn .t small{font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.pbtn .chev{font-size:12px;opacity:.8;transition:transform .15s}
.picker[open] .chev{transform:rotate(180deg)}
.pmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:15;min-width:100%;width:max-content;max-width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none}
.picker[open] .pmenu{display:block}
.pmenu .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:0 16px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px}
.pitem:hover,.pitem:focus-visible{background:var(--surface-2);outline:none}
.pitem[aria-current="true"]{box-shadow:inset 3px 0 0 var(--gold)}
.pitem .n{font-family:Lora,serif;font-size:15px;color:var(--green)}
.pitem .g{color:var(--muted);font-size:12px;grid-column:1}
.pitem .k{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pitem .k b{color:var(--st-disp);font-weight:600;font-size:15px}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.addp{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);font-size:13px}
.addp:hover{background:var(--surface-2);color:var(--green)}
.phead .left{display:flex;flex-direction:column;gap:10px;min-width:0}

/* main */
.main{min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.phead h2{font-size:26px;color:var(--green)}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.meta span b{color:var(--text);font-weight:500}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.in{background:var(--green);color:#fff}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1613}}
.btn.primary:hover{background:var(--green-2);border-color:var(--green-2)}
.btn.danger{color:var(--st-bloq)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:Lora,serif;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.disp .v{color:var(--st-disp)}.tile.apart .v{color:var(--st-apart)}.tile.vend .v{color:var(--st-vend)}.tile.bloq .v{color:var(--st-bloq)}
.tile.disp::after,.tile.apart::after,.tile.vend::after,.tile.bloq::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.tile.disp::after{background:var(--st-disp)}.tile.apart::after{background:var(--st-apart)}.tile.vend::after{background:var(--st-vend)}.tile.bloq::after{background:var(--st-bloq)}

.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.bar i{display:block;height:100%}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.filters select,.filters input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}
.filters input{min-width:140px;flex:1}
.filters .count{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

.twrap{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th[data-dir]::after{content:" ↑";color:var(--gold)}
th[data-dir="desc"]::after{content:" ↓"}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.type{font-family:Lora,serif;font-size:15px;color:var(--gold-2);font-weight:500}
td.price{font-weight:600}
th.eng{color:var(--gold-2)}
td.eng{color:var(--gold-2);font-weight:600}
td.tot{font-weight:500}
td.dim{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;background:var(--st-vend-bg);color:var(--st-vend);appearance:none;-webkit-appearance:none;cursor:pointer}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.Disponible{background:var(--st-disp-bg);color:var(--st-disp)}
.st.Apartado{background:var(--st-apart-bg);color:var(--st-apart)}
.st.Vendido{background:var(--st-vend-bg);color:var(--st-vend)}
.st.Bloqueado{background:var(--st-bloq-bg);color:var(--st-bloq)}
select.st{padding-right:10px}
.ico{border:0;background:transparent;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:12px}
.ico:hover{color:var(--green);background:var(--surface-2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:Lora,serif;font-size:18px;color:var(--text);font-weight:500;margin-bottom:6px}
.notes{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.notes .eyebrow{display:block;margin-bottom:6px}
.notes p{margin:0;color:var(--muted);white-space:pre-wrap}
.foot{margin-top:28px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}


/* vista precios | política */
.vseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:18px}
.vseg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;color:var(--muted);font-weight:500;font-size:13px}
.vseg button[aria-pressed="true"]{background:var(--green);color:#fff}
:root[data-theme="dark"] .vseg button[aria-pressed="true"]{color:#0F1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vseg button[aria-pressed="true"]{color:#0F1613}}
.pol{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 28px;max-width:820px;line-height:1.6}
.pol h3{font-family:Lora,Georgia,serif;font-size:20px;color:var(--green);font-weight:500;margin:0 0 4px}
.pol h4{font-family:Lora,Georgia,serif;font-size:16px;color:var(--green);font-weight:500;margin:18px 0 6px}
.pol p{margin:0 0 10px}
.pol ul{margin:0 0 12px;padding-left:20px}
.pol li{margin:3px 0}
.pol .upd{font-size:12px;color:var(--faint);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pol.empty{color:var(--muted);text-align:center;padding:36px}
.pol.empty b{display:block;font-family:Lora,serif;font-size:18px;color:var(--text);font-weight:500;margin-bottom:6px}

/* documentos */
.docs{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--text);transition:border-color .15s}
.doc:hover{border-color:var(--gold)}
.doc .ext{flex:none;width:40px;height:40px;border-radius:8px;background:var(--surface-2);color:var(--green);font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.doc .n{min-width:0;flex:1}
.doc .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .n small{color:var(--muted);font-size:11px}
.doc .del{flex:none}
.upl{margin-top:14px;border:1px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface)}
.upl.drag{border-color:var(--green);color:var(--green);background:var(--surface-2)}
.upl input{display:none}
.upl label{color:var(--green);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.upl .prog{margin-top:8px;font-size:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,22,19,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{font-size:20px;color:var(--green)}
.drawer form{padding:16px 20px;overflow:auto;display:grid;gap:12px;grid-template-columns:1fr 1fr;flex:1}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.btn:focus-visible,.pcard:focus-visible,.st:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.drawer footer{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.hint{grid-column:1/-1;font-size:12px;color:var(--faint);margin:0}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(30px);opacity:0}}}

/* hot leads */
.tiles{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile.gan .v{color:var(--st-disp)}.tile.pen .v{color:var(--st-apart)}.tile.per .v{color:var(--st-bloq)}.tile.tot .v{color:var(--green)}
.tile.gan::after,.tile.pen::after,.tile.per::after,.tile.tot::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.tile.gan::after{background:var(--st-disp)}.tile.pen::after{background:var(--st-apart)}.tile.per::after{background:var(--st-bloq)}.tile.tot::after{background:var(--gold)}
.st.Ganado{background:var(--st-disp-bg);color:var(--st-disp)}
.st.Pendiente{background:var(--st-apart-bg);color:var(--st-apart)}
.st.Perdido{background:var(--st-bloq-bg);color:var(--st-bloq)}
td.cli{font-weight:600}
td.cli small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.un{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.un.Proyectos{background:var(--st-disp-bg);color:var(--st-disp)}
.un.Brokerage{background:#E7ECF6;color:#2F5597}
input.ap{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
td.com{font-weight:600;color:var(--gold-2)}
tr.Perdido td{opacity:.6}
tr.Perdido td.cli{text-decoration:line-through;text-decoration-color:var(--st-bloq)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.bar i{display:block;height:100%}
.by{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.by{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:15px;margin-bottom:8px}
.row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .trk{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.row .fil{height:100%;background:var(--green);border-radius:999px}
.row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.f.third{grid-column:span 1}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}}

/* columna cliente fija */
table{min-width:1300px}
td.cli,th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th:first-child{z-index:3;background:var(--surface-2)}
tbody tr:nth-child(even) td.cli{background:#FBFAF6}
tr:hover td.cli{background:var(--surface-2)}
tr.Perdido td.cli{opacity:1;color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) tbody tr:nth-child(even) td.cli{background:#1E2724}}
:root[data-theme="dark"] tbody tr:nth-child(even) td.cli{background:#1E2724}

.pick{max-width:640px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.pick h2{font-size:22px;margin-bottom:4px}
.pick p{color:var(--muted);margin:0 0 16px;font-size:13px}
.pick .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:16px;font-size:16px;font-weight:500}
.pick button:hover{border-color:var(--green);color:var(--green)}

.vseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:18px}
.vseg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;color:var(--muted);font-weight:500;font-size:13px}
.vseg button[aria-pressed="true"]{background:var(--green);color:#fff}
.vseg button.g[aria-pressed="true"]{background:var(--st-disp)}
.vseg button.p[aria-pressed="true"]{background:var(--st-bloq)}
.vseg button b{font-weight:600;margin-left:4px;opacity:.75}

.dd{display:inline-block;min-width:34px;text-align:center;border-radius:999px;padding:2px 8px;font-weight:600;font-size:12px;background:var(--surface-2);color:var(--muted)}
.dd.warm{background:var(--st-apart-bg);color:var(--st-apart)}
.dd.hot{background:var(--st-bloq-bg);color:var(--st-bloq)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://xshhjvdmkuqesdlvczbb.supabase.co";
const SUPABASE_KEY="sb_publishable_5erZfpELyuncW1nrReTaZw_BQj0bc-P";
let sb=null; try{ if(window.supabase) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
const ESTATUS=["Pendiente","Ganado","Perdido"];
const UN=["Proyectos","Brokerage"], TIPO=["Venta","Renta"], OBJ=["Inversión","Vivienda","Renta"], ORIGEN=["AG","Lead"];
const ASESORES=["Ana Lu","Carlos","Fanny","María","Paola","Ramsés","Rodrigo","Álvaro","Majo","Berna"];
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null||isNaN(n)?"—":"$ "+Math.round(n).toLocaleString("es-MX");
const fmtM=n=>Math.abs(n)>=1e6?"$ "+(n/1e6).toFixed(2).replace(/\.?0+$/,"")+" M":fmt(n);
const mesTxt=ym=>{if(!ym)return "—";const [y,m]=ym.split("-");return MESES[+m-1]?.slice(0,3)+" "+y.slice(2)};
const mesLong=ym=>{if(!ym)return "—";const [y,m]=ym.split("-");return MESES[+m-1]+" "+y};
const com=l=>(+l.monto||0)*(+l.comision_pct||0)/100;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dias=l=>{const f=l.fecha||(l.created_at||"").slice(0,10);if(!f)return null;const a=new Date(f+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.max(0,Math.round((b-a)/86400000))};
const fechaTxt=f=>{if(!f)return "—";const [y,m,d]=f.slice(0,10).split("-");return `${+d} ${MESES[+m-1]?.slice(0,3)} ${y.slice(2)}`};
const newId=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
let leads=[], lastSync=null, ASESOR=null;
let VIEW="Pendiente"; // Pendiente | Ganado | Perdido
let filt={q:"",estatus:"",asesor:"",un:"",tipo:"",proyecto:""}, sort={k:"cliente",dir:"asc"};
function setSync(m){const el=$("#sync");if(el)el.textContent=m||(sb?"Supabase · "+lastSync.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}):"Sin conexión a Supabase")}
async function loadAll(){ if(!sb){setSync();return} const {data,error}=await sb.from("hot_leads").select("*").order("cliente"); if(error){setSync("Error: "+error.message);return} leads=data||[]; lastSync=new Date(); setSync(); }
function db(fn){ if(!sb)return; fn().then(({error})=>{ if(error){alert("No se pudo guardar: "+error.message);loadAll().then(render)} else {lastSync=new Date();setSync()} }).catch(e=>alert("Sin conexión: "+e.message)); }

function pickHTML(){return `<div class="pick"><h2>¿Quién eres?</h2><p>Elige tu nombre para ver y trabajar tus hot leads.</p><div class="grid">${ASESORES.map(n=>`<button data-ase="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>`}
function render(){
  const m=$("#main");
  if(!ASESOR){m.innerHTML=pickHTML();$("#acts").hidden=true;$("#sub").textContent="Elige tu nombre para ver tus prospectos próximos al cierre";return}
  $("#acts").hidden=false;$("#sub").textContent=ASESOR+" · tus prospectos próximos al cierre";
  const opts=(k,lbl,list)=>`<select id="f-${k}" data-k="${k}"><option value="">${lbl}</option>${list.map(v=>`<option ${filt[k]===v?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
  const uniq=k=>[...new Set(leads.filter(l=>l.asesor===ASESOR).map(l=>l[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"es"));
  const leadsAll=leads; const leads_=leads.filter(l=>l.asesor===ASESOR);
  const base=leads_;
  let rows=leads_.filter(l=>l.estatus===VIEW&&(!filt.asesor||l.asesor===filt.asesor)&&(!filt.un||l.un===filt.un)&&(!filt.tipo||l.tipo===filt.tipo)&&(!filt.proyecto||l.proyecto===filt.proyecto)
    &&(!filt.q||[l.cliente,l.proyecto,l.asesor,l.inmobiliaria,l.notas].join(" ").toLowerCase().includes(filt.q.toLowerCase())));
  const sum=(arr,f)=>arr.reduce((a,l)=>a+f(l),0);
  const pen=base.filter(l=>l.estatus==="Pendiente"),gan=base.filter(l=>l.estatus==="Ganado"),per=base.filter(l=>l.estatus==="Perdido");
  const totCom=sum(base.filter(l=>l.estatus!=="Perdido"),com);
  const k=sort.k,d=sort.dir==="asc"?1:-1;
  rows=[...rows].sort((a,b)=>{let x=k==="comision"?com(a):k==="dias"?(dias(a)??-1):k==="fecha"?(a.fecha||(a.created_at||"").slice(0,10)):a[k]??"",y=k==="comision"?com(b):k==="dias"?(dias(b)??-1):k==="fecha"?(b.fecha||(b.created_at||"").slice(0,10)):b[k]??"";return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es",{numeric:true}))*d});
  const th=(k,l,num)=>`<th data-k="${k}" ${sort.k===k?`data-dir="${sort.dir}"`:""} class="${num?"num":""}">${l}</th>`;
  // por asesor
  const byA={};pen.forEach(l=>{byA[l.asesor]=(byA[l.asesor]||0)+com(l)});
  const byP={};pen.forEach(l=>{byP[l.proyecto]=(byP[l.proyecto]||0)+com(l)});
  const bars=(o)=>{const es=Object.entries(o).sort((a,b)=>b[1]-a[1]);const mx=es[0]?.[1]||1;return es.length?es.map(([n,v])=>`<div class="row"><span class="lab">${esc(n)}</span><span class="trk"><i class="fil" style="width:${v/mx*100}%"></i></span><span class="val">${fmtM(v)}</span></div>`).join(""):`<div class="empty" style="padding:10px">Sin pendientes</div>`};
  m.innerHTML=`
    <div class="tiles">
      <div class="tile tot"><span class="l">Comisión proyectada</span><span class="v">${fmtM(totCom)}</span><span class="s">${base.length} hot leads · ${fmtM(sum(base.filter(l=>l.estatus!=="Perdido"),l=>+l.monto||0))} en operaciones</span></div>
      <div class="tile pen"><span class="l">Pendiente</span><span class="v">${pen.length}</span><span class="s">${fmtM(sum(pen,com))} · ${pen.filter(l=>l.apartado).length} con apartado · ${pen.length?Math.round(pen.reduce((a,l)=>a+(dias(l)||0),0)/pen.length)+" días prom.":""}</span></div>
      <div class="tile gan"><span class="l">Ganado</span><span class="v">${gan.length}</span><span class="s">${fmtM(sum(gan,com))} comisión</span></div>
      <div class="tile per"><span class="l">Perdido</span><span class="v">${per.length}</span><span class="s">${fmtM(sum(per,com))} no cobrada</span></div>
    </div>
    ${base.length?`<div class="bar"><i style="width:${gan.length/base.length*100}%;background:var(--st-disp)"></i><i style="width:${pen.length/base.length*100}%;background:var(--st-apart)"></i><i style="width:${per.length/base.length*100}%;background:var(--st-bloq)"></i></div>`:""}
    <div class="vseg" role="tablist"><button data-view="Pendiente" aria-pressed="${VIEW==="Pendiente"}">Pendientes<b>${pen.length}</b></button><button class="g" data-view="Ganado" aria-pressed="${VIEW==="Ganado"}">Ganados<b>${gan.length}</b></button><button class="p" data-view="Perdido" aria-pressed="${VIEW==="Perdido"}">Perdidos<b>${per.length}</b></button></div>
    <div class="filters">
      <input id="f-q" placeholder="Buscar cliente, proyecto…" value="${esc(filt.q)}">
      ${opts("un","UN",UN)}${opts("tipo","Tipo",TIPO)}${opts("proyecto","Proyecto",uniq("proyecto"))}
      <span class="count">${rows.length} ${VIEW.toLowerCase()}${rows.length===1?"":"s"}</span>
    </div>
    <div class="twrap"><table>
      <thead><tr>${th("cliente","Cliente")}${th("fecha","Ingreso")}${th("dias","Días",1)}${th("un","UN")}${th("asesor","Asesor")}${th("proyecto","Proyecto")}${th("tipo","Tipo")}${th("monto","Monto",1)}${th("comision_pct","%",1)}${th("comision","Comisión",1)}${th("inmobiliaria","Inmobiliaria")}${th("origen","Origen")}<th title="Apartado">Apart.</th>${th("objetivo","Objetivo")}${th("estatus","Estatus")}<th></th></tr></thead>
      <tbody>${rows.map(l=>`<tr class="${l.estatus}" data-id="${l.id}">
        <td class="cli">${esc(l.cliente)}${l.notas?`<small title="${esc(l.notas)}">${esc(l.notas).slice(0,40)}${l.notas.length>40?"…":""}</small>`:""}</td>
        <td class="dim">${fechaTxt(l.fecha||(l.created_at||""))}</td><td class="num"><span class="dd ${(dias(l)??0)>=45?"hot":(dias(l)??0)>=21?"warm":""}">${dias(l)??"—"}</span></td>
        <td><span class="un ${l.un}">${esc(l.un)}</span></td><td>${esc(l.asesor)}</td><td>${esc(l.proyecto)}</td><td class="dim">${esc(l.tipo)}</td>
                <td class="num price">${fmt(l.monto)}</td><td class="num dim">${(+l.comision_pct||0).toLocaleString("es-MX",{maximumFractionDigits:2})}%</td><td class="num com">${fmt(com(l))}</td>
        <td class="dim">${esc(l.inmobiliaria)}</td><td class="dim">${esc(l.origen)}</td>
        <td><input type="checkbox" class="ap" data-id="${l.id}" ${l.apartado?"checked":""} title="Apartado"></td>
        <td class="dim">${esc(l.objetivo)}</td>
        <td><select class="st ${l.estatus}" data-id="${l.id}" aria-label="Estatus">${ESTATUS.map(s=>`<option ${l.estatus===s?"selected":""}>${s}</option>`).join("")}</select></td>
        <td><button class="ico edit" data-id="${l.id}" title="Editar">✎</button></td></tr>`).join("")}</tbody></table>
      ${rows.length?"":`<div class="empty"><b>Sin hot leads</b>${rows.length===0&&base.some(l=>l.estatus===VIEW)?"Ninguno coincide con los filtros.":`Sin hot leads ${VIEW.toLowerCase()}s.`}</div>`}</div>
    <div class="by"><div class="card"><h3>Comisión pendiente por proyecto</h3>${bars(byP)}</div></div>`;
}

// ---------- eventos ----------
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-k]");if(th){const k=th.dataset.k;sort=sort.k===k?{k,dir:sort.dir==="asc"?"desc":"asc"}:{k,dir:"asc"};render();return}
  const t=e.target.closest("button");if(!t)return;

function reportePDF(){
  const rows=leads.filter(l=>l.asesor===ASESOR).filter(l=>l.estatus===VIEW&&(!filt.un||l.un===filt.un)&&(!filt.tipo||l.tipo===filt.tipo)&&(!filt.proyecto||l.proyecto===filt.proyecto)
    &&(!filt.q||[l.cliente,l.proyecto,l.asesor,l.inmobiliaria,l.notas].join(" ").toLowerCase().includes(filt.q.toLowerCase())))
    .sort((a,b)=>String(a.asesor).localeCompare(String(b.asesor),"es")||com(b)-com(a));
  const sum=(arr,f)=>arr.reduce((a,l)=>a+f(l),0);
  const pen=rows.filter(l=>l.estatus==="Pendiente"),gan=rows.filter(l=>l.estatus==="Ganado"),per=rows.filter(l=>l.estatus==="Perdido");
  const hoy=new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  const filtros=[VIEW+"s",filt.asesor,filt.un,filt.tipo,filt.proyecto,filt.q?`"${filt.q}"`:""].filter(Boolean).join(" · ");
  const byA={};pen.forEach(l=>{byA[l.asesor]=(byA[l.asesor]||{n:0,c:0});byA[l.asesor].n++;byA[l.asesor].c+=com(l)});
  const html=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Hot Leads · ${hoy}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

</style></head><body><div class="page">

  <div class="title">Hot <em>Leads</em> · ${esc(ASESOR)}</div>
  <div class="sub">Prospectos próximos al cierre · ${rows.length} registros</div>
  <div class="tiles">
    <div class="tile"><div class="l">Comisión proyectada</div><div class="v">${fmt(sum(rows.filter(l=>l.estatus!=="Perdido"),com))}</div><div class="s">${fmtM(sum(rows.filter(l=>l.estatus!=="Perdido"),l=>+l.monto||0))} en operaciones</div></div>
    <div class="tile pen"><div class="l">Pendiente</div><div class="v">${pen.length}</div><div class="s">${fmt(sum(pen,com))} · ${pen.filter(l=>l.apartado).length} con apartado</div></div>

  </div>
  <table><thead><tr><th>Cliente</th><th>Ingreso</th><th class="num">Días</th><th>UN</th><th>Asesor</th><th>Proyecto</th><th>Tipo</th><th class="num">Monto</th><th class="num">%</th><th class="num">Comisión</th><th>Inmobiliaria</th><th>Origen</th><th>Apart.</th><th>Objetivo</th><th>Estatus</th><th>Notas</th></tr></thead>
  <tbody>${rows.map(l=>`<tr class="${l.estatus}"><td class="cli">${esc(l.cliente)}</td><td>${fechaTxt(l.fecha||(l.created_at||""))}</td><td class="num">${dias(l)??"—"}</td><td>${esc(l.un)}</td><td>${esc(l.asesor)}</td><td>${esc(l.proyecto)}</td><td>${esc(l.tipo)}</td><td class="num">${fmt(l.monto)}</td><td class="num">${(+l.comision_pct||0).toLocaleString("es-MX",{maximumFractionDigits:2})}%</td><td class="num com">${fmt(com(l))}</td><td>${esc(l.inmobiliaria)}</td><td>${esc(l.origen)}</td><td class="ap">${l.apartado?"✓":""}</td><td>${esc(l.objetivo)}</td><td><span class="st ${l.estatus}">${l.estatus}</span></td><td style="white-space:normal;max-width:180px;font-size:9px;color:#6F726B">${esc(l.notas||"")}</td></tr>`).join("")}</tbody></table>
  ${Object.keys(byA).length?`<div class="ase">${Object.entries(byA).sort((a,b)=>b[1].c-a[1].c).map(([n,v])=>`<div><small>${esc(n)} · ${v.n} pendiente${v.n===1?"":"s"}</small><b>${fmt(v.c)}</b></div>`).join("")}</div>`:""}

</div><script>window.addEventListener("load",()=>setTimeout(()=>window.print(),500));<\/script></body></html>`;
  const w=window.open("","_blank"); if(!w){alert("Permite las ventanas emergentes para generar el PDF.");return}
  w.document.open();w.document.write(html);w.document.close();
}

// ---------- drawer ----------
function drawer(title,body,onSave,onDelete){
  $("#drawer-root").innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer" role="dialog" aria-label="${esc(title)}">
    <header><h3>${esc(title)}</h3><button class="ico" id="d-close" aria-label="Cerrar">✕</button></header>
    <form id="d-form">${body}</form>
    <footer><span>${onDelete?`<button type="button" class="btn danger" id="d-del">Eliminar</button>`:""}</span>
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="d-cancel">Cancelar</button><button type="button" class="btn primary" id="d-save">Guardar</button></span></footer></div>`;
  const close=()=>$("#drawer-root").innerHTML="";
  $("#scrim").onclick=close;$("#d-close").onclick=close;$("#d-cancel").onclick=close;
  $("#d-save").onclick=()=>{const f=$("#d-form");if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.apartado=f.querySelector('[name=apartado]').checked;onSave(d);render();close()};
  if(onDelete)$("#d-del").onclick=()=>{if(confirm("¿Eliminar este hot lead?")){onDelete();render();close()}};
  $("#d-form").addEventListener("submit",e=>{e.preventDefault();$("#d-save").click()});
  const first=$("#d-form input,#d-form select");first&&first.focus();
}
const fld=(name,label,val="",attrs="",full=false)=>`<div class="f ${full?"full":""}"><label for="fx-${name}">${label}</label><input id="fx-${name}" name="${name}" value="${esc(val)}" ${attrs}></div>`;
const fsel=(name,label,val,opts,full=false)=>`<div class="f ${full?"full":""}"><label for="fx-${name}">${label}</label><select id="fx-${name}" name="${name}">${opts.map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select></div>`;
const flist=(name,label,val,opts)=>`<div class="f"><label for="fx-${name}">${label}</label><input id="fx-${name}" name="${name}" value="${esc(val)}" list="dl-${name}" required><datalist id="dl-${name}">${opts.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>`;
function openLead(l){
  const now=new Date(),ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const inmos=[...new Set(["TRUST","Independiente",...leads.map(x=>x.inmobiliaria)].filter(Boolean))];
  const proys=[...new Set(leads.map(x=>x.proyecto).filter(Boolean))].sort();
  drawer(l?"Editar hot lead":"Nuevo hot lead",
    fld("cliente","Cliente",l?.cliente||"","required",true)+
    fsel("un","Unidad de negocio",l?.un||"Proyectos",UN)+
    fld("asesor","Asesor",ASESOR,"readonly")+
    flist("proyecto","Proyecto / propiedad",l?.proyecto||"",proys)+
    fsel("tipo","Tipo",l?.tipo||"Venta",TIPO)+
    fld("fecha","Fecha de ingreso",l?.fecha||(l?.created_at||"").slice(0,10)||today(),"type=date required")+
    fld("monto","Monto (MXN)",l?.monto??"","type=number step=1 min=0 required")+
    fld("comision_pct","Comisión %",l?.comision_pct??4.5,"type=number step=0.01 min=0 max=100 required")+
    flist("inmobiliaria","Inmobiliaria",l?.inmobiliaria||"TRUST",inmos)+
    fsel("origen","Origen",l?.origen||"AG",ORIGEN)+
    fsel("objetivo","Objetivo",l?.objetivo||"Inversión",OBJ)+
    fsel("estatus","Estatus",l?.estatus||"Pendiente",ESTATUS)+
    `<div class="f"><label for="fx-apartado">Apartado</label><label style="display:flex;align-items:center;gap:8px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text)"><input type="checkbox" id="fx-apartado" name="apartado" class="ap" ${l?.apartado?"checked":""}> Ya firmó apartado</label></div>`+
    `<div class="f full"><label for="fx-notas">Notas / siguiente paso</label><textarea id="fx-notas" name="notas">${esc(l?.notas||"")}</textarea></div>`,
    d=>{const v={cliente:d.cliente.trim(),fecha:d.fecha,un:d.un,asesor:d.asesor.trim(),proyecto:d.proyecto.trim(),tipo:d.tipo,monto:+d.monto||0,comision_pct:+d.comision_pct||0,inmobiliaria:d.inmobiliaria.trim(),origen:d.origen,objetivo:d.objetivo,estatus:d.estatus,apartado:!!d.apartado,notas:d.notas.trim()};
      if(l){Object.assign(l,v);db(()=>sb.from("hot_leads").update(v).eq("id",l.id))}else{const n={id:newId(),...v};leads.push(n);db(()=>sb.from("hot_leads").insert(n))}},
    null);
}
loadAll().then(render);
if(sb){setInterval(()=>{if(!$("#drawer-root").innerHTML&&document.activeElement?.id!=="f-q")loadAll().then(render)},60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#drawer-root").innerHTML)loadAll().then(render)})}
</script>
</body>
