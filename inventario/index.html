<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F2">
<title>Inventario | TRUST</title>
<link rel="icon" href="data:,">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  --green:#173F35; --green-2:#1F5446; --gold:#B8956A; --gold-2:#9C7A4E;
  --bg:#FAF8F2; --surface:#FFFFFF; --surface-2:#F1EDE3; --line:#E3DDD0; --line-2:#CFC6B4;
  --text:#1E241F; --muted:#6F726B; --faint:#97999B;
  --st-disp:#2E7D5B; --st-disp-bg:#E1F1E8;
  --st-apart:#B27A0F; --st-apart-bg:#FBF0D6;
  --st-vend:#5C5F5A; --st-vend-bg:#ECEBE6;
  --st-bloq:#A8342A; --st-bloq-bg:#F8E1DE;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);
}

/* contraste */
:root{--muted:#585C57;--faint:#8A8D88;--line:#D9D2C3;--line-2:#BFB5A0;--surface-2:#EFEAE0}
td{color:var(--text)}
td.dim{color:#6B6E68}
th{background:#EFEAE0;color:#4F534E}
tbody tr:nth-child(even) td{background:#FBFAF6}
.meta span b{font-weight:600}
.tile{border-color:var(--line-2)}
.twrap{border-color:var(--line-2)}
.pill.in,.pcard .n{font-weight:600}

  

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#9CC7B6; --green-2:#B9DACB; --gold:#CDAA7C; --gold-2:#E0C39A;
    --bg:#131917; --surface:#1B2320; --surface-2:#242E29; --line:#38443E; --line-2:#4A574F;
    --text:#ECEBE4; --muted:#B5B9B2; --faint:#8C918B;
    --st-disp:#8BD4B0; --st-disp-bg:#1E3A2E;
    --st-apart:#E9C069; --st-apart-bg:#3D3117;
    --st-vend:#B6B9B2; --st-vend-bg:#2A2F2B;
    --st-bloq:#F0958B; --st-bloq-bg:#42201C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  :root:not([data-theme="light"]) th{background:#242E29;color:#C9CDC6}
  :root:not([data-theme="light"]) td.dim{color:#A9ADA6}
  :root:not([data-theme="light"]) tbody tr:nth-child(even) td{background:#1E2724}
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .pbtn,:root:not([data-theme="light"]) .vseg button[aria-pressed="true"]{color:#0F1613}
  :root:not([data-theme="light"]) .brand .logo{filter:brightness(0) invert(.93)}
  :root:not([data-theme="light"]) .un.Brokerage{background:#22314A;color:#9DB7E6}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600}

/* header */
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.home-link:hover{color:var(--green);border-color:var(--green)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .logo{width:130px;height:auto;margin-bottom:8px}
.brand h1{font-size:28px;color:var(--green)}
.brand .sub{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

/* layout */
.grid{margin-top:20px}
/* project picker */
.picker{position:relative;display:inline-block}
.pbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:10px 14px 10px 16px;text-align:left;min-width:260px;box-shadow:var(--shadow)}
.pbtn:hover{background:var(--green-2);border-color:var(--green-2)}
.pbtn .t{display:flex;flex-direction:column;flex:1;min-width:0}
.pbtn .t b{font-family:Lora,serif;font-weight:500;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn .t small{font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.pbtn .chev{font-size:12px;opacity:.8;transition:transform .15s}
.picker[open] .chev{transform:rotate(180deg)}
.pmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:15;min-width:100%;width:max-content;max-width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none}
.picker[open] .pmenu{display:block}
.pmenu .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:0 16px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px}
.pitem:hover,.pitem:focus-visible{background:var(--surface-2);outline:none}
.pitem[aria-current="true"]{box-shadow:inset 3px 0 0 var(--gold)}
.pitem .n{font-family:Lora,serif;font-size:15px;color:var(--green)}
.pitem .g{color:var(--muted);font-size:12px;grid-column:1}
.pitem .k{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pitem .k b{color:var(--st-disp);font-weight:600;font-size:15px}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.addp{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);font-size:13px}
.addp:hover{background:var(--surface-2);color:var(--green)}
.phead .left{display:flex;flex-direction:column;gap:10px;min-width:0}

/* main */
.main{min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.phead h2{font-size:26px;color:var(--green)}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.meta span b{color:var(--text);font-weight:500}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.in{background:var(--green);color:#fff}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2);border-color:var(--green-2)}
.btn.danger{color:var(--st-bloq)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:Lora,serif;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.disp .v{color:var(--st-disp)}.tile.apart .v{color:var(--st-apart)}.tile.vend .v{color:var(--st-vend)}.tile.bloq .v{color:var(--st-bloq)}
.tile.disp::after,.tile.apart::after,.tile.vend::after,.tile.bloq::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.tile.disp::after{background:var(--st-disp)}.tile.apart::after{background:var(--st-apart)}.tile.vend::after{background:var(--st-vend)}.tile.bloq::after{background:var(--st-bloq)}

.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.bar i{display:block;height:100%}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.filters select,.filters input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px}
.filters input{min-width:140px;flex:1}
.filters .count{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

.twrap{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th[data-dir]::after{content:" ↑";color:var(--gold)}
th[data-dir="desc"]::after{content:" ↓"}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.type{font-family:Lora,serif;font-size:15px;color:var(--gold-2);font-weight:500}
td.price{font-weight:600}
th.eng{color:var(--gold-2)}
td.eng{color:var(--gold-2);font-weight:600}
td.tot{font-weight:500}
td.dim{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;background:var(--st-vend-bg);color:var(--st-vend);appearance:none;-webkit-appearance:none;cursor:pointer}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.Disponible{background:var(--st-disp-bg);color:var(--st-disp)}
.st.Apartado{background:var(--st-apart-bg);color:var(--st-apart)}
.st.Vendido{background:var(--st-vend-bg);color:var(--st-vend)}
.st.Bloqueado{background:var(--st-bloq-bg);color:var(--st-bloq)}
select.st{padding-right:10px}
.cot{display:inline-block;font-size:12px;font-weight:500;color:var(--green);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;margin-right:4px;background:var(--surface)}
.cot:hover{background:var(--green);color:#fff;border-color:var(--green)}
.cot.off{opacity:.45}
.ico{border:0;background:transparent;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:12px}
.ico:hover{color:var(--green);background:var(--surface-2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:Lora,serif;font-size:18px;color:var(--text);font-weight:500;margin-bottom:6px}
.notes{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.notes .eyebrow{display:block;margin-bottom:6px}
.notes p{margin:0;color:var(--muted);white-space:pre-wrap}
.foot{margin-top:28px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}


/* vista precios | política */
.vseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:18px}
.vseg button{border:0;background:transparent;border-radius:999px;padding:7px 18px;color:var(--muted);font-weight:500;font-size:13px}
.vseg button[aria-pressed="true"]{background:var(--green);color:#fff}
.pol{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 28px;max-width:820px;line-height:1.6}
.pol h3{font-family:Lora,Georgia,serif;font-size:20px;color:var(--green);font-weight:500;margin:0 0 4px}
.pol h4{font-family:Lora,Georgia,serif;font-size:16px;color:var(--green);font-weight:500;margin:18px 0 6px}
.pol p{margin:0 0 10px}
.pol ul{margin:0 0 12px;padding-left:20px}
.pol li{margin:3px 0}
.pol .upd{font-size:12px;color:var(--faint);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pol.empty{color:var(--muted);text-align:center;padding:36px}
.pol.empty b{display:block;font-family:Lora,serif;font-size:18px;color:var(--text);font-weight:500;margin-bottom:6px}

/* documentos */
.docs{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--text);transition:border-color .15s}
.doc:hover{border-color:var(--gold)}
.doc .ext{flex:none;width:40px;height:40px;border-radius:8px;background:var(--surface-2);color:var(--green);font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.doc .n{min-width:0;flex:1}
.doc .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .n small{color:var(--muted);font-size:11px}
.doc .del{flex:none}
.upl{margin-top:14px;border:1px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface)}
.upl.drag{border-color:var(--green);color:var(--green);background:var(--surface-2)}
.upl input{display:none}
.upl label{color:var(--green);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.upl .prog{margin-top:8px;font-size:12px}

/* políticas estructuradas */
.pols{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.polc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative}
.polc h3{font-family:Lora,Georgia,serif;font-size:18px;color:var(--green);font-weight:500;margin:0 0 10px}
.polc .steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.polc .stp{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.polc .stp small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.polc .stp b{display:block;font-family:Lora,serif;font-size:20px;font-weight:500;color:var(--text);line-height:1.15;margin-top:2px}
.polc .stp span{font-size:11px;color:var(--muted)}
.polc .stp.esc b{color:var(--gold-2)}
.polc .bar{margin-top:12px}
.polc .ej{margin-top:10px;font-size:12px;color:var(--muted)}
.polc .ej b{color:var(--text);font-weight:500}
.polnote{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-width:820px;line-height:1.6}
/* editor */
.pe{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:2px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.pe .full{grid-column:1/-1}
.pe .rm{position:absolute;top:8px;right:8px}
.pe .row{display:flex;gap:6px}
.pe .row input{flex:1;min-width:80px}
.pe .row select{width:auto;flex:none}
.pe .calc{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pe .calc b{color:var(--gold-2)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,22,19,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{font-size:20px;color:var(--green)}
.drawer form{padding:16px 20px;overflow:auto;display:grid;gap:12px;grid-template-columns:1fr 1fr;flex:1}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.btn:focus-visible,.pcard:focus-visible,.st:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.drawer footer{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.hint{grid-column:1/-1;font-size:12px;color:var(--faint);margin:0}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(30px);opacity:0}}}
</style>

<div class="wrap">

  (us||[]).sort((a,b)=>nivKey(a.nivel)-nivKey(b.nivel)).forEach(u=>{const p=byId[u.proyecto_id];if(p)p.units.push({id:u.id,estatus:u.estatus,tipo:u.tipo,torre:u.torre,nivel:u.nivel,vista:u.vista,m2int:+u.m2int||0,m2terr:+u.m2terr||0,m2tot:+u.m2tot||0,parking:u.parking,precio:+u.precio||0,recamaras:u.recamaras,banos:u.banos})});
  lastSync=new Date(); setSync();
  S.projects.forEach(p=>{ if(!docs[p.id]) loadDocs(p.id).then(()=>{ if(p.id===S.sel && !$("#drawer-root").innerHTML && document.activeElement?.id!=="f-q") renderMain(); }); });
}
function setSync(msg){const el=$("#sync");if(!el)return;const rb=$("#btn-refresh"),rs=$("#btn-reset");if(rb)rb.hidden=!sb;if(rs)rs.hidden=!!sb;el.textContent=msg||(sb?"Supabase · "+lastSync.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}):"Modo local · los cambios se guardan solo en este navegador");}
function db(fn){ if(!sb)return; fn().then(({error})=>{ if(error){alert("No se pudo guardar en Supabase: "+error.message);loadAll().then(render)} else {lastSync=new Date();setSync()} }).catch(err=>alert("Sin conexión: "+err.message)); }
const newId=()=>(crypto.randomUUID?crypto.randomUUID():uid());

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const fmt=n=>n==null||isNaN(n)?"—":"$ "+Math.round(n).toLocaleString("es-MX");
const fmtM=n=>n>=1e6?"$ "+(n/1e6).toFixed(1).replace(/\.0$/,"")+" M":fmt(n);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const engMin=p=>{const pols=Array.isArray(p.politicas)?p.politicas:[];const pcts=pols.filter(x=>x.eng_tipo!=="monto"&&+x.eng>0).map(x=>+x.eng);if(pcts.length)return Math.min(...pcts);return (p.enganche==null||p.enganche===""||+p.enganche<=0)?5:+p.enganche};
const COTIZADOR_URL="../cotizador/";
const cotUrl=(p,u)=>{const o={proyecto:p.nombre,giro:p.giro,tipo:/preventa/i.test(p.giro)?"Preventa":"Obra terminada",id:u.tipo,nivel:u.nivel,vista:u.vista,m2int:u.m2int,m2terr:u.m2terr,rec:u.recamaras,banos:u.banos,estac:u.parking,precio:u.precio};const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");return COTIZADOR_URL+"?u="+b};
const nivKey=v=>{const t=String(v??"").trim().toUpperCase();if(t==="PB"||t==="S"||t==="SÓTANO"||t==="SOTANO")return -1;if(t.startsWith("PH"))return 999;const n=parseFloat(t);return isNaN(n)?500:n};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const isRenta=p=>/renta/i.test(p.giro||"");
function counts(p){const c={Disponible:0,Apartado:0,Vendido:0,Bloqueado:0,dispVal:0};p.units.forEach(u=>{c[u.estatus]=(c[u.estatus]||0)+1;if(u.estatus==="Disponible")c.dispVal+=u.precio||0});return c}
let filt={q:"",estatus:"",torre:"",tipo:"",vista:""};
let vista="precios"; // precios | politica | docs
let docs={}; // proyecto_id -> [{name,url,size,updated}]
let sort={k:null,dir:"asc"};

// ---------- render ----------
function render(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===S.cat));
  const list=S.projects.filter(p=>p.cat===S.cat);
  if(!list.find(p=>p.id===S.sel)) S.sel=list[0]?.id||null;
  renderMain();
}
function pickerHTML(){
  const list=S.projects.filter(p=>p.cat===S.cat);
  const cur=list.find(p=>p.id===S.sel);
  return `<div class="picker" id="picker">
    <button class="pbtn" id="pbtn" aria-haspopup="listbox" aria-expanded="false">
      <span class="t"><small>Proyecto · ${S.cat}</small><b>${cur?esc(cur.nombre):"Selecciona un proyecto"}</b></span><span class="chev">▼</span></button>
    <div class="pmenu" role="listbox">
      <div class="lbl">${list.length} proyecto${list.length===1?"":"s"} ${S.cat}</div>
      ${list.map(p=>{const c=counts(p);return `<button class="pitem" role="option" data-id="${p.id}" aria-current="${p.id===S.sel}">
        <span class="n">${esc(p.nombre)}</span><span class="g">${esc(p.giro)}</span>
        <span class="k">${p.units.length?`<b>${c.Disponible}</b> disp. de ${p.units.length}`:"sin unidades"}</span></button>`}).join("")}
      ${READONLY?"":`<hr><button class="addp" id="btn-add-project">+ Agregar proyecto</button>`}
    </div></div>`;
}
function renderMain(){
  const p=S.projects.find(x=>x.id===S.sel);
  const m=$("#main");
  if(!p){m.innerHTML=`<div class="phead"><div class="left">${pickerHTML()}</div></div><div class="empty"><b>Sin proyectos ${S.cat}</b>Agrega el primero desde el menú.</div>`;return}
  const c=counts(p), n=p.units.length, renta=isRenta(p), eng=engMin(p);
  const meta=[["Giro",p.giro],["Desarrollador",p.desarrollador],["Ubicación",p.ubicacion],["Lista vigente",p.lista]].filter(x=>x[1]).map(x=>`<span>${x[0]}: <b>${esc(x[1])}</b></span>`).join("");
  const labelSold=renta?"Rentado":"Vendido";
  const tiles=`
    <div class="tiles">
      <div class="tile"><span class="l">Unidades</span><span class="v">${n}</span><span class="s">${p.units.reduce((a,u)=>a+(u.m2tot||0),0).toLocaleString("es-MX",{maximumFractionDigits:0})} m² total</span></div>
      <div class="tile disp"><span class="l">Disponible</span><span class="v">${c.Disponible}</span><span class="s">${renta||!c.Disponible?fmtM(c.dispVal)+" en lista":"desde "+fmt(Math.min(...p.units.filter(u=>u.estatus==="Disponible").map(u=>u.precio))*eng/100)+" de enganche"}</span></div>
      <div class="tile apart"><span class="l">Apartado</span><span class="v">${c.Apartado}</span><span class="s">${n?Math.round(c.Apartado/n*100)+"%":"—"}</span></div>
      <div class="tile vend"><span class="l">${labelSold}</span><span class="v">${c.Vendido}</span><span class="s">${n?Math.round(c.Vendido/n*100)+"%":"—"}</span></div>
      <div class="tile bloq"><span class="l">Bloqueado</span><span class="v">${c.Bloqueado}</span><span class="s">${n?Math.round(c.Bloqueado/n*100)+"%":"—"}</span></div>
    </div>
    ${n?`<div class="bar" title="Avance de comercialización">
      <i style="width:${c.Vendido/n*100}%;background:var(--st-vend)"></i>
      <i style="width:${c.Apartado/n*100}%;background:var(--st-apart)"></i>
      <i style="width:${c.Bloqueado/n*100}%;background:var(--st-bloq)"></i>
      <i style="width:${c.Disponible/n*100}%;background:var(--st-disp)"></i></div>`:""}`;
  const opts=k=>[...new Set(p.units.map(u=>u[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"es",{numeric:true}));
  const sel=(id,k,lbl)=>`<select id="${id}" data-k="${k}"><option value="">${lbl}</option>${opts(k).map(v=>`<option ${filt[k]===v?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
  let rows=p.units.filter(u=>(!filt.estatus||u.estatus===filt.estatus)&&(!filt.torre||u.torre===filt.torre)&&(!filt.tipo||u.tipo===filt.tipo)&&(!filt.vista||u.vista===filt.vista)
    &&(!filt.q||[u.tipo,u.torre,u.nivel,u.vista,u.parking,u.clave].join(" ").toLowerCase().includes(filt.q.toLowerCase())));
  if(sort.k){const k=sort.k,d=sort.dir==="asc"?1:-1;rows=[...rows].sort((a,b)=>{const x=k==="nivel"?nivKey(a[k]):a[k]??"",y=k==="nivel"?nivKey(b[k]):b[k]??"";return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es",{numeric:true}))*d})}
  const th=(k,l,num)=>`<th data-k="${k}" ${sort.k===k?`data-dir="${sort.dir}"`:""} class="${num?"num":""}">${l}</th>`;
  const table=n?`
    <div class="filters">
      <input id="f-q" placeholder="Buscar…" value="${esc(filt.q)}">
      <select id="f-estatus" data-k="estatus"><option value="">Estatus</option>${STATUSES.map(s=>`<option ${filt.estatus===s?"selected":""}>${s}</option>`).join("")}</select>
      ${sel("f-torre","torre","Torre")}${sel("f-tipo","tipo","ID")}${sel("f-vista","vista","Vista")}
      <span class="count">${rows.length} de ${n}</span>
    </div>
    <div class="twrap"><table>
      <thead><tr>${th("estatus","Estatus")}${th("tipo","ID")}${th("torre","Torre")}${th("nivel","Nivel",1)}${th("vista","Vista")}${th("recamaras","Rec.",1)}${th("banos","Baños",1)}${th("m2int","m² int.",1)}${th("m2terr","m² terr.",1)}${th("m2tot","m² total",1)}${th("parking","Cajones",1)}${th("precio",renta?"Renta mensual":"Precio",1)}${renta?"":`<th class="num eng">Enganche mín. ${eng}%</th>`}<th></th></tr></thead>
      <tbody>${rows.map(u=>`<tr data-id="${u.id}">
        <td>${READONLY?`<span class="st ${u.estatus}">${u.estatus}</span>`:`<select class="st ${u.estatus}" data-id="${u.id}" aria-label="Estatus">${STATUSES.map(s=>`<option ${u.estatus===s?"selected":""}>${s}</option>`).join("")}</select>`}</td>
        <td class="type">${esc(u.tipo)}</td><td>${esc(u.torre)}</td><td class="num">${esc(u.nivel??"")}</td><td>${esc(u.vista)}</td><td class="num dim">${esc(u.recamaras??"")}</td><td class="num dim">${u.banos??""}</td>
        <td class="num dim">${u.m2int?.toFixed(2)??""}</td><td class="num dim">${u.m2terr?u.m2terr.toFixed(2):"–"}</td><td class="num tot">${u.m2tot?.toFixed(2)??""}</td>
        <td class="num">${u.parking??""}</td><td class="num price">${fmt(u.precio)}</td>${renta?"":`<td class="num eng">${fmt(u.precio*eng/100)}</td>`}
        <td style="white-space:nowrap"><a class="cot ${u.estatus==="Disponible"?"":"off"}" href="${cotUrl(p,u)}" target="_blank" rel="noopener" title="Cotizar esta unidad">Cotizar</a>${READONLY?"":`<button class="ico edit-u" data-id="${u.id}" title="Editar">✎</button>`}</td></tr>`).join("")}</tbody>
    </table>${rows.length?"":`<div class="empty">Ninguna unidad coincide con los filtros.</div>`}</div>`
  :`<div class="empty" style="margin-top:18px;border:1px dashed var(--line-2);border-radius:0"><b>Sin unidades cargadas</b>${READONLY?"Aún no hay inventario capturado para este proyecto.":"Agrega las unidades desde la lista de precios o el Excel del desarrollador."}</div>`;
  if(renta&&vista==="politica")vista="precios";

  const pol=(pols.length?`<div class="pols">${pols.map(x=>polCard(x,isFinite(minP)?minP:null)).join("")}</div>`:`<div class="pol empty"><b>Sin políticas de venta</b>${READONLY?"Pronto estarán disponibles para este proyecto.":"Usa \"Editar políticas\" para capturarlas."}</div>`)+(p.politica?`<div class="polnote">${polHTML(p.politica)}</div>`:"");

    </div>

}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t)return;
  if(t.dataset.cat){S.cat=t.dataset.cat;filt={q:"",estatus:"",torre:"",tipo:"",vista:""};save();render();return}
  if(t.id==="pbtn"){const pk=$("#picker");const open=pk.toggleAttribute("open");t.setAttribute("aria-expanded",open);if(open)($("#picker .pitem[aria-current='true']")||$("#picker .pitem"))?.focus();return}
  if(t.classList.contains("pitem")){S.sel=t.dataset.id;vista="precios";delete docs[t.dataset.id];filt={q:"",estatus:"",torre:"",tipo:"",vista:""};sort={k:null,dir:"asc"};save();render();return}
  if(t.dataset.vista){vista=t.dataset.vista;renderMain();return}
  if(t.classList.contains("del-doc")){e.preventDefault();deleteDoc(S.sel,t.dataset.name);return}
  if(t.id==="btn-pdf")return listaPDF(S.projects.find(p=>p.id===S.sel));
  if(READONLY)return;
  if(t.id==="btn-add-project")return openProject(null);
  if(t.id==="btn-edit-project")return openProject(S.projects.find(p=>p.id===S.sel));
  if(t.id==="btn-add-unit")return openUnit(null);
  if(t.id==="btn-import")return openImport(S.projects.find(p=>p.id===S.sel));
  if(t.id==="btn-edit-pol")return openPolitica(S.projects.find(p=>p.id===S.sel));
  if(t.classList.contains("edit-u")){const p=S.projects.find(p=>p.id===S.sel);return openUnit(p.units.find(u=>u.id===t.dataset.id))}
  if(t.id==="btn-reset"&&!sb&&confirm("¿Volver a los datos iniciales? Se perderán los cambios de este navegador.")){S=seed();save();render()}
  if(t.id==="btn-refresh"&&sb){loadAll().then(render)}
});

});

// ---------- política de venta ----------
function polHTML(txt){
  const lines=String(txt).replace(/\r/g,"").split("\n"); let out="",ul=false;
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const raw of lines){const l=raw.trim();
    if(l.startsWith("- ")||l.startsWith("• ")){if(!ul){out+="<ul>";ul=true}out+=`<li>${inl(l.slice(2))}</li>`;continue}
    if(ul){out+="</ul>";ul=false}
    if(!l)continue;
    if(l.startsWith("# "))out+=`<h3>${inl(l.slice(2))}</h3>`;
    else if(l.startsWith("## "))out+=`<h4>${inl(l.slice(3))}</h4>`;
    else out+=`<p>${inl(l)}</p>`;}
  if(ul)out+="</ul>";
  return out;
}
const pct=v=>(+v).toLocaleString("es-MX",{maximumFractionDigits:2})+"%";
function polCalc(x){ // devuelve % de cada bloque cuando se puede

  const mTot=x.men_tipo==="pct"?+x.men||0:null; // % total del bloque de mensualidades
  const saldo=(e!=null&&mTot!=null)?Math.max(0,100-e-mTot):null;
  return {e,mTot,saldo};
}

  const dsc=+x.desc||0;

      <div class="stp esc"><small>Saldo a escritura</small><b>${saldoTxt}</b><span>${saldo!=null?"del precio":"al escriturar"}</span></div>
    </div>
    ${saldo!=null?`<div class="bar"><i style="width:${w(e)}%;background:var(--green)"></i><i style="width:${w(mTot)}%;background:var(--st-apart)"></i><i style="width:${w(saldo)}%;background:var(--gold)"></i></div>`:""}
    ${ej}${x.nota?`<div class="ej">${esc(x.nota)}</div>`:""}</div>`;
}
function openPolitica(p){
  let list=JSON.parse(JSON.stringify(Array.isArray(p.politicas)?p.politicas:[]));
  if(!list.length)list.push({nombre:"",desc:0,eng_tipo:"pct",eng:10,meses:0,men_tipo:"pct",men:0,nota:""});
  const row=(x,i)=>`<div class="pe" data-i="${i}">
    <button type="button" class="ico rm" title="Quitar">✕</button>
    <div class="f"><label>Nombre de la política</label><input name="nombre_${i}" value="${esc(x.nombre)}" placeholder="Ej. Contado, 30/70, 24 meses" required></div>
    <div class="f"><label>Descuento sobre lista (%)</label><input name="desc_${i}" type="number" step="0.01" min="0" max="100" value="${x.desc??0}"></div>
    <div class="f"><label>Enganche</label><div class="row"><input name="eng_${i}" type="number" step="0.01" min="0" value="${x.eng??""}" required><select name="eng_tipo_${i}"><option value="pct" ${x.eng_tipo!=="monto"?"selected":""}>%</option><option value="monto" ${x.eng_tipo==="monto"?"selected":""}>$ MXN</option></select></div></div>
    <div class="f"><label>Número de mensualidades</label><input name="meses_${i}" type="number" step="1" min="0" value="${x.meses??0}"></div>
    <div class="f full"><label>Mensualidades (total del bloque en % o monto por mes)</label><div class="row"><input name="men_${i}" type="number" step="0.01" min="0" value="${x.men??0}"><select name="men_tipo_${i}"><option value="pct" ${x.men_tipo!=="monto"?"selected":""}>% total</option><option value="monto" ${x.men_tipo==="monto"?"selected":""}>$ por mes</option></select></div></div>
    <div class="f full"><label>Nota (opcional)</label><input name="nota_${i}" value="${esc(x.nota||"")}" placeholder="Ej. descuento 5% pagando en una exhibición"></div>
    <div class="calc" id="calc_${i}"></div></div>`;
  const body=()=>list.map(row).join("")+`<button type="button" class="btn" id="pol-add" style="grid-column:1/-1">+ Agregar política</button>
    <div class="f full" style="margin-top:6px"><label for="fx-politica">Notas generales (opcional)</label><textarea id="fx-politica" name="politica" style="min-height:90px">${esc(p.politica||"")}</textarea></div>`;
  drawer("Políticas de venta · "+p.nombre, body(),
    d=>{const out=list.map((x,i)=>({nombre:(d["nombre_"+i]||"").trim(),desc:+d["desc_"+i]||0,eng_tipo:d["eng_tipo_"+i],eng:+d["eng_"+i]||0,meses:+d["meses_"+i]||0,men_tipo:d["men_tipo_"+i],men:+d["men_"+i]||0,nota:(d["nota_"+i]||"").trim()})).filter(x=>x.nombre);
      p.politicas=out;p.politica=d.politica;db(()=>sb.from("proyectos").update({politicas:out,politica:p.politica}).eq("id",p.id))},null);
  const f=$("#d-form");
  const recalc=()=>{list.forEach((x,i)=>{const d=Object.fromEntries(new FormData(f));const y={eng_tipo:d["eng_tipo_"+i],eng:d["eng_"+i],men_tipo:d["men_tipo_"+i],men:d["men_"+i],meses:d["meses_"+i]};const c=polCalc(y);const el=$("#calc_"+i);if(!el)return;
    el.innerHTML=c.saldo!=null?`Saldo a escritura: <b>${pct(c.saldo)}</b>${+y.meses&&y.men_tipo==="pct"?` · ${pct((+y.men||0)/+y.meses)} por mensualidad`:""}`:`Saldo a escritura: <b>resto</b> (se calcula por unidad)`;})};
  const rebuild=()=>{list=list.map((x,i)=>{const d=Object.fromEntries(new FormData(f));return {nombre:d["nombre_"+i]??x.nombre,desc:d["desc_"+i]??x.desc,eng_tipo:d["eng_tipo_"+i]??x.eng_tipo,eng:d["eng_"+i]??x.eng,meses:d["meses_"+i]??x.meses,men_tipo:d["men_tipo_"+i]??x.men_tipo,men:d["men_"+i]??x.men,nota:d["nota_"+i]??x.nota}});};
  f.addEventListener("input",recalc); f.addEventListener("change",recalc);
  f.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="pol-add"){rebuild();list.push({nombre:"",desc:0,eng_tipo:"pct",eng:10,meses:0,men_tipo:"pct",men:0,nota:""});f.innerHTML=body();recalc();return}
    if(b.classList.contains("rm")){rebuild();const i=+b.closest(".pe").dataset.i;list.splice(i,1);if(!list.length)list.push({nombre:"",desc:0,eng_tipo:"pct",eng:10,meses:0,men_tipo:"pct",men:0,nota:""});f.innerHTML=body();recalc();}});
  recalc();
}


// ---------- documentos (Supabase Storage, bucket "documentos") ----------
const BUCKET="documentos";
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+" MB":b>1024?Math.round(b/1024)+" KB":b+" B";
async function loadDocs(pid){
  if(!sb){docs[pid]=docs[pid]||[];return}
  const {data,error}=await sb.storage.from(BUCKET).list(pid,{limit:200,sortBy:{column:"name",order:"asc"}});
  if(error){docs[pid]=[];setSync("Documentos: "+error.message);return}
  docs[pid]=(data||[]).filter(f=>f.name&&!f.name.startsWith(".")).map(f=>({name:f.name,size:f.metadata?.size||0,updated:f.updated_at||f.created_at,url:sb.storage.from(BUCKET).getPublicUrl(pid+"/"+f.name).data.publicUrl}));
}
function docsHTML(p){
  const list=docs[p.id];
  if(!sb)return `<div class="pol empty"><b>Documentos</b>Disponible cuando el panel está conectado a Supabase.</div>`;
  if(!list)return `<div class="pol empty">Cargando documentos…</div>`;
  const items=list.map(d=>{const ext=(d.name.split(".").pop()||"").slice(0,4);
    return `<a class="doc" href="${d.url}" target="_blank" rel="noopener"><span class="ext">${esc(ext)}</span><span class="n"><b title="${esc(d.name)}">${esc(d.name)}</b><small>${fmtSize(d.size)}${d.updated?" · "+new Date(d.updated).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}):""}</small></span>${READONLY?"":`<button class="ico del del-doc" data-name="${esc(d.name)}" title="Eliminar">✕</button>`}</a>`}).join("");
  const empty=`<div class="pol empty"><b>Sin documentos</b>${READONLY?"Aún no hay archivos para este proyecto.":"Sube el brochure, planos, lista del desarrollador o lo que necesite el equipo."}</div>`;
  const upl=READONLY?"":`<div class="upl" id="upl"><input type="file" id="doc-file" multiple><label for="doc-file">Elegir archivos</label> o arrástralos aquí · PDF, imágenes, Excel… (máx. 50 MB c/u)<div class="prog" id="upl-prog"></div></div>`;
  return (list.length?`<div class="docs">${items}</div>`:empty)+upl;
}
async function uploadDocs(pid,files){
  const prog=$("#upl-prog"); let n=0;
  for(const f of files){
    if(f.size>50*1048576){alert(f.name+": supera 50 MB");continue}
    const name=f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w.\-() ]+/g,"_");
    if(prog)prog.textContent=`Subiendo ${++n} de ${files.length}: ${name}…`;
    const {error}=await sb.storage.from(BUCKET).upload(pid+"/"+name,f,{upsert:true,contentType:f.type||undefined});
    if(error){alert("No se pudo subir "+name+": "+error.message)}
  }
  delete docs[pid]; await loadDocs(pid); renderMain();
}
async function deleteDoc(pid,name){
  if(!confirm("¿Eliminar "+name+"?"))return;
  const {error}=await sb.storage.from(BUCKET).remove([pid+"/"+name]);
  if(error){alert("No se pudo eliminar: "+error.message);return}
  delete docs[pid]; await loadDocs(pid); renderMain();
}


// ---------- importar unidades (pegar desde Excel) ----------
const IMP_COLS=[["estatus",/^estatus|status$/i],["tipo",/^id|tipo|prototipo|modelo|unidad|depto|depa$/i],["recamaras",/rec[aá]m|hab|dorm/i],["banos",/ba[ñn]o/i],["torre",/^torre|edificio$/i],["nivel",/^nivel|piso$/i],["vista",/^vista|orientaci/i],["m2int",/m.?2?\s*int|interior/i],["m2terr",/terr/i],["m2tot",/total/i],["parking",/cajon|parking|estac/i],["precio",/precio|renta|monto/i]];
const numv=v=>{const n=parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(/,/g,""));return isNaN(n)?null:n};
function parseImport(txt){
  const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.split("\t")).filter(r=>r.some(c=>c.trim()));
  if(!lines.length)return {rows:[],map:null};
  let map=null,start=0;
  const h=lines[0].map(c=>c.trim());
  const isHeader=h.filter(c=>IMP_COLS.some(([k,re])=>re.test(c))).length>=3;
  if(isHeader){map=h.map(c=>{const f=IMP_COLS.find(([k,re])=>re.test(c));return f?f[0]:null});start=1}
  else map=["estatus","tipo","torre","nivel","vista","recamaras","banos","m2int","m2terr","parking","precio"]; // orden por default sin encabezado
  const rows=[];
  for(const r of lines.slice(start)){const o={};map.forEach((k,i)=>{if(k&&r[i]!=null)o[k]=r[i].trim()});
    if(!o.tipo&&!o.precio)continue;
    const st=(o.estatus||"Disponible").toLowerCase();
    const estatus=st.startsWith("apart")?"Apartado":st.startsWith("vend")||st.startsWith("rent")?"Vendido":st.startsWith("bloq")?"Bloqueado":"Disponible";
    const m2int=numv(o.m2int)||0,m2terr=numv(o.m2terr)||0;
    rows.push({estatus,tipo:o.tipo||"",torre:o.torre||"",nivel:(o.nivel||"").trim()||null,vista:o.vista||"",recamaras:(o.recamaras||"").trim()||null,banos:numv(o.banos),m2int,m2terr,m2tot:numv(o.m2tot)||+(m2int+m2terr).toFixed(2),parking:numv(o.parking),precio:numv(o.precio)||0});}
  return {rows,map};
}
function openImport(p){
  drawer("Importar unidades · "+p.nombre,
    `<p class="hint" style="grid-column:1/-1;margin:0 0 4px">Copia las filas desde Excel o Google Sheets (con o sin encabezados) y pégalas aquí. Columnas reconocidas: <b>Estatus, ID, Torre, Nivel, Vista, Recámaras, Baños, m² int, m² terraza, m² total, Cajones, Precio</b>. Sin encabezados se asume ese orden (sin m² total).</p>
     <div class="f full"><label for="fx-imp">Pegar aquí</label><textarea id="fx-imp" name="imp" style="min-height:220px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre"></textarea></div>
     <div class="f full"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text);font-size:13px"><input type="checkbox" name="replace" id="fx-replace" style="width:auto;flex:none"> Reemplazar las ${p.units.length} unidades actuales del proyecto</label></div>
     <div class="calc" id="imp-prev" style="grid-column:1/-1;font-size:12px;color:var(--muted)">Pega para ver la vista previa.</div>`,
    d=>{const {rows}=parseImport(d.imp);if(!rows.length){alert("No se detectaron filas.");return}
      const nuevos=rows.map(r=>({id:newId(),...r}));
      const doIns=()=>{p.units.push(...nuevos);db(()=>sb.from("unidades").insert(nuevos.map(u=>rowU(u,p.id))))};
      if(d.replace&&p.units.length){const ids=p.units.map(u=>u.id);p.units=[];if(sb){sb.from("unidades").delete().in("id",ids).then(({error})=>{if(error){alert("No se pudieron borrar: "+error.message);return}doIns();render()})}else doIns()}
      else doIns();},null);
  const ta=$("#fx-imp");
  ta.addEventListener("input",()=>{const {rows,map}=parseImport(ta.value);const el=$("#imp-prev");if(!rows.length){el.textContent="Sin filas válidas todavía.";return}
    const c={};rows.forEach(r=>c[r.estatus]=(c[r.estatus]||0)+1);
    el.innerHTML=`<b style="color:var(--green)">${rows.length} unidades</b> · ${Object.entries(c).map(([k,v])=>`${v} ${k.toLowerCase()}`).join(", ")} · columnas: ${map.filter(Boolean).join(", ")}<br>Ej.: ${esc(rows[0].tipo)} · ${esc(rows[0].torre)} · nivel ${rows[0].nivel??"—"} · ${rows[0].m2tot} m² · ${fmt(rows[0].precio)}`;});
}

// ---------- drawers ----------
function drawer(title,body,onSave,onDelete){
  $("#drawer-root").innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer" role="dialog" aria-label="${esc(title)}">
    <header><h3>${esc(title)}</h3><button class="ico" id="d-close" aria-label="Cerrar">✕</button></header>
    <form id="d-form">${body}</form>
    <footer><span>${onDelete?`<button type="button" class="btn danger" id="d-del">Eliminar</button>`:""}</span>
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="d-cancel">Cancelar</button><button type="button" class="btn primary" id="d-save">Guardar</button></span></footer></div>`;
  const close=()=>$("#drawer-root").innerHTML="";
  $("#scrim").onclick=close;$("#d-close").onclick=close;$("#d-cancel").onclick=close;
  $("#d-save").onclick=()=>{const f=$("#d-form");if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));f.querySelectorAll("input[type=checkbox]").forEach(c=>d[c.name]=c.checked);onSave(d);save();render();close()};
  if(onDelete)$("#d-del").onclick=()=>{if(confirm("¿Eliminar?")){onDelete();save();render();close()}};
  $("#d-form").addEventListener("submit",e=>{e.preventDefault();$("#d-save").click()});
  const first=$("#d-form input,#d-form select");first&&first.focus();
}
const fld=(name,label,val="",attrs="",full=false)=>`<div class="f ${full?"full":""}"><label for="fx-${name}">${label}</label><input id="fx-${name}" name="${name}" value="${esc(val)}" ${attrs}></div>`;
const fsel=(name,label,val,opts,full=false)=>`<div class="f ${full?"full":""}"><label for="fx-${name}">${label}</label><select id="fx-${name}" name="${name}">${opts.map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select></div>`;

function openProject(p){
  const giros=["Departamentos en preventa","Oficinas en renta","Oficinas en venta","Locales","Terrenos","Otro"];
  drawer(p?"Editar proyecto":"Nuevo proyecto",
    fld("nombre","Nombre",p?.nombre||"","required",true)+
    fsel("cat","Categoría",p?.cat||S.cat,["In House","Off House"])+
    fsel("giro","Giro",p?.giro||giros[0],giros)+
    fld("desarrollador","Desarrollador",p?.desarrollador||"")+
    fld("ubicacion","Ubicación",p?.ubicacion||"")+
    fld("lista","Lista de precios vigente",p?.lista||"","placeholder='Ej. Lista 6 · Sep–Dic 2026'")+
    fld("nota_lista","Nota adicional al pie del PDF",p?.nota_lista||"","placeholder='Opcional, ej. Entrega estimada diciembre 2027'",true)+
    `<div class="f full"><label for="fx-notas">Notas</label><textarea id="fx-notas" name="notas">${esc(p?.notas||"")}</textarea></div>`,
    d=>{if(p){Object.assign(p,d);db(()=>sb.from("proyectos").update(rowP(p)).eq("id",p.id))}else{const np={id:newId(),units:[],...d};S.projects.push(np);S.cat=np.cat;S.sel=np.id;db(()=>sb.from("proyectos").insert(rowP(np)))}},
    p?()=>{S.projects=S.projects.filter(x=>x!==p);db(()=>sb.from("proyectos").delete().eq("id",p.id))}:null);
}
function openUnit(u){
  const p=S.projects.find(p=>p.id===S.sel), renta=isRenta(p);
  drawer(u?"Editar unidad":"Nueva unidad · "+p.nombre,
    fsel("estatus","Estatus",u?.estatus||"Disponible",STATUSES)+
    fld("tipo","ID / prototipo",u?.tipo||"","required placeholder='101, C, PH1…'")+
    fld("torre","Torre / edificio",u?.torre||"")+
    fld("nivel","Nivel",u?.nivel??"","placeholder='PB, 1, 2… PH'")+
    fld("vista","Vista / orientación",u?.vista||"")+
    fld("recamaras","Recámaras",u?.recamaras??"","placeholder='1, 2, 1+ (flex)'")+
    fld("banos","Baños",u?.banos??"","type=number step=0.5 min=0")+
    fld("parking","Cajones",u?.parking??"","type=number step=1 min=0")+
    fld("m2int","m² interior",u?.m2int??"","type=number step=0.01 min=0")+
    fld("m2terr","m² terraza",u?.m2terr??"","type=number step=0.01 min=0")+
    fld("precio",renta?"Renta mensual (MXN)":"Precio de lista (MXN)",u?.precio??"","type=number step=1 min=0 required",true)+
    `<p class="hint">m² total se calcula como interior + terraza.</p>`,
    d=>{const v={estatus:d.estatus,tipo:d.tipo.trim(),torre:d.torre.trim(),nivel:String(d.nivel).trim()||null,vista:d.vista.trim(),parking:d.parking===""?null:+d.parking,recamaras:d.recamaras.trim()||null,banos:d.banos===""?null:+d.banos,
        m2int:+d.m2int||0,m2terr:+d.m2terr||0,precio:+d.precio||0};v.m2tot=+(v.m2int+v.m2terr).toFixed(2);
      if(u){Object.assign(u,v);db(()=>sb.from("unidades").update(rowU(u,p.id)).eq("id",u.id))}else{const nu={id:newId(),...v};p.units.push(nu);db(()=>sb.from("unidades").insert(rowU(nu,p.id)))}},
    u?()=>{p.units=p.units.filter(x=>x!==u);db(()=>sb.from("unidades").delete().eq("id",u.id))}:null);
}
if(READONLY){$("#subtitle").textContent="Inventario de proyectos TRUST · consulta";}
loadAll().then(()=>{restoreUI();render();});
if(sb){ setInterval(()=>{ if(!$("#drawer-root").innerHTML) loadAll().then(render); },60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&!$("#drawer-root").innerHTML) loadAll().then(render); }); }
</script>
