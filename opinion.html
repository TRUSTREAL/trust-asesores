<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Opinión de valor | TRUST</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --green:#173F35; --green-2:#1F5446; --bg:#FAF8F2; --surface:#FFFFFF; --surface-2:#EFEAE0; --line:#D9D2C3; --line-2:#BFB5A0;
  --text:#1E241F; --muted:#585C57; --faint:#8A8D88; --sage:#E9EEEA;
  --ok:#2E7D5B; --ok-bg:#E1F1E8; --warn:#8A5A12; --warn-bg:#FBF0D6; --bad:#A8342A; --bad-bg:#F8E1DE;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;margin:0}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.home-link:hover{color:var(--green);border-color:var(--green)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand .logo{width:118px;display:block;margin-bottom:12px;color:var(--green);line-height:0}.brand .logo svg{width:100%;height:auto;display:block}
.brand h1{font-size:30px;line-height:1.1}.brand p{margin:4px 0 0;color:var(--muted)}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.sm{padding:5px 11px;font-size:12px}.btn[disabled]{opacity:.4;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;color:var(--green);margin-bottom:4px}
.card h3{font-family:Poppins,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px}
.card>p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.steps button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.steps button i{font-style:normal;font-weight:600;margin-right:5px}
.steps button.on{background:var(--green);border-color:var(--green);color:#fff}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-content:start}
.f{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
.f label,.f .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--bg);width:100%;min-height:40px}
.f textarea{resize:vertical}.f small{font-size:11px;color:var(--muted)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.req{color:var(--bad)}.tag{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.04em;background:var(--sage);color:var(--green);border-radius:6px;padding:1px 6px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.out{background:var(--sage);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--green)}.out b{font-weight:600}
.mapbox{height:260px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--sage);z-index:0}
.comp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--surface);box-shadow:var(--shadow)}
.comp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.comp-h strong{color:var(--green)}
.numc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:600;margin-right:8px}
.calcline{margin-top:12px;font-variant-numeric:tabular-nums}.calcline .big{font-weight:600;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}.pill.c{background:var(--ok-bg);color:var(--ok)}.pill.o{background:var(--sage);color:var(--green)}
.hero{background:var(--green);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
.hero small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .v{font-family:Lora,serif;font-size:38px;font-weight:500;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .m{font-size:13px;opacity:.85}
.range{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.range div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px}.range div.mid{background:#fff;color:var(--green)}
.range span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}.range b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}.alerts li{border-radius:10px;padding:8px 12px;font-size:13px}
.alerts .w{background:var(--warn-bg);color:var(--warn)}.alerts .e{background:var(--bad-bg);color:var(--bad)}.alerts .k{background:var(--ok-bg);color:var(--ok)}.alerts .i{background:var(--sage);color:var(--green)}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:#EFEAE0;color:#4F534E;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}td.r,th.r{text-align:right}td a{color:var(--green);font-weight:500}
.note{font-size:12px;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.nav div{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.scrim{position:fixed;inset:0;background:rgba(23,63,53,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.drawer .body{padding:16px 22px;overflow:auto;flex:1}
.ico{border:0;background:transparent;color:var(--faint);font-size:15px;padding:2px 6px;border-radius:6px}
.esc{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.esc b{display:block;font-weight:600}.esc small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line-2);border-radius:14px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--bad)}
.ovpin{display:grid;place-items:center;border-radius:50%;font:600 11px Poppins,sans-serif;box-sizing:border-box}
.ovpin.s{background:#173F35;border:3px solid #fff;box-shadow:0 0 0 6px #BFD0C5}.ovpin.s:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.ovpin.c{background:#fff;border:2px solid #173F35;color:#173F35}
@media (max-width:760px){.range b{font-size:12.5px}.range div{padding:9px 7px}.c8,.c6{grid-column:span 12}.c4,.c3{grid-column:span 6}.brand h1{font-size:24px}.hero .v{font-size:30px}}
</style>
<style id="pdfcss">
/* PDF: mismo sistema de documentos que la cotización del portal (.nf-*): verde TRUST, fondo verde pálido, Lora + Poppins, sin dorado */
.sheet{margin:0 auto 16px;overflow:hidden;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.pg{--p:#173F35;--prgb:23,63,53;--f:#EEF2EC;--a:#5E7A70;--ink2:rgba(45,34,28,.86);--mut:rgba(60,46,38,.62);
  width:816px;height:1056px;transform-origin:0 0;position:relative;overflow:hidden;background:var(--f);color:var(--p);font-family:Poppins,'Segoe UI',sans-serif;font-size:10px;line-height:1.4;-webkit-font-smoothing:antialiased}
.pg i{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400}

.nf-pill{display:inline-block;background:#fff;color:var(--p);border-radius:999px;padding:5px 13px;font-size:8px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.nf-k{font-size:7.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.nf-foot{position:absolute;left:56px;right:56px;bottom:26px;text-align:center;font-size:7px;color:var(--mut);letter-spacing:.01em}

.nf-cta b{font-family:Lora,Georgia,serif;font-weight:500;font-size:17px;margin-left:6px}
/* hoja 1 */
.p1 .nf-top{position:absolute;left:0;right:0;top:0;height:700px;background:var(--p)}
.p1 .nf-img{position:absolute;left:0;right:0;top:0;height:560px;background-size:cover;background-position:center}
.p1 .nf-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--prgb),.30) 0%,rgba(var(--prgb),.10) 22%,rgba(var(--prgb),.55) 46%,rgba(var(--prgb),.94) 66%,var(--p) 80%)}
.p1 .nf-body{position:relative;z-index:2;padding:0 56px;color:#fff}
.p1 .nf-hero{margin-top:198px;height:150px}
.p1 h1{font-family:Lora,Georgia,serif;font-weight:400;font-size:39px;line-height:1.12;margin:12px 0 8px;letter-spacing:-.005em;color:#fff}
.nf-sub{font-size:12px}
.nf-price{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;margin-top:50px;height:112px}
.nf-big{font-family:Lora,Georgia,serif;font-size:50px;line-height:1.08;letter-spacing:-.01em;margin-top:4px}
.nf-big-s{font-size:8.5px;color:rgba(255,255,255,.88);margin-top:4px;max-width:360px}
.nf-desc{width:298px;flex:none;margin-top:4px}
.nf-desc .nf-k{margin-bottom:7px}
.nf-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4.5px 0;border-bottom:1px solid rgba(255,255,255,.22);font-size:9.5px}
.nf-r:last-child{border-bottom:0}
.nf-r b{font-family:Lora,Georgia,serif;font-weight:400;font-size:13.5px;white-space:nowrap}
.nf-card{position:relative;z-index:2;margin:32px 56px 0;background:#fff;border-radius:18px;box-shadow:0 22px 44px -26px rgba(40,20,10,.5);padding:8px 8px 0;color:var(--p)}
.nf-steps{display:flex}
.nf-step{flex:1;padding:20px 18px;min-width:0}
.nf-step.on{background:var(--p);color:#fff;border-radius:12px}
.nf-step .nf-v{font-family:Lora,Georgia,serif;font-size:28px;line-height:1.2;margin-top:3px;white-space:nowrap}
.nf-step .nf-d{font-size:8.5px;color:var(--mut);margin-top:10px}
.nf-step.on .nf-d{color:rgba(255,255,255,.9)}
.nf-unit{display:flex;padding:16px 12px 18px;border-top:1px solid rgba(var(--prgb),.12);margin-top:8px}
.nf-unit>div{flex:1;padding:0 12px;border-left:1px solid rgba(var(--prgb),.16);min-width:0}
.nf-unit .nf-k{font-size:6.8px;color:var(--mut)}
.nf-unit .nf-v{font-family:Lora,Georgia,serif;font-size:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1 .nf-cta{position:absolute;left:0;right:0;bottom:74px;z-index:2}
.p1 .nf-nota{position:absolute;left:56px;right:56px;bottom:136px;text-align:center;font-size:9px;color:var(--mut)}
/* hojas 2 a 4 */
.nf-band{position:relative;height:240px;background:var(--p);color:#fff;overflow:hidden}
.nf-tt{position:relative;z-index:2;padding:16px 56px 0}
.nf-band h2{font-family:Lora,Georgia,serif;font-weight:400;font-size:31px;line-height:1.15;margin:8px 0 4px;color:#fff}
.nf-band .nf-sub{font-size:10px}
.nf-sum{position:relative;z-index:2;margin:-38px 56px 0;background:#fff;border-radius:16px;display:flex;overflow:hidden;box-shadow:0 18px 36px -24px rgba(40,20,10,.5)}
.nf-sum>div{flex:1;padding:15px 16px;border-left:1px solid rgba(var(--prgb),.14);min-width:0}
.nf-sum>div:first-child{border-left:0}
.nf-sum>div.t{background:var(--p);color:#fff;border-left:0}
.nf-sum .nf-k{font-size:7px}
.nf-sum .nf-v{font-family:Lora,Georgia,serif;font-weight:600;font-size:22px;line-height:1.25;margin-top:3px;white-space:nowrap}
.nf-sum .nf-d{font-size:7.8px;color:var(--mut);margin-top:6px}
.nf-sum>div.t .nf-d{color:rgba(255,255,255,.9)}
.nf-main{padding:8px 56px 0}
.nf-eb{font-size:7.2px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.nf-eb:after{content:'';flex:1;height:1px;background:rgba(var(--prgb),.25)}
.nf-tr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:23px;padding:3px 8px;font-size:9.5px;border-bottom:1px solid rgba(var(--prgb),.10);color:var(--ink2)}

.nf-tr b{font-weight:600;color:var(--p)}
.nf-tr .r{text-align:right}

.nf-tr.c{grid-template-columns:16px 1fr 1.15fr 1.15fr .85fr .45fr 1.05fr .85fr .6fr 1fr}
.nf-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.nf-wc{background:#fff;border-radius:16px;padding:15px 18px;color:var(--ink2)}
.nf-wc .nf-k{color:var(--p);margin-bottom:6px}
.nf-wc .nf-v{font-family:Lora,Georgia,serif;font-size:21px;font-weight:600;color:var(--p)}
.nf-wc ol{margin:0;padding-left:16px}.nf-wc li{margin-bottom:3px}
.nf-map{border-radius:16px;background:rgba(var(--prgb),.10);display:grid;place-items:center;text-align:center;color:var(--mut);font-size:9px;padding:10px}
.nf-map.m{padding:0;overflow:hidden;display:block;background-size:cover;background-position:center;min-height:240px}
.nf-quote{font-family:Lora,Georgia,serif;font-size:14.5px;line-height:1.5;margin:26px 0 0}
.nf-sig{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px}
.nf-sig .nf-as-f{border-color:var(--p);background-color:#fff}
.nf-sig .nf-as-s{color:var(--mut)}
</style>

/* Mapa estático para el PDF: se arma una imagen con las teselas de OpenStreetMap y los pines dibujados encima.
   Va como imagen (sin scripts ni transparencias) para que imprima igual en cualquier visor. */
const MAPC={};
function mapaImg(w,h,pts,sujeto){
  if(!pts.length)return Promise.resolve(null);
  const key=JSON.stringify([w,h,pts,sujeto]);if(MAPC[key])return Promise.resolve(MAPC[key]);
  const W=w*2,H=h*2,pad=70,px=(la,ln,z)=>{const sc=256*Math.pow(2,z),sn=Math.sin(la*Math.PI/180);return[(ln+180)/360*sc,(.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*sc]};
  let z=17;for(;z>3;z--){const q=pts.map(p=>px(p[0],p[1],z)),xs=q.map(a=>a[0]),ys=q.map(a=>a[1]);if(Math.max(...xs)-Math.min(...xs)<=W-2*pad&&Math.max(...ys)-Math.min(...ys)<=H-2*pad)break}
  const q=pts.map(p=>px(p[0],p[1],z)),xs=q.map(a=>a[0]),ys=q.map(a=>a[1]),left=Math.round((Math.max(...xs)+Math.min(...xs))/2-W/2),top=Math.round((Math.max(...ys)+Math.min(...ys))/2-H/2);
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#DCE5DE";x.fillRect(0,0,W,H);
  const jobs=[],max=Math.pow(2,z);let ok=0;
  for(let tx=Math.floor(left/256);tx<=Math.floor((left+W)/256);tx++)for(let ty=Math.floor(top/256);ty<=Math.floor((top+H)/256);ty++){if(ty<0||ty>=max)continue;
    jobs.push(new Promise(r=>{const im=new Image();im.crossOrigin="anonymous";const t=setTimeout(r,6000);im.onload=()=>{clearTimeout(t);x.drawImage(im,tx*256-left,ty*256-top);ok++;r()};im.onerror=()=>{clearTimeout(t);r()};
      im.src="https://"+"abc"[(tx+ty)%3]+".tile.openstreetmap.org/"+z+"/"+((tx%max+max)%max)+"/"+ty+".png"}))}
  return Promise.all(jobs).then(()=>{if(!ok)return null;
    x.fillStyle="rgba(23,63,53,.06)";x.fillRect(0,0,W,H);x.textAlign="center";x.textBaseline="middle";
    pts.forEach((p,i)=>{const[a,b]=px(p[0],p[1],z),cx=a-left,cy=b-top;
      if(sujeto&&i===0){x.beginPath();x.arc(cx,cy,34,0,7);x.fillStyle="rgba(23,63,53,.22)";x.fill();x.beginPath();x.arc(cx,cy,20,0,7);x.fillStyle="#173F35";x.fill();x.lineWidth=6;x.strokeStyle="#fff";x.stroke();x.beginPath();x.arc(cx,cy,6,0,7);x.fillStyle="#fff";x.fill()}
      else{x.beginPath();x.arc(cx,cy,19,0,7);x.fillStyle="#fff";x.fill();x.lineWidth=4;x.strokeStyle="#173F35";x.stroke();x.fillStyle="#173F35";x.font="600 20px Poppins,Arial,sans-serif";x.fillText(String(p[2]),cx,cy+1)}});
    x.font="14px Poppins,Arial,sans-serif";x.textAlign="right";const t="© OpenStreetMap";x.fillStyle="rgba(255,255,255,.8)";x.fillRect(W-x.measureText(t).width-16,H-26,x.measureText(t).width+16,26);x.fillStyle="#3C4A44";x.fillText(t,W-8,H-12);
    try{return MAPC[key]=c.toDataURL("image/jpeg",.86)}catch(e){return null}});
}
let MAPAS={s:null,all:null};
async function prepararMapas(C){const M=datosMapa(C);const s=M.s?[M.s]:[];
  const r=await Promise.all([M.s?mapaImg(340,300,s,true):null,M.c.length?mapaImg(704,170,s.concat(M.c),!!M.s):null]);MAPAS={s:r[0],all:r[1]}}

function leerImagen(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};im.src=r.result};r.readAsDataURL(file)})}

/* Foto + degradado se funden en una sola imagen sin transparencias: los degradados semitransparentes salen rosas o negros en varios visores de PDF (iPhone, Vista Previa). */
function bake(){
  const src=FOTO_DATA||(S.foto?pubUrl(S.foto):"");if(!src)return Promise.resolve(BAKED=null);if(BAKED&&BAKED.src===src)return Promise.resolve(BAKED);
  return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";
    im.onload=()=>{try{const W=1632,H=1400,ih=1120,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
      x.fillStyle="#173F35";x.fillRect(0,0,W,H);const k=Math.max(W/im.width,ih/im.height),w=im.width*k,h=im.height*k;
      x.save();x.beginPath();x.rect(0,0,W,ih);x.clip();x.drawImage(im,(W-w)/2,(ih-h)/2,w,h);x.restore();
      const g=x.createLinearGradient(0,0,0,H);[[0,.30],[.22,.10],[.46,.55],[.66,.94],[.80,1],[1,1]].forEach(([q,a])=>g.addColorStop(q,"rgba(23,63,53,"+a+")"));
      x.fillStyle=g;x.fillRect(0,0,W,H);BAKED={src,data:c.toDataURL("image/jpeg",.84)}}catch(e){BAKED=null}res(BAKED)};
    im.onerror=()=>res(BAKED=null);im.src=src});
}

      +(esp&&C.eq?'<li class="i"><span class="tag" style="margin:0 6px 0 0">Interno</span>El propietario espera '+mx(esp)+": "+pct(dif)+" contra el equilibrado.</li>":"")+"</ul></section>"
      +'<section class="card"><h2>Comparables</h2><div class="twrap"><table><thead><tr><th>#</th><th>Tipo de precio</th><th>Zona</th><th>Fuente</th><th class="r">m²</th><th class="r">Precio</th><th class="r">$/m²</th><th class="r">Ajuste</th><th class="r">Homologado</th></tr></thead><tbody>'
      +S.comps.map((c,i)=>{const r=C.R[i];return r.ok?"<tr><td>"+(i+1)+"</td><td>"+esc(c.dato)+"</td><td>"+esc(c.zona)+"</td><td>"+(/^https?:\/\//.test(c.liga||"")?'<a href="'+esc(c.liga)+'" target="_blank" rel="noopener">'+esc(c.fuente)+"</a>":esc(c.fuente))+'</td><td class="r">'+n(c.m2)+'</td><td class="r">'+mx(c.precio)+'</td><td class="r">'+mx(r.pm)+'</td><td class="r">'+pct(((1-r.neg/100)*(1+r.ajT/100)-1)*100)+'</td><td class="r"><b>'+mx(r.hom)+"</b></td></tr>":""}).join("")
      +'</tbody></table></div><p class="note" style="margin:10px 0 0">Bien comprado = equilibrado −'+S.rules.bajo+"%. Bien vendido = equilibrado +"+S.rules.alto+"%.</p></section>";
    const rt=n(d.renta),o=$("#rend");if(o)o.textContent=rt&&C.eq?(rt*12/C.eq*100).toFixed(1)+"% sobre el valor equilibrado":"Captura la renta para verlo";}
  if(s===5)vistaPdf(C);
}

/* ---------- navegación y eventos ---------- */
function go(i){
  const antes=S.step;S.step=Math.max(0,Math.min(STEPS.length-1,i));
  if(DIRTY&&antes!==S.step)guardar(true);
  $("#sub").textContent=(asesorDoc()?asesorDoc()+" · ":"")+(DOC_ID?(S.d.solicitante||"Sin cliente"):"Nueva opinión de valor");
  $("#steps").innerHTML=STEPS.map((t,j)=>'<button type="button" data-go="'+j+'" class="'+(j===S.step?"on":"")+'"'+(j===S.step?' aria-current="step"':"")+">"+(j<5?"<i>"+(j+1)+"</i>":"")+t+"</button>").join("");
  $("#main").innerHTML=V[S.step]();
  $("#prev").disabled=S.step===0;$("#next").textContent=S.step===4?"Ver cómo queda":"Siguiente";$("#next").style.visibility=S.step===5?"hidden":"visible";
  if(S.step===1)mapaSujeto();if(S.step===3)mapaComps();
  refresh();const b=$("#steps .on");if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
}
function sugerir(){
  const d=S.d,P=[],Ng=[];
  if(d.entorno.includes("Avenida principal"))P.push("Buena ubicación sobre avenida principal");
  if(d.entorno.includes("Comercios caminables"))P.push("Comercios y servicios en distancias caminables");
  if(d.entorno.includes("Zona en desarrollo"))P.push("Zona con potencial de plusvalía");
  if(d.entorno.includes("Parques"))P.push("Parques y áreas verdes cercanas");
  if(d.entorno.includes("Escuelas"))P.push("Escuelas cercanas");
  if(["Nuevo","Excelente"].includes(d.conserv))P.push("Estado de conservación "+d.conserv.toLowerCase());
  if(d.amen.includes("Seguridad 24/7"))P.push("Seguridad 24/7");
  if(d.cajonTipo==="Compartido")Ng.push("Estacionamiento compartido con vecinos");
  if(d.cajones!==""&&n(d.cajones)===0)Ng.push("No cuenta con estacionamiento");
  if(!d.amen.includes("Seguridad 24/7"))Ng.push("No cuenta con seguridad 24/7");
  if(d.tipo==="Departamento"&&!d.amen.filter(x=>x!=="Elevador"&&x!=="Seguridad 24/7").length)Ng.push("No cuenta con amenidades");
  if(n(d.recs)===1)Ng.push("Cuenta con una sola recámara");
  if(d.tipo==="Departamento"&&n(d.nivel)>1&&!d.amen.includes("Elevador"))Ng.push("No cuenta con elevador");
  if(d.conserv==="A remodelar")Ng.push("Requiere remodelación");
  const merge=(k,arr)=>{const cur=lines(d[k]);arr.forEach(x=>{if(!cur.some(c=>c.toLowerCase().slice(0,18)===x.toLowerCase().slice(0,18)))cur.push(x)});d[k]=cur.join("\n")};
  merge("pos",P);merge("neg",Ng);DIRTY=true;go(2);
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){const k=t.dataset.k;S.d[k]=MONEY.includes(k)?(t.value.trim()===""?"":n(t.value)):t.value}
  else if(t.dataset.ck){const k=t.dataset.ck;S.comps[+t.dataset.c][k]=k==="precio"?(t.value.trim()===""?"":n(t.value)):t.value}
  else if(t.dataset.aj)S.comps[+t.dataset.c].aj[t.dataset.aj]=+t.value;
  else return;
  DIRTY=true;refresh();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="foto"&&t.files[0]){ponerFoto(t.files[0]);return}
  if(t.dataset.k&&MONEY.includes(t.dataset.k)&&S.d[t.dataset.k]!=="")t.value=mx(S.d[t.dataset.k]);
  if(t.dataset.ck==="precio"&&S.comps[+t.dataset.c].precio!=="")t.value=mx(S.comps[+t.dataset.c].precio);
  if(t.dataset.k==="tipo")go(1);
  if(t.dataset.ck==="zona")pickers();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.go){go(+t.dataset.go);return window.scrollTo(0,0)}
  if(t.id==="prev"){go(S.step-1);return window.scrollTo(0,0)}
  if(t.id==="next"){go(S.step+1);return window.scrollTo(0,0)}
  if(t.id==="btn-save")return guardar();
  if(t.id==="btn-pdf")return pdf();
  if(t.id==="btn-list")return abrirLista();
  if(t.dataset.pick){PICK=PICK===+t.dataset.pick?-1:+t.dataset.pick;return pickers()}
  if(t.dataset.chip){const a=S.d[t.dataset.chip],v=t.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);t.classList.toggle("on");t.setAttribute("aria-pressed",i<0);DIRTY=true;return refresh()}
  const a=t.dataset.act;
  if(a==="add"){S.comps.push(compNuevo());DIRTY=true;go(3)}
  if(a==="del"){if(S.comps.length<=1){toast("Deja al menos un comparable",true);return}S.comps.splice(+t.dataset.i,1);PICK=-1;DIRTY=true;go(3)}
  if(a==="banco")abrirBanco();
  if(a==="geo")geocodificar();
  if(a==="sugerir")sugerir();
  if(a==="ver"){go(5);window.scrollTo(0,0)}
  if(a==="pdf")pdf();
});
window.addEventListener("beforeunload",e=>{if(DIRTY&&(S.d.solicitante||S.d.calle)){e.preventDefault();e.returnValue=""}});

go(0);
(async()=>{const u=new URLSearchParams(location.search),id=u.get("doc");if(!id||!sb)return;
  const r=await sb.from("documentos").select("*").eq("id",id).maybeSingle();if(!r.data){toast("No encontré esa opinión",true);return}
  cargar(r.data);history.replaceState(null,"",location.pathname);go(u.get("pdf")?5:0);if(u.get("pdf"))setTimeout(()=>pdf(true),500)})();
</script>
