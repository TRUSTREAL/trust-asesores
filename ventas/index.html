<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F2">
<title>Ventas | TRUST · Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{
  --green:#173F35; --green-2:#1F5446; --gold:#B8956A; --gold-2:#9C7A4E;
  --bg:#FAF8F2; --surface:#FFFFFF; --surface-2:#EFEAE0; --line:#D9D2C3; --line-2:#BFB5A0;
  --text:#1E241F; --muted:#585C57; --faint:#8A8D88;
  --ok:#2E7D5B; --ok-bg:#E1F1E8; --warn:#B27A0F; --warn-bg:#FBF0D6; --bad:#A8342A; --bad-bg:#F8E1DE; --info:#2F5597; --info-bg:#E7ECF6;
  --shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.home-link:hover{color:var(--green);border-color:var(--green)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand .logo{height:30px;display:block;margin-bottom:12px}
.brand h1{font-size:30px;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--muted)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:12px}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line-2);border-radius:16px}
.empty b{display:block;font-family:Lora,serif;font-size:17px;color:var(--text);margin-bottom:4px;font-weight:500}
.vseg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.vseg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:500;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--green);color:#fff}
.pane{display:none}.pane.on{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px}
.filters input[type=text]{min-width:220px}
.qseg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}
.qseg button{border:0;background:transparent;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.qseg button+button{border-left:1px solid var(--line-2)}
.qseg button.on{background:var(--green);color:#fff}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px}
.tile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{display:block;font-family:Lora,serif;font-size:26px;color:var(--green);line-height:1.15}
.tile .s{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--green);border-color:var(--green)}.tile.dark .l,.tile.dark .s{color:#D9C9A8}.tile.dark .v{color:#fff}
.tile.gold .v{color:var(--gold-2)}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#EFEAE0;color:#4F534E;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}th.sortable.on{color:var(--green)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#FBFAF6}
tbody tr:hover td{background:#F4F1E9}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.dim{color:var(--muted)}
td.money{font-weight:600}
td.com{color:var(--gold-2);font-weight:600}
.st{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.st.pendiente{background:var(--bad-bg);color:var(--bad)}
.st.parcial{background:var(--warn-bg);color:var(--warn)}
.st.pagada{background:var(--ok-bg);color:var(--ok)}
.un{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.un.Proyectos{background:var(--ok-bg);color:var(--ok)}.un.Corretaje{background:var(--info-bg);color:var(--info)}
.ico{border:0;background:transparent;color:var(--faint);font-size:15px;padding:2px 6px;border-radius:6px}.ico:hover{color:var(--green);background:var(--surface-2)}
.bars .bar{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bars .trk{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bars .fil{height:100%;background:var(--green);border-radius:4px}
.bars .fil.g{background:var(--gold)}
.bars .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.cols{display:flex;align-items:flex-end;gap:6px;justify-content:space-evenly;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0;max-width:200px}
.cols .c i{width:100%;max-width:70px;background:var(--green);border-radius:6px 6px 0 0;display:block;min-height:2px}
.cols .c i.p{background:var(--gold);opacity:.85}
.cols .c b{font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.cols .c small{font-size:10px;color:var(--text);font-weight:600;white-space:nowrap}
.cols .c.acum{border-left:1px dashed var(--line-2);padding-left:14px;margin-left:8px;max-width:240px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green);vertical-align:-1px;margin-right:4px}
.legend i.p{background:var(--gold)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(14,42,35,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.drawer header h3{font-size:20px;color:var(--green)}
.drawer .body{padding:16px 22px;overflow:auto;flex:1}
.drawer footer{display:flex;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.f .ro{background:var(--surface-2);color:var(--muted)}
.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.sect{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.sect h4{font-family:Lora,serif;font-weight:500;font-size:16px;margin:0 0 10px;color:var(--green)}
.disp{width:100%;border-collapse:collapse;font-size:13px}
.disp th{position:static;padding:6px 8px}
.disp td{padding:6px 8px;border-bottom:1px solid var(--line)}
.disp input{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;width:100%;background:var(--bg);text-align:right}
.disp input.name{text-align:left}
.disp .tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.disp tr.trust td{font-weight:600;background:#FBFAF6}
.disp .edited{color:var(--warn);font-size:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding-top:26px}
.hint{font-size:12px;color:var(--muted)}
.cobros .row{display:grid;grid-template-columns:130px 1fr 150px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.segc{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.segc button{border:0;background:var(--bg);padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.segc button+button{border-left:1px solid var(--line-2)}
.segc button.on.pendiente{background:#FBEDEA;color:var(--bad)}.segc button.on.parcial{background:#FBF3E0;color:var(--gold-2)}.segc button.on.pagada{background:#E6F2EC;color:var(--ok)}
tr.dimrow td{opacity:.55}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--bad)}
.rules .r{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rules .r input{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;text-align:right;background:var(--bg)}
.rules .r.staff{grid-template-columns:1fr 120px 36px}
.rules .r.staff input.name{text-align:left}
.paid{color:var(--ok);font-weight:600}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.c6,.c4,.c3{grid-column:span 12}.cobros .row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" id="logo-img" alt="TRUST realtor"><h1>Ventas</h1><p>Registro de ventas, cobranza y comisiones</p></div>
    <div class="topright"><a class="home-link" href="../admin/">← Inicio</a><button class="btn primary" id="btn-new">+ Registrar venta</button></div>
  </header>
  <div class="vseg" role="tablist">
    <button data-pane="ventas" aria-pressed="true">Ventas</button>
    <button data-pane="cobranza" aria-pressed="false">Cobranza</button>
    <button data-pane="comisiones" aria-pressed="false">Comisiones</button>
    <button data-pane="empresa" aria-pressed="false">Empresa</button>
    <button data-pane="asesores" aria-pressed="false">Asesores</button>
    <button data-pane="reglas" aria-pressed="false">Reglas</button>
  </div>
  <div class="filters" id="period-bar">
    <select id="p-anio"></select>
    <select id="p-mes"><option value="">Todo el año</option></select>
    <div class="qseg" id="p-trim"><button data-q="">Todo el año</button><button data-q="1">Q1</button><button data-q="2">Q2</button><button data-q="3">Q3</button><button data-q="4">Q4</button></div>
    <span class="hint" id="period-txt"></span>
  </div>
  <section class="pane on" id="pane-ventas"></section>
  <section class="pane" id="pane-cobranza"></section>
  <section class="pane" id="pane-comisiones"></section>
  <section class="pane" id="pane-empresa"></section>
  <section class="pane" id="pane-asesores"></section>
  <section class="pane" id="pane-reglas"></section>
</div>
<div id="drawer-root"></div>
<div class="toast" id="toast"></div>

const MESES_L=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const objQ=i=>+((REGLAS.objetivos||REGLAS_DEF.objetivos)[i])||0;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
$("#logo-img").src="data:image/png;base64,"+LOGO_B64;
let tt; function toast(m,err){const t=$("#toast");t.textContent=m;t.classList.toggle("err",!!err);t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),err?3600:2200);}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=v=>v==null||v===""||isNaN(v)?"—":"$ "+Math.round(+v).toLocaleString("es-MX");
const fmtK=v=>Math.abs(v)>=1e6?"$ "+(v/1e6).toFixed(2).replace(/\.?0+$/,"")+" M":fmt(v);
const num=s=>{const x=parseFloat(String(s??"").replace(/[^0-9.\-]/g,""));return isNaN(x)?null:x};
const pct=(n,d)=>d?Math.round(n/d*100)+"%":"—";
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fecha=d=>d?(()=>{const [y,m,dd]=String(d).slice(0,10).split("-");return `${+dd} ${MESES[+m-1]} ${y.slice(2)}`})():"—";
const fechaM=d=>d?(()=>{const [y,m]=String(d).slice(0,7).split("-");return `${MESES_L[+m-1]} ${y}`})():"—";
const uid=()=>"p"+Math.random().toString(36).slice(2,9);

let VENTAS=[], PAGOS=[], REGLAS={...REGLAS_DEF}, PANE="ventas";
let P={anio:new Date().getFullYear(),mes:"",trims:[]}; // periodo: Ventas y Empresa por trimestre; el resto por mes
const useQ=()=>PANE==="empresa"||PANE==="asesores";
let filt={q:"",un:"",asesor:"",estatus:""}, sort={k:"fecha",dir:"desc"};

/* ---------- carga ---------- */
async function loadAll(){
  if(!sb){toast("Sin conexión a Supabase",true);return}
  const [v,p,r]=await Promise.all([sb.from("ventas").select("*").order("fecha",{ascending:false}),sb.from("ventas_pagos").select("*").order("fecha"),sb.from("ventas_reglas").select("*").eq("id",1).maybeSingle()]);
  if(v.error){toast("Error: "+v.error.message,true);return}
  VENTAS=v.data||[];PAGOS=p.data||[];
  if(r.data&&r.data.reglas)REGLAS={...REGLAS_DEF,...r.data.reglas};
  render();
}
const comTotal=v=>v.comision_monto!=null?+v.comision_monto:(+v.monto||0)*(+v.comision_pct||0)/100;
// Cobranza: estatus manual por venta (independiente del pago a asesores)
const estatusDe=v=>v.cobro_estatus||"pendiente";
const EST_LABEL={pendiente:"Pendiente",parcial:"Pago parcial",pagada:"Pagada"};
// Pagos a beneficiarios por venta
const pagadoDe=(n,vid)=>PAGOS.filter(p=>p.beneficiario===n&&p.venta_id===vid).reduce((a,p)=>a+(+p.monto||0),0);

/* ---------- dispersión ---------- */
function dispDefault(v){
  const R=REGLAS,d=[];
  if(esCredito(v)) return [{id:uid(),nombre:v.asesor||"",rol:"Crédito hipotecario",pct:100,monto:null}];
  if(v.un==="Proyectos"){d.push({id:uid(),nombre:v.asesor||"",rol:"Vendedor",pct:R.proy_vendedor});if(v.opcionador)d.push({id:uid(),nombre:v.opcionador,rol:"Opcionador",pct:R.proy_opcionador})}
  else if(v.propiedad_trust!==false){d.push({id:uid(),nombre:v.opcionador||"",rol:"Opcionador",pct:R.corr_trust_opcionador});d.push({id:uid(),nombre:v.asesor||"",rol:"Vendedor",pct:R.corr_trust_vendedor})}
  else d.push({id:uid(),nombre:v.asesor||"",rol:"Vendedor",pct:R.corr_otra_vendedor});
  if(v.autogenerada)d.push({id:uid(),nombre:v.asesor||"",rol:"Autogenerada",pct:R.autogenerada});
  (R.staff||[]).forEach(s=>{if(s.nombre&&+s.pct)d.push({id:uid(),nombre:s.nombre,rol:"Staff",pct:+s.pct})});
  return d.map(x=>({...x,monto:null}));  // monto null = se calcula por %
}
function partAmt(p,base){return p.monto!=null&&p.monto!==""?+p.monto:base*(+p.pct||0)/100}
function partPct(p,base){return p.monto!=null&&p.monto!==""?(base?+p.monto/base*100:0):(+p.pct||0)}

/* ---------- periodo ---------- */
function inPeriodo(d){if(!d)return false;const [y,m]=String(d).slice(0,7).split("-");if(+y!==+P.anio)return false;return useQ()?(!P.trims.length||P.trims.includes(Math.ceil(+m/3))):(!P.mes||+m===+P.mes)}
function periodoTxt(){return useQ()?(P.trims.length?P.trims.map(q=>"Q"+q).join("+")+` ${P.anio}`:`Año ${P.anio}`):(P.mes?`${MESES_L[+P.mes-1]} ${P.anio}`:`Año ${P.anio}`)}
function renderPeriodBar(){
  const years=[...new Set(VENTAS.map(v=>+String(v.fecha).slice(0,4)).concat(PAGOS.map(c=>+String(c.fecha).slice(0,4))).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
  $("#p-anio").innerHTML=years.map(y=>`<option ${y===+P.anio?"selected":""}>${y}</option>`).join("");
  const ms=$("#p-mes");if(ms.options.length===1)MESES_L.forEach((m,i)=>{const o=document.createElement("option");o.value=i+1;o.textContent=m;ms.appendChild(o)});ms.value=P.mes;
  ms.style.display=useQ()?"none":"";const ts=$("#p-trim");ts.style.display=useQ()?"":"none";ts.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.q?P.trims.includes(+b.dataset.q):!P.trims.length));
  $("#period-txt").textContent=periodoTxt();
}
$("#p-anio").onchange=e=>{P.anio=+e.target.value;render()};$("#p-mes").onchange=e=>{P.mes=e.target.value;render()};$$("#p-trim button").forEach(b=>b.onclick=()=>{const q=+b.dataset.q;if(!q)P.trims=[];else P.trims=P.trims.includes(q)?P.trims.filter(x=>x!==q):P.trims.concat([q]).sort();render()});

/* ---------- render ---------- */
function render(){renderPeriodBar();({ventas:renderVentas,cobranza:renderCobranza,comisiones:renderComisiones,empresa:renderEmpresa,asesores:renderAsesores,reglas:renderReglas})[PANE]();}
$$(".vseg button").forEach(b=>b.onclick=()=>{PANE=b.dataset.pane;$$(".vseg button").forEach(x=>x.setAttribute("aria-pressed",x===b));$$(".pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+PANE));$("#period-bar").style.display=PANE==="reglas"?"none":"";render()});

function renderVentas(){
  const el=$("#pane-ventas");
  let rows=VENTAS.filter(v=>inPeriodo(v.fecha)&&(!filt.un||v.un===filt.un)&&(!filt.asesor||v.asesor===filt.asesor||v.opcionador===filt.asesor)&&(!filt.estatus||estatusDe(v)===filt.estatus)&&(!filt.q||[v.cliente,v.proyecto,v.unidad,v.asesor,v.notas].join(" ").toLowerCase().includes(filt.q.toLowerCase())));
  const d=sort.dir==="asc"?1:-1;const val=v=>({fecha:v.fecha,cliente:v.cliente||"",proyecto:v.proyecto||"",asesor:v.asesor||"",monto:+v.monto||0,comision:comTotal(v),estatus:estatusDe(v)})[sort.k];
  rows=[...rows].sort((a,b)=>{const x=val(a),y=val(b);return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"es"))*d});
  const all=VENTAS.filter(v=>inPeriodo(v.fecha));
  const tot=all.reduce((a,v)=>a+comTotal(v),0),op=all.filter(v=>!esCredito(v)).reduce((a,v)=>a+(+v.monto||0),0);
  const cobradas=all.filter(v=>estatusDe(v)==="pagada"),porCob=all.filter(v=>estatusDe(v)!=="pagada");

    <div class="tile gold"><span class="l">Ingresos</span><span class="v">${fmtK(tot)}</span><span class="s">${op?(tot/op*100).toFixed(2)+"% promedio":""}</span></div>
    <div class="tile"><span class="l">Cobradas</span><span class="v">${cobradas.length}</span><span class="s">${fmtK(cobradas.reduce((a,v)=>a+comTotal(v),0))}</span></div>
    <div class="tile"><span class="l">Por cobrar</span><span class="v">${porCob.length}</span><span class="s">${fmtK(porCob.reduce((a,v)=>a+comTotal(v),0))}</span></div>
  </div>
  <div class="filters">
    <input type="text" id="f-q" placeholder="Buscar cliente, proyecto, unidad…" value="${esc(filt.q)}">
    <select id="f-un"><option value="">Unidad de negocio</option>${UN.map(u=>`<option ${filt.un===u?"selected":""}>${u}</option>`).join("")}</select>
    <select id="f-asesor"><option value="">Asesor</option>${ASESORES.map(a=>`<option ${filt.asesor===a?"selected":""}>${a}</option>`).join("")}</select>
    <select id="f-estatus"><option value="">Estatus de cobro</option>${Object.entries(EST_LABEL).map(([k,v])=>`<option value="${k}" ${filt.estatus===k?"selected":""}>${v}</option>`).join("")}</select>
    <span class="count">${rows.length} de ${all.length}</span>

/* ---------- empresa ---------- */
function monthly(fn){const arr=Array.from({length:12},()=>0);fn(arr);return arr}
function renderEmpresa(){
  const el=$("#pane-empresa");const Y=+P.anio;
  // Ingresos = comisión generada por venta (fecha de cierre), sin crédito hipotecario
  const VN=VENTAS.filter(v=>!esCredito(v));
  const yr=v=>+String(v.fecha).slice(0,4),mo=v=>+String(v.fecha).slice(5,7);
  const vY=VN.filter(v=>yr(v)===Y),vPrev=VN.filter(v=>yr(v)===Y-1);
  const qo=v=>Math.ceil(mo(v)/3)-1;const quarterly=fn=>{const a=[0,0,0,0];fn(a);return a};
  const byM=quarterly(a=>vY.forEach(v=>a[qo(v)]+=comTotal(v)));
  const byMprev=[0,1,2,3].map(objQ); // objetivo por trimestre
  const QL=["Q1","Q2","Q3","Q4"],QLL=["Q1 · Ene–Mar","Q2 · Abr–Jun","Q3 · Jul–Sep","Q4 · Oct–Dic"];
  // periodo
  const vP=VN.filter(v=>inPeriodo(v.fecha));const ingreso=vP.reduce((a,v)=>a+comTotal(v),0);
  const vVen=vP.filter(v=>v.tipo==="Venta"),vRen=vP.filter(v=>v.tipo==="Renta");
  const objetivo=P.trims.length?P.trims.reduce((a,q)=>a+objQ(q-1),0):byMprev.reduce((a,b)=>a+b,0);const falta=objetivo-ingreso;
  const byUN={},byProy={};vP.forEach(v=>{const t=comTotal(v);byUN[v.un]=(byUN[v.un]||0)+t;byProy[v.proyecto]=(byProy[v.proyecto]||0)+t});
  const max=Math.max(...byM,...byMprev,1);
  el.innerHTML=`
  <div class="tiles">
    <div class="tile dark"><span class="l">Ingresos</span><span class="v">${fmtK(ingreso)}</span><span class="s">${vP.length} venta${vP.length===1?"":"s"} · ${periodoTxt()}</span></div>
    <div class="tile"><span class="l">Objetivo</span><span class="v">${fmtK(objetivo)}</span><span class="s">${periodoTxt()}</span></div>
    <div class="tile"><span class="l">Avance vs objetivo</span><span class="v" style="color:${falta>0?"var(--bad)":"var(--ok)"}">${pct(ingreso,objetivo)}</span><span class="s">${falta>0?"faltan "+fmtK(falta):"objetivo superado por "+fmtK(-falta)}</span></div>
    <div class="tile"><span class="l">Venta promedio</span><span class="v">${vVen.length?fmtK(vVen.reduce((a,v)=>a+(+v.monto||0),0)/vVen.length):"—"}</span><span class="s">${vVen.length} venta${vVen.length===1?"":"s"}</span></div>
    <div class="tile"><span class="l">Renta promedio</span><span class="v">${vRen.length?fmtK(vRen.reduce((a,v)=>a+(+v.monto||0),0)/vRen.length):"—"}</span><span class="s">${vRen.length} renta${vRen.length===1?"":"s"}</span></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Ingresos vs objetivo por trimestre · ${Y}</h3>
    <div class="cols">${byM.map((v,i)=>{const ok=v+0.5>=byMprev[i];return `<div class="c" title="${QLL[i]}"><small>${fmtK(v).replace("$ ","")} <span class="dim">/ ${fmtK(byMprev[i]).replace("$ ","")}</span></small><div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:120px;justify-content:center"><i style="height:${v/max*100}%"></i><i class="p" style="height:${byMprev[i]/max*100}%"></i></div><b style="color:${ok?"var(--ok)":"var(--bad)"}">${QL[i]} · ${pct(v,byMprev[i])}</b></div>`}).join("")}${(()=>{const t=byM.reduce((a,b)=>a+b,0),o=byMprev.reduce((a,b)=>a+b,0),ok=t+0.5>=o;return `<div class="c acum"><small>${fmtK(t).replace("$ ","")} <span class="dim">/ ${fmtK(o).replace("$ ","")}</span></small><div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:120px;justify-content:center"><i style="height:${t/Math.max(t,o,1)*100}%"></i><i class="p" style="height:${o/Math.max(t,o,1)*100}%"></i></div><b style="color:${ok?"var(--ok)":"var(--bad)"}">Acumulado ${Y} · ${pct(t,o)}</b></div>`})()}</div>
    <div class="legend"><span><i></i>Ingresos ${Y}</span><span><i class="p"></i>Objetivo</span><span style="margin-left:auto">Ingresos ${Y}: <b>${fmtK(byM.reduce((a,b)=>a+b,0))}</b> de <b>${fmtK(byMprev.reduce((a,b)=>a+b,0))}</b></span></div></div>
  <div class="grid2">
    <div class="card"><h3>Por unidad de negocio</h3><div class="bars">${bars(byUN,ingreso)}</div></div>
    <div class="card"><h3>Por proyecto</h3><div class="bars">${bars(byProy,ingreso)}</div></div>
  </div>`;
}
function bars(obj,total,g){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!e.length)return `<p class="hint">Sin datos en el periodo.</p>`;const max=e[0][1]||1;return e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="trk"><div class="fil ${g?"g":""}" style="width:${v/max*100}%"></div></div><span class="val">${fmt(v)} <small style="color:var(--muted);font-weight:400">${pct(v,total)}</small></span></div>`).join("")}

/* ---------- asesores ---------- */
function renderAsesores(){
  const el=$("#pane-asesores");
  const vP=VENTAS.filter(v=>inPeriodo(v.fecha));
  const st={};const add=(n,k,v)=>{if(!n)return;st[n]=st[n]||{ventas:0,monto:0,com:0,gen_asesor:0,pagado:0};st[n][k]+=v};

/* ---------- comisiones (pago a beneficiarios) ---------- */
let verPagadas=false;
function lineasCom(){
  const out=[];
  VENTAS.forEach(v=>{const tot=comTotal(v);(v.dispersion||[]).forEach(p=>{if(!p.nombre)return;const mia=partAmt(p,tot);if(!mia)return;const k=p.nombre+"|"+v.id;let L=out.find(x=>x.k===k);if(!L){L={k,n:p.nombre,v,roles:[],mia:0,pag:pagadoDe(p.nombre,v.id)};out.push(L)}L.roles.push(p.rol);L.mia+=mia})});
  out.forEach(L=>{L.e=L.pag+0.5>=L.mia?"pagada":L.pag>0.5?"parcial":"pendiente"});
  return out;
}
function renderComisiones(){
  const el=$("#pane-comisiones");

  const genP=all.filter(L=>inPeriodo(L.v.fecha)).reduce((a,L)=>a+L.mia,0);

  el.innerHTML=`
  <div class="tiles">
    <div class="tile dark"><span class="l">Pendiente de pagar</span><span class="v">${fmtK(pendTot)}</span><span class="s">${personas.length} persona${personas.length===1?"":"s"} · ${abiertas.length} partida${abiertas.length===1?"":"s"}</span></div>
    <div class="tile gold"><span class="l">Comisiones generadas</span><span class="v">${fmtK(genP)}</span><span class="s">${periodoTxt()}</span></div>

  </div>

    <p class="hint" style="margin:6px 0 10px">Una línea por persona y venta. La comisión nace al registrar la venta; aquí marcas cuándo se le pagó. No depende de la cobranza.</p>

    <tbody>${rows.map(L=>{const first=L.n!==lastN;lastN=L.n;const pend=L.mia-L.pag;return `<tr class="${L.e==="pagada"?"dimrow":""}"><td>${first?`<b>${esc(L.n)}</b>`:""}</td><td>${esc(L.v.cliente)}<br><small class="dim">${esc(L.v.proyecto||"")}${L.v.unidad?" · "+esc(L.v.unidad):""} · ${fechaM(L.v.fecha)}</small></td><td class="dim">${esc(L.roles.join(" + "))}</td><td class="num com">${fmt(L.mia)}</td><td class="num ${L.pag?"paid":""}">${fmt(L.pag)}</td><td class="num money" style="color:${pend>0.5?"var(--bad)":"var(--ok)"}">${fmt(pend)}</td><td><span class="st ${L.e}">${EST_LABEL[L.e]}</span></td><td style="white-space:nowrap">${pend>0.5?`<button class="btn sm primary pay" data-k="${esc(L.k)}">Pagar</button>`:""}</td></tr>`}).join("")}</tbody></table>

function openPago(L){

      <div id="staff-rows">${(R.staff||[]).map((s,i)=>`<div class="r staff"><input class="name" data-si="${i}" data-f="nombre" value="${esc(s.nombre)}" placeholder="Nombre"><input data-si="${i}" data-f="pct" value="${s.pct}" inputmode="decimal"><button class="ico" data-del="${i}" title="Quitar">×</button></div>`).join("")}</div>
      <button class="btn sm" id="staff-add" style="margin-top:10px">+ Agregar persona</button>
      <p class="hint" style="margin-top:14px">Estos porcentajes se precargan en cada venta nueva. En cada venta puedes cambiarlos, ponerlos en monto fijo o quitar partidas sin afectar las reglas. Los cambios aquí no modifican ventas ya registradas.</p>
      <div style="margin-top:14px"><button class="btn primary" id="rules-save">Guardar reglas</button></div>
    </div></div>`;
  $("#staff-add").onclick=()=>{REGLAS.staff=(REGLAS.staff||[]).concat([{nombre:"",pct:0}]);renderReglas()};
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{REGLAS.staff.splice(+b.dataset.del,1);renderReglas()});
  $("#rules-save").onclick=async()=>{
    el.querySelectorAll("input[data-k]").forEach(i=>REGLAS[i.dataset.k]=num(i.value)||0);
    REGLAS.objetivos=[0,1,2,3].map(i=>num(el.querySelector(`input[data-obj="${i}"]`).value)||0);
    const staff=[];el.querySelectorAll("#staff-rows .r").forEach(row=>{const n=row.querySelector('[data-f=nombre]').value.trim(),p=num(row.querySelector('[data-f=pct]').value)||0;if(n)staff.push({nombre:n,pct:p})});REGLAS.staff=staff;
    const r=await sb.from("ventas_reglas").upsert({id:1,reglas:REGLAS,updated_at:new Date().toISOString()});if(r.error){toast("No se guardó: "+r.error.message,true);return}toast("Reglas guardadas");renderReglas();
  };
}

/* ---------- alta / edición de venta ---------- */
function openVenta(v){
  const isNew=!v;v=v?JSON.parse(JSON.stringify(v)):{fecha:todayISO(),un:"Proyectos",tipo:"Venta",proyecto:"",unidad:"",cliente:"",asesor:"",opcionador:"Álvaro",autogenerada:false,propiedad_trust:true,monto:null,comision_pct:null,comision_monto:null,notas:"",dispersion:null};
  const opt=(list,cur,blank)=>(blank?`<option value="">${blank}</option>`:"")+list.map(x=>`<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
  const root=$("#drawer-root");
  root.innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer" role="dialog">
    <header><h3>${isNew?"Registrar venta":"Venta · "+esc(v.cliente)}</h3><button class="ico" id="d-close">✕</button></header>
    <div class="body">
      <div class="fg">
        <div class="f c3"><label>Mes de la venta</label><input type="month" id="v-fecha" value="${String(v.fecha||"").slice(0,7)}"></div>
        <div class="f c3"><label>Unidad de negocio</label><select id="v-un">${opt(UN,v.un)}</select></div>
        <div class="f c3"><label>Tipo</label><select id="v-tipo">${opt(TIPO,v.tipo)}</select></div>
        <div class="f c3" id="v-prop-box" style="${v.un==="Corretaje"?"":"visibility:hidden"}"><label>Propiedad</label><select id="v-prop"><option value="true" ${v.propiedad_trust!==false?"selected":""}>De TRUST</option><option value="false" ${v.propiedad_trust===false?"selected":""}>Otra inmobiliaria</option></select></div>
        <div class="f c6"><label>Cliente</label><input id="v-cliente" value="${esc(v.cliente)}" placeholder="Nombre del comprador"></div>
        <div class="f c3"><label>Proyecto / propiedad</label><input id="v-proyecto" list="dl-proy" value="${esc(v.proyecto)}"><datalist id="dl-proy">${PROYECTOS.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
        <div class="f c3"><label>Unidad / ID</label><input id="v-unidad" value="${esc(v.unidad||"")}" placeholder="Depto 402, Casa 12…"></div>
        <div class="f c4"><label>Asesor vendedor</label><select id="v-asesor">${opt(ASESORES,v.asesor,"Elegir…")}</select></div>
        <div class="f c4"><label>Opcionador</label><select id="v-opc">${opt(ASESORES,v.opcionador,"— Sin opcionador —")}</select></div>
        <div class="f c4"><label class="chk" style="padding:0"><input type="checkbox" id="v-ag" ${v.autogenerada?"checked":""} style="width:auto"> Operación autogenerada (+${REGLAS.autogenerada}% vendedor)</label></div>
        <div class="f c4"><label id="lbl-monto">Monto de la operación</label><input id="v-monto" inputmode="numeric" value="${v.monto!=null?fmt(v.monto):""}" placeholder="$ 0"></div>
        <div class="f c4"><label>Comisión %</label><input id="v-pct" inputmode="decimal" value="${v.comision_pct??""}" placeholder="ej. 4"></div>
        <div class="f c4"><label>o comisión en monto fijo</label><input id="v-cmonto" inputmode="numeric" value="${v.comision_monto!=null?fmt(v.comision_monto):""}" placeholder="$ (opcional)"></div>
        <div class="f c12"><label>Comisión total</label><input class="ro" id="v-ctotal" disabled value=""></div>
        <div class="f c12"><label>Notas</label><textarea id="v-notas" rows="2">${esc(v.notas||"")}</textarea></div>
      </div>
      <div class="sect"><h4>Dispersión de la comisión</h4>
        <p class="hint" style="margin:0 0 8px">Precargada con las reglas. Edita % o pon un monto fijo por partida; el otro se calcula. Cada partida aparece en Comisiones como pendiente de pago.</p>
        <table class="disp"><thead><tr><th>Beneficiario</th><th>Rol</th><th class="num" style="width:90px">%</th><th class="num" style="width:130px">Monto</th><th></th></tr></thead><tbody id="disp-body"></tbody></table>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="btn sm" id="disp-add">+ Partida</button><button class="btn sm" id="disp-reset">Recalcular con reglas</button><span class="hint" id="disp-warn"></span></div>
      </div>
    </div>
    <footer><span>${isNew?"":`<button class="btn danger" id="d-del">Eliminar venta</button>`}</span><span style="display:flex;gap:8px"><button class="btn" id="d-cancel">Cancelar</button><button class="btn primary" id="d-save">${isNew?"Registrar":"Guardar"}</button></span></footer></div>`;
  const g=i=>$("#"+i);const close=()=>root.innerHTML="";
  g("scrim").onclick=close;g("d-close").onclick=close;g("d-cancel").onclick=close;
  let DISP=v.dispersion?v.dispersion.map(p=>({...p,id:p.id||uid()})):null;
  const cur=()=>({fecha:(g("v-fecha").value||todayISO().slice(0,7))+"-01",un:g("v-un").value,tipo:g("v-tipo").value,propiedad_trust:g("v-prop").value==="true",cliente:g("v-cliente").value.trim(),proyecto:g("v-proyecto").value.trim(),unidad:g("v-unidad").value.trim(),asesor:g("v-asesor").value,opcionador:g("v-opc").value||null,autogenerada:g("v-ag").checked,monto:num(g("v-monto").value),comision_pct:num(g("v-pct").value),comision_monto:num(g("v-cmonto").value),notas:g("v-notas").value.trim()});
  const total=()=>{const c=cur();return c.comision_monto!=null?c.comision_monto:(c.monto||0)*(c.comision_pct||0)/100};
  function drawDisp(){
    const tot=total();g("v-ctotal").value=fmt(tot)+(cur().comision_monto!=null?" (monto fijo)":"");
    if(!DISP)DISP=dispDefault(cur());
    const tb=g("disp-body");
    tb.innerHTML=DISP.map(p=>{const amt=partAmt(p,tot),pc=partPct(p,tot);return `<tr data-id="${p.id}"><td><input class="name" data-f="nombre" list="dl-ase" value="${esc(p.nombre)}"></td><td><input class="name" data-f="rol" value="${esc(p.rol)}"></td><td><input data-f="pct" value="${p.monto!=null&&p.monto!==""?pc.toFixed(2).replace(/\.?0+$/,""):(p.pct??"")}" ${p.monto!=null&&p.monto!==""?'style="color:var(--muted)"':""}></td><td><input data-f="monto" value="${amt?Math.round(amt).toLocaleString("es-MX"):""}" ${p.monto!=null&&p.monto!==""?'style="font-weight:600"':'style="color:var(--muted)"'}></td><td><button class="ico" data-del="${p.id}">×</button></td></tr>`}).join("")
      +`<tr class="trust"><td>TRUST</td><td class="tag">Queda en la empresa</td><td style="text-align:right">${tot?(100-DISP.reduce((a,p)=>a+partPct(p,tot),0)).toFixed(2).replace(/\.?0+$/,""):"—"}%</td><td style="text-align:right">${fmt(tot-DISP.reduce((a,p)=>a+partAmt(p,tot),0))}</td><td></td></tr>`;
    if(!$("#dl-ase")){const dl=document.createElement("datalist");dl.id="dl-ase";dl.innerHTML=ASESORES.concat(["Aly"]).map(a=>`<option value="${esc(a)}">`).join("");root.appendChild(dl)}
    const over=DISP.reduce((a,p)=>a+partAmt(p,tot),0)>tot+0.5;g("disp-warn").textContent=over?"⚠ La dispersión supera la comisión total.":"";g("disp-warn").style.color=over?"var(--bad)":"";
    tb.querySelectorAll("input").forEach(i=>i.onchange=()=>{const p=DISP.find(x=>x.id===i.closest("tr").dataset.id);const f=i.dataset.f;if(f==="pct"){p.pct=num(i.value)||0;p.monto=null}else if(f==="monto"){const m=num(i.value);p.monto=m==null?null:m;if(m==null)p.pct=p.pct||0}else p[f]=i.value.trim();drawDisp()});
    tb.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{DISP=DISP.filter(x=>x.id!==b.dataset.del);drawDisp()});
  }
  g("disp-add").onclick=()=>{DISP.push({id:uid(),nombre:"",rol:"",pct:0,monto:null});drawDisp()};
  g("disp-reset").onclick=()=>{DISP=null;drawDisp()};
  ["v-un","v-prop","v-asesor","v-opc","v-ag","v-tipo"].forEach(id=>g(id).onchange=()=>{g("v-prop-box").style.visibility=g("v-un").value==="Corretaje"?"":"hidden";const cr=g("v-tipo").value==="Crédito hipotecario";g("lbl-monto").textContent=cr?"Monto del crédito (referencia)":"Monto de la operación";g("v-pct").disabled=cr;g("v-cmonto").placeholder=cr?"$ comisión que paga el banco":"$ (opcional)";if(isNew||confirm("¿Recalcular la dispersión con las reglas para estos datos?")){DISP=null}drawDisp()});
  ["v-monto","v-pct","v-cmonto"].forEach(id=>g(id).onchange=()=>{if(id==="v-monto"||id==="v-cmonto"){const x=num(g(id).value);g(id).value=x==null?"":fmt(x)}drawDisp()});
  drawDisp();
  if(!isNew){
    g("d-del").onclick=async()=>{if(!confirm(`¿Eliminar la venta de ${v.cliente}? Se borran también sus pagos.`))return;const r=await sb.from("ventas").delete().eq("id",v.id);if(r.error){toast(r.error.message,true);return}VENTAS=VENTAS.filter(x=>x.id!==v.id);PAGOS=PAGOS.filter(c=>c.venta_id!==v.id);close();render();toast("Venta eliminada")}}
  g("d-save").onclick=async()=>{
    const c=cur();if(!c.cliente){toast("Falta el cliente",true);return}if(!c.asesor){toast("Falta el asesor",true);return}if(!c.monto&&c.comision_monto==null){toast("Falta el monto",true);return}
    const row={...c,dispersion:DISP.map(p=>({nombre:p.nombre,rol:p.rol,pct:+p.pct||0,monto:p.monto!=null&&p.monto!==""?+p.monto:null}))};
    const r=isNew?await sb.from("ventas").insert(row).select().single():await sb.from("ventas").update(row).eq("id",v.id).select().single();
    if(r.error){toast("No se guardó: "+r.error.message,true);return}
    if(isNew)VENTAS.unshift(r.data);else VENTAS[VENTAS.findIndex(x=>x.id===v.id)]=r.data;
    toast(isNew?"Venta registrada. Las comisiones ya aparecen en Comisiones.":"Guardado");close();render();
  };
}
$("#btn-new").onclick=()=>openVenta(null);
loadAll();
</script>
