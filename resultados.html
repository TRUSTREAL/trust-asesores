<html lang="es">
<head>
<meta charset="utf-8">

<title>TRUST realtor | Mis resultados</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F2;--card:#FFFFFF;--soft:#F1EDE3;--green:#173F35;--green-2:#22574A;--gold:#B8956A;--gold-2:#8E6F47;--ink:#1B1F1E;--dim:#737876;--line:#E7E2D6;--line-2:#D8D2C3;--ok:#2E7D5B;--ok-bg:#E3F1EA;--bad:#A8342A;--bad-bg:#F7E4E1;--serif:Lora,Georgia,serif;--sans:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--green)}
.wrap{max-width:1120px;margin:0 auto;padding:26px 16px 60px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:22px;display:block}
.home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff}
.home-link:hover{color:var(--green);border-color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--green)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.av{width:58px;height:58px;border-radius:50%;background:var(--green) center/cover no-repeat;color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:22px;flex:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:28px;color:var(--green);line-height:1.15;text-wrap:balance}
h2{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--green);text-wrap:balance}
.sub{color:var(--dim);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;background:#fff;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--green);color:#fff}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.adm{background:#FFF7E6;border:1px solid #EBD9B5;color:#6B5330;border-radius:12px;padding:8px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.adm select{border:1px solid #EBD9B5;border-radius:8px;padding:4px 8px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--dim)}
.tile .v{white-space:nowrap;font-family:var(--serif);font-size:27px;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12px;color:var(--dim)}
.tile.duo{flex-direction:row;gap:0;padding:14px 0}.tile.duo>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:0 14px}.tile.duo>div+div{border-left:1px solid var(--line)}.tile.duo .v{font-size:21px;line-height:1.5}
.tile.hl{background:var(--green);border-color:var(--green)}.tile.hl .l,.tile.hl .s{color:rgba(255,255,255,.75)}.tile.hl .v{color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);padding:22px;min-width:0;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{font-size:12px;color:var(--dim)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--gold-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:22px}
.bars .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.bars .bar{width:100%;max-width:44px;border-radius:6px 6px 0 0;background:var(--green);position:relative;min-height:2px}
.bars .bar.z{background:var(--line-2)}.bars .bar.fut{background:transparent;border:1px dashed var(--line-2);height:5px}
.bars .bv{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--green);white-space:nowrap}
.blab{display:flex;gap:8px}.blab span{flex:1;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.fn{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.fn .tr{height:9px;border-radius:5px;background:var(--soft);overflow:hidden}.fn .tr i{display:block;height:100%;border-radius:5px;background:var(--green)}
.fn .r{white-space:nowrap;font-variant-numeric:tabular-nums}
.money,.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.money i,.split i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:13px}
.kv dt{color:var(--dim);display:flex;align-items:center;gap:8px}.kv dd{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.big{font-family:var(--serif);font-size:30px;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:13px}
.rk.me{background:var(--green);color:#fff}.rk .n{font-family:var(--serif);font-size:16px;text-align:center}
.rk .tr{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}.rk .tr i{display:block;height:100%;background:var(--gold)}
.rk.me .tr{background:rgba(255,255,255,.25)}.rk.me .tr i{background:#fff}
.rk b{font-variant-numeric:tabular-nums;white-space:nowrap}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line-2)}
.dim{color:var(--dim)}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}h1{font-size:24px}.fn{grid-template-columns:70px 1fr auto}.hide-m{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@page{size:letter portrait;margin:11mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.home-link,.seg,.adm,.acts,.auth-out{display:none!important}body{background:#fff;font-size:11.5px}.wrap{max-width:none;padding:0;gap:12px}#app>div{gap:12px!important}.card{break-inside:avoid;box-shadow:none;padding:14px;gap:10px}.tile{break-inside:avoid;padding:10px 12px}.tile .v{font-size:21px}.tile.duo .v{font-size:14.5px}.tile.duo>div{padding:0 9px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))!important}.grid2{grid-template-columns:1fr 1fr!important;gap:12px}.bars{height:120px}h1{font-size:22px}h2{font-size:16px}.big{font-size:22px}.hide-m{display:table-cell!important}a{text-decoration:none;color:inherit}.pie{display:block!important}}
.pie{display:none;font-size:10.5px;color:var(--dim);text-align:center;margin-top:4px}
</style>

const fmt=n=>"$"+Math.round(+n||0).toLocaleString("es-MX");

const pagadoDe=vid=>PAGOS.filter(p=>p.venta_id===vid).reduce((a,p)=>a+(+p.monto||0),0);
/* meses que cuentan para el promedio: desde la fecha de ingreso (o la primera operación) hasta el mes en curso — igual que en Mis comisiones */
function mesInicio(){let ini=(REGLAS.ingresos||{})[ME]||"";if(!ini){const fs=VENTAS.filter(v=>misPartes(v).length||esVendDe(v,ME)).map(v=>String(v.fecha).slice(0,7)).sort();ini=fs[0]||""}
  if(!ini)return 1;const [iy,im]=ini.split("-").map(Number);return iy>Y?13:iy===Y?im:1}
function nMeses(){const ini=mesInicio(),desde=P==="anio"?1:P==="q"?(CQ-1)*3+1:CM;return Math.max(1,CM-Math.max(ini,desde)+1)}

async function all(build){const out=[];for(let i=0;;i+=1000){const {data,error}=await build().range(i,i+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out}
const soft=async p=>{try{const r=await p;return r&&r.error?{data:null,error:r.error}:r}catch(e){return {data:null,error:e}}};
async function load(){
  if(!sb){$("#app").innerHTML=`<div class="empty">No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.</div>`;return}
  if(!ME){$("#app").innerHTML=`<div class="empty">Inicia sesión en el portal para ver tus resultados.</div>`;return}
  try{
    const [v,pg,rg,ld,hl,ls,eq]=await Promise.all([
      all(()=>sb.from("ventas").select("*").gte("fecha",Y+"-01-01").order("fecha").order("id")),
      soft(sb.from("ventas_pagos").select("venta_id,monto,fecha").eq("beneficiario",ME)),
      soft(sb.from("ventas_reglas").select("reglas").eq("id",1).maybeSingle()),
      all(()=>sb.from("leads").select("id,fecha,cita,visita,apartado,venta").eq("asesor",ME).gte("fecha",Y+"-01-01").order("id")),
      soft(sb.from("hot_leads").select("*").eq("asesor",ME).eq("estatus","Pendiente")),
      soft(sb.from("listings").select("id,estatus").eq("asesor",ME)),
      soft(sb.from("asesores").select("nombre,activo,admin,foto_url"))
    ]);
    VENTAS=v;PAGOS=pg.data||[];REGLAS=(rg.data&&rg.data.reglas)||{};LEADS=ld;HOT=hl.data||[];LISTINGS=ls.data||[];EQ=eq.data||[];
    render();
  }catch(e){$("#app").innerHTML=`<div class="empty">No se pudieron leer tus resultados: ${esc(e.message||e)}</div>`}
}
/* comisión completa de las ventas del asesor: el ingreso total de cada operación donde fue el vendedor, sin importar cuánto de eso se llevó él. Venta compartida: mitad a cada vendedor. Sin créditos hipotecarios. */
const comDe=(n,f)=>VENTAS.filter(v=>esVendDe(v,n)&&!esCredito(v)&&f(v.fecha)).reduce((a,v)=>a+comTotal(v)/(v.asesor2?2:1),0);
/* ranking del equipo por comisión completa de sus ventas: asesores activos (sin administradores), más quien esté viendo */
function ranking(f){
  const names=new Set(EQ.filter(a=>a.activo!==false&&!a.admin).map(a=>a.nombre));names.add(ME);
  return [...names].map(n=>({n,c:comDe(n,f)})).sort((a,b)=>b.c-a.c||(a.n===ME?-1:b.n===ME?1:0));
}
function fotoInfo(url){const m=/#o=([vhs])&p=(\d+)/.exec(url||""),o=m?m[1]:"s",p=m?+m[2]:50;return {src:(url||"").split("#")[0],pos:o==="v"?"50% "+p+"%":o==="h"?p+"% 50%":"50% 50%"}}

function render(){
  const ops=VENTAS.filter(v=>inP(v.fecha)&&(miCom(v)>0||esVendDe(v,ME))).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.created_at||"").localeCompare(String(a.created_at||"")));
  const cier=ops.filter(v=>esVendDe(v,ME)&&!esCredito(v));
  const monto=cier.reduce((a,v)=>a+(+v.monto||0),0), com=ops.reduce((a,v)=>a+miCom(v),0);
  const ing=cier.reduce((a,v)=>a+comTotal(v)/(v.asesor2?2:1),0); // comisión completa de sus ventas (ingreso de la operación)
  const pag=ops.reduce((a,v)=>a+Math.min(miCom(v),pagadoDe(v.id)),0), pend=Math.max(0,com-pag);
  const nPend=ops.filter(v=>miCom(v)-pagadoDe(v.id)>0.5).length;
  const rentas=cier.filter(v=>/renta/i.test(v.tipo||"")).length;
  const soloOpc=ops.length-cier.length;
  const le=LEADS.filter(l=>inP(l.fecha)),L={leads:le.length,c:le.filter(l=>l.cita||l.apartado||l.venta).length,vi:le.filter(l=>l.visita).length,ap:le.filter(l=>l.apartado||l.venta).length,v:le.filter(l=>l.venta).length};
  const nM=nMeses();
  const rkY=ranking(f=>anioDe(f)===Y), miY=comDe(ME,f=>anioDe(f)===Y),lugar=1+rkY.filter(r=>r.c>miY+0.5).length;
  const activos=LISTINGS.filter(l=>l.estatus==="activo").length;
  const yo=EQ.find(a=>a.nombre===ME)||{},fi=yo.foto_url?fotoInfo(yo.foto_url):null;
  const ini=ME.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  // ventas por mes (año completo)
  const by=Array.from({length:12},(_,i)=>cierresDe(ME,f=>anioDe(f)===Y&&mesDe(f)===i+1)),mx=Math.max(...by,1),totY=by.reduce((a,b)=>a+b,0);
  const best=by.indexOf(Math.max(...by)),mesesAct=Math.max(1,CM-Math.min(mesInicio(),CM)+1);
  const enP=i=>P==="anio"?true:P==="q"?Math.ceil((i+1)/3)===CQ:i+1===CM;
  // embudo
  const fn=(lab,n,std)=>{const p=L.leads?n/L.leads*100:0;return `<div class="fn"><span>${lab}</span><div class="tr"><i style="width:${std==null?(L.leads?100:0):Math.min(100,p*4)}%"></i></div><span class="r"><b>${n}</b>${std==null?(L.leads?" · 100%":""):L.leads?` · ${p.toFixed(1)}% <span class="pill ${p>=std?"ok":"bad"}">meta ${std}%</span>`:` <span class="pill">meta ${std}%</span>`}</span></div>`};
  // origen
  const nAg=cier.filter(v=>v.autogenerada).length,nLd=cier.length-nAg,pLd=cier.length?Math.round(nLd/cier.length*100):0;
  const comAg=cier.filter(v=>v.autogenerada).reduce((a,v)=>a+miCom(v),0),comLd=cier.filter(v=>!v.autogenerada).reduce((a,v)=>a+miCom(v),0);
  // hot leads
  const hot=HOT.slice().sort((a,b)=>(+b.monto||0)-(+a.monto||0)),hotTot=hot.reduce((a,h)=>a+(+h.monto||0),0);
  // TOP Realtor del trimestre
  const rkQ=ranking(f=>anioDe(f)===Y&&Math.ceil(mesDe(f)/3)===CQ),miQ=comDe(ME,f=>anioDe(f)===Y&&Math.ceil(mesDe(f)/3)===CQ),maxQ=Math.max(...rkQ.map(r=>r.c),1);
  const posQ=rkQ.findIndex(r=>r.n===ME);let verQ=rkQ.slice(0,6);if(posQ>=6)verQ=rkQ.slice(0,5).concat([rkQ[posQ]]);
  const lider=rkQ[0]?rkQ[0].c:0,falta=lider-miQ;
  const rol=v=>{const r=[...new Set(misPartes(v).map(p=>String(p.rol||"").replace(/\s*\(compartida\)/,"")))];return r.length?r.join(" + "):esVendDe(v,ME)?"Vendedor":"—"};
  const prop=v=>[v.proyecto||v.inmueble||"",v.unidad||""].filter(Boolean).join(" · ")||"—";

  $("#app").innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
  ${ES_ADMIN?`<div class="adm"><b>Vista de administrador.</b> Estás viendo los resultados de <select id="ver">${[...new Set(EQ.filter(a=>a.activo!==false).map(a=>a.nombre).concat([ME]))].sort((a,b)=>a.localeCompare(b,"es")).map(n=>`<option ${n===ME?"selected":""}>${esc(n)}</option>`).join("")}</select> tal como los ve en su portal. El cambio aplica a todos los módulos.</div>`:""}
  <header class="top">
    <div class="who"><div class="av" aria-hidden="true" ${fi?`style="background-image:url('${esc(fi.src)}');background-position:${fi.pos}"`:""}>${fi?"":esc(ini)}</div>
      <div><div class="eyebrow">Mis resultados</div><h1>${esc(ME)}, así va tu ${Y}</h1><p class="sub">${perTxt()}</p></div></div>
    <div class="seg" role="group" aria-label="Periodo"><button data-p="anio" aria-pressed="${P==="anio"}">Año ${Y}</button><button data-p="q" aria-pressed="${P==="q"}">Q${CQ}</button><button data-p="mes" aria-pressed="${P==="mes"}">${MES_L[CM-1][0].toUpperCase()+MES_L[CM-1].slice(1)}</button></div>
  </header>
  <section class="tiles" aria-label="Resumen">
    <div class="tile hl"><span class="l">Cierres</span><span class="v">${cier.length}</span><span class="s">${cier.length-rentas} venta${cier.length-rentas===1?"":"s"} · ${rentas} renta${rentas===1?"":"s"}${soloOpc?` · +${soloOpc} como opcionador`:""}</span></div>
    <div class="tile duo"><div><span class="l">Ventas</span><span class="v">${fmtK(monto)}</span><span class="s">${cier.length?fmtK(monto/cier.length)+" ticket prom.":"sin cierres"}</span></div><div><span class="l">Ingreso</span><span class="v">${fmtK(ing)}</span><span class="s">${monto?(ing/monto*100).toFixed(1)+"% de las ventas":"comisión de las ventas"}</span></div></div>
    <div class="tile"><span class="l">Mi comisión generada</span><span class="v">${fmtK(com)}</span><span class="s">${fmt(pag)} ya pagado</span></div>
    <div class="tile"><span class="l">Comisión promedio mensual</span><span class="v">${fmtK(com/nM)}</span><span class="s">${fmt(com)} entre ${nM} ${nM===1?"mes":"meses"}</span></div>
    <div class="tile"><span class="l">Por cobrar</span><span class="v" style="color:${pend>0.5?"var(--bad)":"var(--ok)"}">${fmtK(pend)}</span><span class="s">${nPend?`${nPend} operaci${nPend===1?"ón":"ones"} pendiente${nPend===1?"":"s"}`:"todo pagado"}</span></div>
    <div class="tile"><span class="l">Leads recibidos</span><span class="v">${L.leads}</span><span class="s">${L.leads?"asignados en el periodo":"sin leads en el periodo"}</span></div>
    <div class="tile"><span class="l">Mis listings</span><span class="v">${activos}</span><span class="s">propiedad${activos===1?"":"es"} activa${activos===1?"":"s"}</span></div>
    <div class="tile"><span class="l">Lugar en el equipo</span><span class="v">${lugar}º <small style="font-size:14px;color:var(--dim)">de ${rkY.length}</small></span><span class="s">por comisión de sus ventas en ${Y}</span></div>
  </section>

  <div class="grid2">
    <section class="card"><div class="chead"><h2>Ventas por mes</h2><span class="note">operaciones cerradas en ${Y}</span></div>
      <div><div class="bars">${by.map((n,i)=>`<div class="col"><div class="bar ${i>=CM?"fut":n?"":"z"}" style="${i>=CM?"":"height:"+Math.max(1,n/mx*100)+"%"};${enP(i)&&i<CM?"":"opacity:.35"}">${n&&i<CM?`<span class="bv">${n}</span>`:""}</div></div>`).join("")}</div><div class="blab">${MES.map(m=>`<span>${m}</span>`).join("")}</div></div>
      <p class="note">${totY?`Tu mejor mes fue <b>${MES_L[best]}</b> con ${by[best]} cierre${by[best]===1?"":"s"}. Promedio del año: ${(totY/mesesAct).toFixed(1)} por mes.`:`Todavía no tienes cierres registrados en ${Y}.`}</p></section>

    <section class="card"><div class="chead"><h2>Mis comisiones</h2><span class="note">${perCorto()}</span></div>
      <div class="big">${fmt(com)}</div>
      <div class="money" role="img" aria-label="Comisión pagada contra pendiente"><i style="width:${com?pag/com*100:0}%;background:var(--green)"></i><i style="width:${com?pend/com*100:0}%;background:var(--gold)"></i></div>
      <dl class="kv"><dt><i class="dot" style="background:var(--green)"></i>Pagado</dt><dd>${fmt(pag)} · ${pct(pag,com)}</dd><dt><i class="dot" style="background:var(--gold)"></i>Pendiente de pago</dt><dd>${fmt(pend)} · ${pct(pend,com)}</dd><dt>Promedio por operación</dt><dd>${ops.length?fmt(com/ops.length):"—"}</dd></dl>
      <p class="note">El detalle de cada pago está en <a href="comisiones/asesores.html">Mis comisiones</a>.</p></section>
  </div>

  <div class="grid2">
    <section class="card"><div class="chead"><h2>Mi embudo de leads</h2><span class="note">${perCorto()}</span></div>
      <div>${fn("Leads",L.leads)}${fn("Citas",L.c,STD.Citas)}${fn("Visitas",L.vi,STD.Visitas)}${fn("Apartados",L.ap,STD.Apartados)}${fn("Ventas",L.v,STD.Ventas)}</div>
      <p class="note">Porcentaje sobre tus leads del periodo, contra el estándar TRUST. La barra está amplificada para que se aprecie.</p></section>

    <section class="card"><div class="chead"><h2>Origen de mis ventas</h2><span class="note">lead de TRUST o autogenerado</span></div>
      <div class="big">${cier.length?`${pLd}% lead · ${100-pLd}% autogenerado`:"—"}</div>
      <div class="split" role="img" aria-label="Ventas de lead contra autogeneradas"><i style="width:${cier.length?pLd:0}%;background:var(--green)"></i><i style="width:${cier.length?100-pLd:0}%;background:var(--gold)"></i></div>
      <dl class="kv"><dt><i class="dot" style="background:var(--green)"></i>De lead de TRUST</dt><dd>${nLd} · ${fmt(comLd)}</dd><dt><i class="dot" style="background:var(--gold)"></i>Autogeneradas</dt><dd>${nAg} · ${fmt(comAg)}</dd></dl></section>
  </div>

  <div class="grid2">
    <section class="card"><div class="chead"><h2>Mis Hot Leads</h2><span class="note">pendientes en la sección Hot Leads</span></div>
      ${hot.length?`<div class="twrap"><table><thead><tr><th>Prospecto</th><th>Proyecto</th><th class="num">Monto</th></tr></thead>
      <tbody>${hot.map(h=>`<tr><td><b>${esc(h.cliente||"—")}</b></td><td>${esc(h.proyecto||"—")}</td><td class="num">${+h.monto?fmtK(h.monto):"—"}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="2">${hot.length} hot lead${hot.length===1?"":"s"} pendiente${hot.length===1?"":"s"}</td><td class="num">${fmtK(hotTot)}</td></tr></tfoot></table></div>`:`<div class="empty">No tienes hot leads pendientes. Regístralos en <a href="hotleads/asesores.html">Mis hot leads</a>.</div>`}</section>

    <section class="card"><div class="chead"><h2>TOP Realtor · Q${CQ}</h2><span class="note">comisión de las ventas del trimestre</span></div>
      <div>${verQ.map(r=>{const i=rkQ.indexOf(r),me=r.n===ME;return `<div class="rk ${me?"me":""}"><span class="n">${1+rkQ.filter(x=>x.c>r.c+0.5).length}</span><div><div style="margin-bottom:4px">${me?"<b>Tú</b>":"Asesor "+String.fromCharCode(65+(i>posQ&&posQ>=0?i-1:i))}</div><div class="tr"><i style="width:${r.c/maxQ*100}%"></i></div></div><b>${me?fmt(r.c):""}</b></div>`}).join("")}</div>
      <p class="note">${lider<=0.5?"Nadie tiene ventas todavía este trimestre.":falta<=0.5?"Vas en <b>primer lugar</b> del trimestre.":`Te faltan <b>${fmt(falta)}</b> en comisión de ventas para alcanzar el primer lugar del trimestre.`} El lugar se define por la comisión completa de las ventas de cada asesor (el ingreso total de la operación, no solo su parte).</p></section>
  </div>

  <section class="card"><div class="chead"><h2>Mis operaciones</h2><span class="note">${perCorto()}</span></div>
    <div class="twrap"><table><thead><tr><th>Mes</th><th>Cliente</th><th>Proyecto / propiedad</th><th class="hide-m">Rol</th><th>Origen</th><th class="num">Venta</th><th class="num">Ingreso</th><th class="num">Mi comisión</th></tr></thead>
    <tbody>${ops.map(v=>`<tr><td class="dim">${MES[mesDe(v.fecha)-1]||""}</td><td><b>${esc(v.cliente||"—")}</b></td><td>${esc(prop(v))}</td><td class="hide-m dim">${esc(rol(v))}</td><td><span class="pill">${esCredito(v)?"Crédito":v.autogenerada?"Autogenerado":"Lead"}</span></td><td class="num">${fmt(v.monto)}</td><td class="num">${fmt(comTotal(v))}</td><td class="num"><b>${fmt(miCom(v))}</b></td></tr>`).join("")||`<tr><td colspan="8" class="dim">Sin operaciones en el periodo.</td></tr>`}</tbody>
    ${ops.length?`<tfoot><tr><td colspan="3">Total · ${ops.length} operaci${ops.length===1?"ón":"ones"}</td><td class="hide-m"></td><td></td><td class="num">${fmt(ops.reduce((a,v)=>a+(+v.monto||0),0))}</td><td class="num">${fmt(ops.reduce((a,v)=>a+comTotal(v),0))}</td><td class="num">${fmt(com)}</td></tr></tfoot>`:""}</table></div></section>
  <p class="pie">TRUST realtor · Mis resultados de ${esc(ME)} · ${perTxt()} · generado el ${HOY.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})} · información confidencial</p>
  </div>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{P=b.dataset.p;try{localStorage.setItem("misres_per",P)}catch(e){}render()});
  const ver=$("#ver");if(ver)ver.onchange=()=>{if(window.TRUST_VER_COMO)window.TRUST_VER_COMO(ver.value)};
}
document.getElementById("btn-pdf").onclick=()=>{const t=document.title;document.title=`Mis resultados ${ME} ${perCorto()}`.replace(/\s+/g," ");window.print();setTimeout(()=>{document.title=t},800)};
load();
</script>
</body>
