<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#173F35">
<title>TRUST realtor | Portal del desarrollador</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#173F35;--green-2:#22574A;--cream:#FAF8F2;--gold:#B8956A;--gold-2:#8E6F47;--red:#A8342A;--ok:#2E7D5B;--ink:#1B1F1E;--dim:#7C807E;--line:#E7E2D6;--line-2:#D8D2C3;--card:#fff;--surface:#fff;--surface-2:#F1EDE3;--text:#1B1F1E;--muted:#7C807E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
body.home{background:#0F2A23;color:#fff}
.bg{display:none;position:fixed;inset:0;z-index:0;background:#0F2A23 url(../menu-bg.jpg) center 62%/cover no-repeat;filter:blur(3px) saturate(.9);transform:scale(1.03)}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,35,.3) 0,rgba(15,42,35,.5) 40%,rgba(15,42,35,.8) 100%)}
body.home .bg{display:block}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 16px 60px}
body.home .wrap{padding:40px 28px 60px}
h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:28px;color:var(--green);line-height:1.15;text-wrap:balance}
h2{font-family:Lora,Georgia,serif;font-weight:500;font-size:21px;color:var(--green);margin:0 0 12px}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:600;margin-bottom:6px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head.main{padding-bottom:18px;border-bottom:3px solid var(--green)}
.pnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.pnav a{font-size:13px;font-weight:500;border-radius:999px;padding:8px 16px;border:1px solid var(--line-2);background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap}
.pnav a:hover{border-color:var(--green);color:var(--green)}
.pnav a.on{background:var(--green);border-color:var(--green);color:#fff}
/* inicio: misma línea que el portal de asesores */
.hlogo{height:22px;filter:brightness(0) invert(1);opacity:.9;display:block;margin-bottom:22px}
body.home h1{font-size:40px;line-height:1.05;color:#fff;margin:0 0 8px}body.home h1 em{font-style:italic;opacity:.9}
body.home .sub{font-size:14px;color:rgba(255,255,255,.72)}
body.home .eyebrow{font-size:10px;letter-spacing:.2em;color:#E6C98F}
.glass{background:linear-gradient(135deg,rgba(23,63,53,.55),rgba(23,63,53,.38));border:1px solid rgba(255,255,255,.28);border-top-color:rgba(255,255,255,.45);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
@media (max-width:900px){.tools{grid-template-columns:repeat(2,1fr)}}
.tool{position:relative;display:flex;flex-direction:column;gap:14px;border-radius:22px;padding:22px 22px 20px;text-decoration:none;color:#fff;min-height:168px;transition:transform .2s,background .2s,border-color .2s;overflow:hidden}
.tool:before{content:"";position:absolute;left:-30%;top:-60%;width:80%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.14),transparent);pointer-events:none}
.tool:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(23,63,53,.7),rgba(23,63,53,.5));border-color:rgba(255,255,255,.5)}
.tool:focus-visible{outline:2px solid #E6C98F;outline-offset:3px}
.btn:focus-visible,.chip:focus-visible,.pnav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tool .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.tool .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool h2{font-family:Lora,Georgia,serif;font-weight:500;font-size:19px;color:#fff;margin:0 0 5px}
.tool p{font-size:12px;line-height:1.5;color:rgba(255,255,255,.8)}
.tool .stat{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}
.tool .stat b{font-family:Lora,Georgia,serif;font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.tool .stat span{font-size:11px;color:rgba(255,255,255,.7)}
.tool .go{position:absolute;right:18px;top:20px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:rgba(255,255,255,.1)}
.tool:hover .go{background:#fff;color:#173F35;border-color:#fff}
.foot{margin-top:34px;font-size:11px;color:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){.tool{transition:none}}
/* shared */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:12px;color:var(--dim)}
.tile .v{font-family:Lora,serif;font-size:26px;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12px;color:var(--dim)}
.tile.hl{background:var(--green);border-color:var(--green)}.tile.hl .l,.tile.hl .s{color:rgba(255,255,255,.72)}.tile.hl .v{color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(23,63,53,.06),0 8px 24px rgba(23,63,53,.06);padding:22px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>.card{margin-bottom:0}
.grid2{margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:#fff;padding:6px 14px;font-size:13px;font-weight:500;border-radius:99px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.btn{border:1px solid var(--line-2);background:#fff;padding:8px 14px;font-weight:500;font-size:13px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--red)}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.dim{color:var(--dim)}
tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#FCFBF7}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:#F0ECE1;color:var(--gold-2);white-space:nowrap}
.pill.ok{background:#E3F1EA;color:var(--ok)}.pill.bad{background:#F7E4E1;color:var(--red)}
.empty{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:14px}
.note{font-size:12px;color:var(--dim);margin-top:10px}
/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:22px;position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;position:relative}
.bars .bar{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--green);min-height:2px;position:relative}
.bars .bar.z{background:var(--line-2)}
.bars .bar.fut{background:transparent;border:1px dashed var(--line-2)}
.bars .bv{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .obj{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none}
.bars .obj span{position:absolute;left:0;top:-18px;font-size:11px;color:var(--gold-2);font-weight:600;background:var(--card);padding-right:6px}
.blab{display:flex;gap:8px;margin-top:6px}.blab span{flex:1;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;background:var(--green);margin-right:6px}
.legend i.g{background:var(--gold)}.legend i.d{background:transparent;border-top:2px dashed var(--gold);height:0;width:16px;vertical-align:middle}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hb .tr{height:8px;border-radius:4px;background:#F0ECE1;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:4px;background:var(--green)}
.hb .tr i.g{background:var(--gold)}
.hb b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:flex;height:16px;border-radius:8px;background:#F0ECE1;margin:6px 0 10px;overflow:hidden}
.stack i{display:block;height:100%}
.sv{background:var(--green)}.sa{background:var(--gold)}.sd{background:#DDD6C5}.sb{background:#9A9C99}
.funnel .hb{grid-template-columns:110px 1fr 150px}
.funnel .hb .r{text-align:right;white-space:nowrap}
/* inventario: edificio (mismo estilo que Admin → Inventario) */
.edwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;margin-top:14px}
.edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.edbar .chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text);cursor:pointer;font:inherit}
.edbar .chip[aria-pressed="true"]{background:var(--green,#173F35);border-color:var(--green,#173F35);color:#fff}
.edleg{margin-left:auto;display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.edleg span{display:inline-flex;align-items:center;gap:5px}.edleg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.edbld{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 12px;overflow-x:auto}
.edtow{display:grid;gap:0 8px;align-items:center;width:max-content;min-width:100%}
.edth{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px;white-space:nowrap}
.edth b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;color:var(--green,#173F35)}
.edroof{height:10px;border-radius:10px 10px 0 0;background:var(--green,#173F35);margin-bottom:6px}
.edfl{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--surface-2);border-radius:10px;font-family:Lora,Georgia,serif;font-size:17px;color:var(--green,#173F35);height:60px;min-width:46px}
.edfl small{font-family:Poppins,sans-serif;font-size:8px;color:var(--muted);letter-spacing:.1em}
.edrow{display:grid;gap:4px;padding:3px 0;min-width:0}
.edmid{height:100%;position:relative;min-width:18px}.edmid i{position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--line-2)}
.eu{border-radius:9px;border:1.5px solid #2E7D5B;background:#E1F1E8;padding:6px 5px 5px;height:60px;width:100%;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;min-width:0;text-align:left;font:inherit}
.eu b{font-family:Lora,Georgia,serif;font-weight:500;font-size:14px;color:var(--green,#173F35);line-height:1}
.eu .t{font-size:9px;letter-spacing:-.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eu .t em{font-style:normal;font-weight:600;color:var(--text)}
.eu .p{font-size:10px;font-weight:600;color:var(--green,#173F35);white-space:nowrap}
.eu.st-apartado{background:#F2C94C;border-color:#F2C94C}.eu.st-apartado b{color:#5E4A00}
.eu.st-vendido{background:#2F5597;border-color:#2F5597}.eu.st-vendido b,.eu.st-vendido .p,.eu.st-vendido .t,.eu.st-vendido .t em{color:#fff}
.eu.st-bloqueado{background:#B8B8B5;border-color:#B8B8B5}.eu.st-bloqueado b{color:#fff}
.eu.st-aportante{background:#E07A2F;border-color:#E07A2F}.eu.st-aportante b{color:#fff}
.eu.st-otro{background:#D9D6CE;border-color:#D9D6CE}.eu.st-otro b{color:#fff}
.eu.mute{justify-content:flex-start}
.eu.sel{outline:3px solid #1E241F;outline-offset:1px}
.eu.dim{opacity:.22}
.eu.hid{background:#EDEBE5;border-color:#EDEBE5;cursor:default}.eu.hid b{color:#C9C5BA}
.edgf{margin-top:10px;padding-top:10px;border-top:2px solid var(--green,#173F35)}
.edgf .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.edtot{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.edtot div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.edtot b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:20px;color:var(--green,#173F35)}.edtot span{font-size:11px;color:var(--muted)}
.edside{position:sticky;top:16px}
.edcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.edcard .ph{height:170px;background:var(--surface-2) center/cover no-repeat;position:relative;cursor:zoom-in}
.edcard .ph.plan{background-size:contain;background-color:#fff}
.edcard .ph span{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 11px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green,#173F35)}
.edcard .thumbs{display:flex;gap:5px;padding:6px 8px 0;overflow-x:auto}
.edcard .thumbs div{width:56px;height:42px;border-radius:6px;background:var(--surface-2) center/cover no-repeat;flex:none;cursor:pointer;border:2px solid transparent}
.edcard .thumbs div.on{border-color:var(--green,#173F35)}
.edcard .bd{padding:14px 16px 16px}
.edst{display:inline-block;border-radius:999px;padding:3px 10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:#E1F1E8;color:#2E7D5B}
.edcard h2{font-family:Lora,Georgia,serif;font-weight:500;font-size:25px;margin:8px 0 0}.edcard .sub{color:var(--muted);font-size:12px}
.edprice{font-family:Lora,Georgia,serif;font-size:24px;color:var(--green,#173F35);margin:10px 0 0}.edpm2{font-size:11px;color:var(--muted)}
.edspecs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 0}
.edspecs div{background:var(--surface-2);border-radius:10px;padding:7px 9px}.edspecs b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:16px;color:var(--green,#173F35)}.edspecs span{font-size:9.5px;color:var(--muted)}
.edbtns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.edbtns .btn{justify-content:center;text-decoration:none}
.edempty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
.edempty b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:18px;color:var(--green,#173F35);margin-bottom:4px}
@media (max-width:980px){.edwrap{grid-template-columns:1fr}.edside{position:static}}
.edcard h2{color:var(--green)}
.edwrap>div{min-width:0}.edbld{max-width:100%}.seg2{flex:none}
.stp{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;background:#fff;padding:3px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:7px 18px;font-weight:500;font-size:13px}
.seg2 button[aria-pressed=true]{background:var(--green);color:#fff}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,30,27,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--cream);border-radius:18px 0 0 18px;overflow:hidden;z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)}
.drawer header{padding:20px 24px;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer header h3{font-family:Lora,serif;font-weight:500;font-size:21px}
.drawer header p{opacity:.75;font-size:12px;margin-top:2px}
.drawer .x{background:transparent;border:0;color:#fff;font-size:18px;padding:4px 8px}
.drawer .body{padding:22px 24px;overflow-y:auto;flex:1}
.sec{margin-bottom:24px}
.sec h4{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-2);font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--dim)}.kv dd{font-weight:500;word-break:break-word}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--dim)}
.f input,.f textarea,.f select,input.in,select.in{border:1px solid var(--line-2);background:#fff;padding:8px 12px;border-radius:10px;width:100%}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.doc a{flex:1;min-width:0;font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small{color:var(--dim);white-space:nowrap}
.up{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.err{background:var(--red)}
.gate{min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center}
.gate h1{margin-bottom:8px}
.adminbar{background:#FFF7E6;border:1px solid #EBD9B5;border-radius:12px;color:#6B5330;padding:8px 14px;font-size:12px;margin-bottom:18px}
.search{border:1px solid var(--line-2);background:#fff;padding:9px 16px;border-radius:999px;min-width:240px}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .funnel .hb{grid-template-columns:80px 1fr 120px}
  .kv{grid-template-columns:110px 1fr}
  .hide-m{display:none}
  .drawer{border-radius:0}
}
@media (max-width:560px){body.home .wrap{padding:26px 16px 40px}body.home h1{font-size:28px}.tools{grid-template-columns:1fr;gap:12px}.tool{min-height:0;padding:16px 16px 14px}.tool .go{display:none}.hlogo{margin-bottom:14px}.bg{filter:blur(2px)}.glass{backdrop-filter:blur(10px)}}
@media print{.pnav,.btn,.chips{display:none!important}body{background:#fff}.card,.tile{break-inside:avoid}}
</style>
</head>

<div id="app"><div class="gate"><p class="dim">Cargando…</p></div></div>
<div id="drawer-root"></div>

/* ---------- datos ---------- */

async function all(build){const out=[];for(let i=0;;i+=1000){const {data,error}=await build().range(i,i+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out}
const soft=async p=>{try{const r=await p;return r&&r.error?{data:null,error:r.error}:r}catch(e){return {data:null,error:e}}};

function gate(t,m){$("#app").innerHTML=`<div class="gate"><div><div class="eyebrow">TRUST realtor</div><h1>${esc(t)}</h1><p class="dim">${esc(m)}</p></div></div>`}

async function init(){
  if(!sb){gate("Sin conexión","No se pudo cargar el portal. Revisa tu conexión e inténtalo de nuevo.");return}
  if(!PROY||(!KEY&&!ADMIN)){gate("Sin acceso","Esta liga no es válida. Pide a TRUST una liga nueva.");return}
  if(KEY){
    const r=await soft(sb.from("dev_links").select("*").eq("proyecto",PROY).eq("key",KEY).eq("activo",true).maybeSingle());
    if(r.error||!r.data){gate("Sin acceso","Esta liga no es válida o fue desactivada. Pide a TRUST una liga nueva.");return}
    LINK=r.data;
    if(!ADMIN)sb.from("dev_links").update({ultimo_acceso:new Date().toISOString()}).eq("proyecto",PROY).eq("key",KEY).then(()=>{});
  }else{
    const r=await soft(sb.from("dev_links").select("*").eq("proyecto",PROY).maybeSingle());LINK=r.data||null;
  }
  document.title="TRUST realtor | "+PROY+" — Portal del desarrollador";
  try{await load()}catch(e){gate("No se pudieron leer los datos",e.message||String(e));return}
  window.addEventListener("hashchange",render);render();

}
/* fondo del inicio: primer render del proyecto (Inventario → Renders; exteriores primero) */
async function fondo(){
  if(!PROYECTO)return;const pid=PROYECTO.id,img=/\.(jpe?g|png|webp)$/i;
  const put=url=>{const im=new Image();im.onload=()=>{const b=document.querySelector(".bg");b.style.backgroundImage=`url("${url}")`;b.style.backgroundPosition="center 38%"};im.src=url};
  const fijo={balcana:"exteriores/1794609678655_Balcana_002.jpg",luciana:"amenidades/1794932524307_LOBBY.jpg"}[pid]; /* render elegido a mano por proyecto */
  if(fijo){put(sb.storage.from(BUCKET).getPublicUrl(pid+"/renders/"+fijo).data.publicUrl);return}
  for(const d of ["exteriores","","amenidades","interiores"]){
    const dir=pid+"/renders"+(d?"/"+d:"");
    const r=await soft(sb.storage.from(BUCKET).list(dir,{limit:100,sortBy:{column:"name",order:"asc"}}));
    const fl=(Array.isArray(r&&r.data)?r.data:[]).find(x=>x.id&&img.test(x.name)&&!/^planta_/i.test(x.name));
    if(fl){const url=sb.storage.from(BUCKET).getPublicUrl(dir+"/"+fl.name).data.publicUrl;put(url);return}
  }
}
async function load(){
  const [p,l,m,h,v,c,d]=await Promise.all([
    soft(sb.from("proyectos").select("*").eq("nombre",PROY).maybeSingle()),
    all(()=>sb.from("leads").select("id,fecha,nombre,telefono,canal,asesor,nc,seguimiento,hot,cita,visita,apartado,venta,perdido,futuro").eq("proyecto",PROY).order("fecha",{ascending:false}).order("id")),
    soft(sb.from("marketing_inversion").select("id,mes,plataforma,campana,monto,leads,categoria,pagado_por,notas").eq("proyecto",PROY).order("mes",{ascending:false})),
    soft(sb.from("ventas_reglas").select("hist:reglas->marketing_hist").eq("id",1).maybeSingle()),
    Promise.resolve({data:[]}), /* ventas: la fuente es el inventario (unidades vendidas con su cierre) */
    soft(sb.from("dev_clientes").select("*").eq("proyecto",PROY)),
    soft(sb.from("dev_cliente_docs").select("*").eq("proyecto",PROY).order("created_at",{ascending:false}))
  ]);
  PROYECTO=p.data||null;LEADS=l;MKT=m.data||[];HIST=((h.data&&h.data.hist)||{})[PROY]||{};
  VENTAS=[];
  const np=norm(PROY);VENTAS=(v.data||[]).filter(x=>(!x.tipo||x.tipo==="Venta")&&(norm(x.proyecto)===np||np.startsWith(norm(x.proyecto)+" ")));
  OK.contactos=!c.error;CONTACTOS=c.data||[];OK.docs=!d.error;DOCS=d.data||[];
  UNITS=[];if(PROYECTO){const u=await soft(sb.from("unidades").select("*").eq("proyecto_id",PROYECTO.id));UNITS=u.data||[]}
  buildSales();
}

/* ---------- cálculos ---------- */
const esCita=l=>l.cita||l.apartado||l.venta;
const inY=(d,y)=>!y||String(d||"").slice(0,4)===y;
function inv(){const c={tot:UNITS.length,Vendido:0,Apartado:0,Disponible:0,Bloqueado:0,otros:0,valDisp:0,valTot:0};UNITS.forEach(u=>{if(c[u.estatus]!=null&&u.estatus!=="tot")c[u.estatus]++;else c.otros++;c.valTot+=+u.precio||0;if(u.estatus==="Disponible")c.valDisp+=+u.precio||0});c.vendibles=c.tot-c.Bloqueado-c.otros;return c}
function mktData(y){
  const g=MKT.filter(x=>inY(x.mes,y)), le=LEADS.filter(l=>inY(l.fecha,y));
  const S_=a=>a.reduce((s,x)=>s+(+x.monto||0),0);
  const inver=S_(g), pauta=S_(g.filter(x=>!x.categoria||x.categoria==="Pauta digital"));
  const f={leads:le.length,cita:le.filter(esCita).length,visita:le.filter(l=>l.visita).length,apartado:le.filter(l=>l.apartado||l.venta).length,venta:le.filter(l=>l.venta).length,hot:le.filter(l=>l.hot).length};
  const meses={};const add=k=>meses[k]=meses[k]||{inv:0,leads:0,reg:0,cap:0,cita:0,visita:0,venta:0};
  g.forEach(x=>{const o=add(ym(x.mes));o.inv+=+x.monto||0;o.cap+=+x.leads||0});   /* cap = leads capturados en los gastos de pauta (Admin Proyectos) */
  le.forEach(l=>{const o=add(ym(l.fecha));o.reg++;if(esCita(l))o.cita++;if(l.visita)o.visita++;if(l.venta)o.venta++});
  /* leads del mes: los capturados en la pauta o los registrados uno por uno en Lead Management, el mayor (los meses anteriores al registro solo tienen los de la pauta) */
  Object.values(meses).forEach(o=>o.leads=Math.max(o.reg,o.cap));
  f.reg=f.leads;f.leads=Object.values(meses).reduce((a,o)=>a+o.leads,0);
  const by=(arr,k,val)=>{const o={};arr.forEach(x=>{const kk=x[k]||"Sin especificar";o[kk]=(o[kk]||0)+val(x)});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  return {g,le,inver,pauta,f,meses,plat:by(g,"plataforma",x=>+x.monto||0),cat:by(g,"categoria",x=>+x.monto||0),canal:by(le,"canal",()=>1)};
}
/* operaciones = unidades marcadas como Vendido en el inventario del proyecto (Admin → Inventario → Ventas) */
let SALES=[];
function buildSales(){
  SALES=UNITS.filter(u=>u.estatus==="Vendido").map(u=>({cliente:u.comprador||"",unidad:u.tipo||"",fecha:u.fecha_cierre||null,monto:+u.precio_cierre||null,asesor:u.asesor_cierre||"",u}));
  SALES.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
}
const ventasY=y=>SALES.filter(v=>v.fecha&&inY(v.fecha,y));
function metaInfo(y){
  const meta=+(LINK&&LINK.meta_mensual)||0;if(!meta)return null;
  const first=SALES.map(v=>ym(v.fecha)).filter(Boolean).sort()[0]||(CY+"-01");
  const desde=ym(LINK.meta_desde)||first;
  const act=m=>{const k=y+"-"+String(m).padStart(2,"0");return k>=desde};
  const hasta=+y<CY?12:+y>CY?0:CM;
  let acum=0,anual=0;for(let m=1;m<=12;m++){if(act(m)){anual+=meta;if(m<=hasta)acum+=meta}}
  return {meta,desde,act,acum,anual,hasta};
}
/* clientes: ventas registradas + compradores capturados en inventario */
const toks=s=>norm(s).split(" ").filter(t=>t.length>1);
const same=(a,b)=>{const A=toks(a),B=toks(b);if(A.length<2||B.length<2)return norm(a)===norm(b)&&!!norm(a);const [s,l]=A.length<=B.length?[A,B]:[B,A];return s.every(t=>l.includes(t))||(A[0]===B[0]&&A[1]===B[1])};
function clientes(){
  const out=SALES.filter(v=>v.cliente).map(v=>({key:slug(v.cliente),nombre:v.cliente,unidad:v.unidad,fecha:v.fecha,monto:v.monto,asesor:v.asesor,u:v.u}));
  out.forEach(c=>{
    c.ct=CONTACTOS.find(x=>x.cliente===c.key)||null;
    const ld=LEADS.find(l=>l.telefono&&same(l.nombre,c.nombre));
    c.tel=(c.ct&&c.ct.telefono)||(ld&&ld.telefono)||"";c.correo=(c.ct&&c.ct.correo)||"";c.canal=ld?ld.canal:"";

  levels.forEach(l=>{
    h+=`<div class="edfl">${esc(l)}<small>${/^pb$/i.test(l)?"P. BAJA":/^ph/i.test(l)?"":"NIVEL"}</small></div>`;
    towers.forEach((tw,i)=>{const us=deps.filter(u=>torreDe(u)===tw&&String(u.nivel).trim()===l).sort(byNum);
      h+=`<div class="edrow" style="grid-template-columns:repeat(${cols[i]},minmax(92px,1fr))">${us.map(tile).join("")}</div>`;if(i<towers.length-1)h+=`<div class="edmid"><i></i></div>`});
  });
  h+=`</div>`;
  if(locs.length)h+=`<div class="edgf"><div class="lbl">Locales comerciales</div><div class="edrow" style="grid-template-columns:repeat(${Math.max(locs.length,6)},minmax(92px,1fr))">${locs.sort(byNum).map(tile).join("")}</div></div>`;
  const has=k=>all.some(u=>EDST(u.estatus)===k);
  const bar=`<div class="edbar" style="margin-top:0"><button class="chip" data-edf="" aria-pressed="${ED.filt===""}">Todas</button>${recs.map(r=>`<button class="chip" data-edf="${esc(r)}" aria-pressed="${ED.filt===r}">${esc(r==="Est"?"Estudio":r)}</button>`).join("")}<button class="chip" data-eddisp aria-pressed="${ED.disp}">Solo disponibles</button>
    <div class="edleg"><span><i style="background:#E1F1E8;border:1px solid #2E7D5B"></i>Disponible</span><span><i style="background:#F2C94C"></i>Apartado</span><span><i style="background:#2F5597"></i>Vendido</span>${has("aportante")?`<span><i style="background:#E07A2F"></i>Aportante</span>`:""}${has("bloqueado")?`<span><i style="background:#B8B8B5"></i>Bloqueado</span>`:""}</div></div>`;
  return bar+`<div class="edwrap"><div><div class="edbld">${h}</div></div><div class="edside" id="edside">${edSideHTML()}</div></div>`;
}
function edSideHTML(){
  const u=UNITS.find(x=>String(x.id)===String(ED.sel));
  if(!u)return `<div class="edcard"><div class="edempty"><b>Elige una unidad</b>Toca cualquier cuadro del edificio para ver su detalle.</div></div>`;
  const {num,tip}=uParse(u),st=EDST(u.estatus),terr=edTerr(u),mi=+u.m2int||0,tot=(+u.m2tot||0)||mi+terr;
  const stCss=st==="disponible"?"":`style="background:${EDCOL[st]||"#D9D6CE"};color:${st==="apartado"?"#5E4A00":"#fff"}"`;
  return `<div class="edcard"><div class="bd"><span class="edst" ${stCss}>${esc(u.estatus||"—")}</span><h2>${/local|comerc/i.test(String(u.recamaras||""))?"Local":esOfi()?"Oficina":"Unidad"} ${esc(num)}</h2><div class="sub">${esc(tip||"")}${u.torre&&String(u.torre).trim()&&!torreEsTipo(u.torre)?" · Torre "+esc(u.torre):""}${u.nivel?" · Nivel "+esc(u.nivel):""}${u.vista?" · Vista "+esc(String(u.vista).toLowerCase()):""}</div>
    <div class="edprice">${fmt(+u.precio||null)}</div><div class="edpm2">Precio de lista${tot&&+u.precio?" · "+fmt(u.precio/tot)+" / m² total":""}</div>
    ${st==="vendido"&&(+u.precio_cierre||u.fecha_cierre)?`<div class="edspecs" style="grid-template-columns:1fr 1fr"><div><b>${fmt(+u.precio_cierre||null)}</b><span>Precio de cierre</span></div><div><b>${u.fecha_cierre?fechaTxt(u.fecha_cierre):"—"}</b><span>Fecha de cierre</span></div></div>`:""}
    <div class="edspecs"><div><b>${mi?mi.toFixed(2):"—"}</b><span>m² interior</span></div><div><b>${terr.toFixed(2)}</b><span>m² terraza</span></div><div><b>${tot?tot.toFixed(2):"—"}</b><span>m² total</span></div></div>
    <div class="edspecs">${esOfi()?"":`<div><b>${esc(u.recamaras||"—")}</b><span>Tipología</span></div><div><b>${esc(u.banos??"—")}</b><span>Baños</span></div>`}<div><b>${esc(u.parking??"—")}</b><span>Cajones</span></div></div>
    </div></div>`;
}
function bindInv(){
  const re=()=>{const y=window.scrollY;$("#app").innerHTML=shell(vInv());bindInv();window.scrollTo(0,y)};
  document.querySelectorAll("[data-iv]").forEach(b=>b.onclick=()=>{S.invV=b.dataset.iv;re()});
  document.querySelectorAll("[data-ist]").forEach(b=>b.onclick=()=>{S.invSt=b.dataset.ist;re()});
  const q=$("#i-q");if(q)q.oninput=()=>{S.invQ=q.value;const pos=q.selectionStart;re();const n=$("#i-q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  document.querySelectorAll("[data-eu]").forEach(b=>b.onclick=()=>{ED.sel=b.dataset.eu;document.querySelectorAll(".eu.sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");const sd=$("#edside");sd.innerHTML=edSideHTML();if(window.innerWidth<980)sd.scrollIntoView({behavior:"smooth",block:"start"})});
  document.querySelectorAll("[data-edf]").forEach(b=>b.onclick=()=>{ED.filt=b.dataset.edf;re()});
  const d=document.querySelector("[data-eddisp]");if(d)d.onclick=()=>{ED.disp=!ED.disp;re()};
}
/* inventario en vivo: vuelve a leer las unidades cada minuto y al regresar a la pestaña */
async function liveInv(){
  if(!PROYECTO||document.hidden)return;
  const u=await soft(sb.from("unidades").select("*").eq("proyecto_id",PROYECTO.id));if(u.error||!u.data)return;
  const sig=a=>JSON.stringify(a.map(x=>[x.id,x.estatus,x.precio,x.precio_cierre,x.fecha_cierre,x.comprador]).sort());
  if(sig(u.data)===sig(UNITS))return;UNITS=u.data;buildSales();
  if(route()==="inventario"&&!$("#drawer-root").innerHTML&&document.activeElement?.id!=="i-q"){const y=window.scrollY;$("#app").innerHTML=shell(vInv());bindInv();window.scrollTo(0,y)}
}
setInterval(liveInv,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)liveInv()});
init();
</script>
